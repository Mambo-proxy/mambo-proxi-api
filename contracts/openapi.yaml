              titleMobile: { type: [string, 'null'], maxLength: 80 }
              lead: { type: [string, 'null'], maxLength: 200 }
              leadMobile: { type: [string, 'null'], maxLength: 120 }
              offers: { type: array, maxItems: 12, items: { $ref: '#/components/schemas/ServiceOfferInput' } }
        quoteFields: { type: array, maxItems: 12, items: { $ref: '#/components/schemas/QuoteField' } }
        ctaTitle: { type: [string, 'null'] }
        ctaText: { type: [string, 'null'] }
        seoTitle: { type: [string, 'null'], maxLength: 60 }
        seoDescription: { type: [string, 'null'], maxLength: 160 }

    CategoryInput:
      allOf:
        - $ref: '#/components/schemas/CategoryFields'
        - type: object
          required: [name, tagline, description, icon, tint]

    CategoryPatch:
      allOf:
        - $ref: '#/components/schemas/CategoryFields'
        - type: object
          minProperties: 1

    AdminCategory:
      allOf:
        - $ref: '#/components/schemas/CategoryFields'

    MagazineArticlePatch:
      allOf:
        - $ref: '#/components/schemas/MagazineArticleFields'
        - type: object
          minProperties: 1

    AdminMagazineArticle:
      type: object
      required: [id, title, titleEn, theme, themeEn, excerpt, excerptEn, body, bodyEn, image, languages, edition, updatedAt]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        title: { type: string }
        titleEn: { type: [string, 'null'] }
        theme: { type: string }
        themeEn: { type: [string, 'null'] }
        excerpt: { type: [string, 'null'] }
        excerptEn: { type: [string, 'null'] }
        body: { type: [string, 'null'] }
        bodyEn: { type: [string, 'null'] }
        image: { oneOf: [{ $ref: '#/components/schemas/MediaImage' }, { type: 'null' }] }

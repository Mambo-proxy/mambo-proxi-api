                    required: [id]
                    properties:
                      image: { oneOf: [{ $ref: '#/components/schemas/MediaImage' }, { type: 'null' }] }
            relatedServiceIds: { type: array, items: { $ref: '#/components/schemas/Id' } }
            featuredReviewIds: { type: array, items: { $ref: '#/components/schemas/Id' } }
            showWhatsapp: { type: boolean }
            seoTitle: { type: [string, 'null'] }
            seoDescription: { type: [string, 'null'] }
            publishedAt: { oneOf: [{ $ref: '#/components/schemas/DateTime' }, { type: 'null' }] }
            completenessDetail: { $ref: '#/components/schemas/Completeness' }
            version: { type: string, description: Valeur à renvoyer dans `If-Match`. }

    Completeness:
      type: object
      required: [percent, criteria]
      properties:
        percent: { type: integer, minimum: 0, maximum: 100 }
        criteria:
          type: array
          items:
            type: object
            required: [key, label, done]
            properties:
              key: { type: string, enum: [general, audiences, steps, advantages, faq, related, coverImage] }
              label: { type: string, examples: [Informations générales] }
              done: { type: boolean }

    CategoryFields:
      type: object
      properties:
        name: { type: string, maxLength: 80 }
        slug: { $ref: '#/components/schemas/Slug' }
        tagline: { type: string, maxLength: 120 }
        description: { type: string, maxLength: 600 }
        eyebrow: { type: [string, 'null'], maxLength: 60 }
        heroTitle: { $ref: '#/components/schemas/AccentText' }
        heroLead: { type: string, maxLength: 400 }
        audiencesTitle: { type: [string, 'null'], maxLength: 160 }
        servicesTitle: { type: [string, 'null'], maxLength: 160 }
        servicesLead: { type: [string, 'null'], maxLength: 300 }
        processTitle: { type: [string, 'null'], maxLength: 160 }
        homeCard:
          type: object
          properties:
            title: { type: string, maxLength: 80 }
            text: { type: string, maxLength: 200 }
            textMobile: { type: [string, 'null'], maxLength: 120 }

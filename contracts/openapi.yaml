      tags: [Admin — Rendez-vous]
      operationId: adminActOnAppointment
      summary: Confirmer, proposer un autre créneau, annuler, terminer
      description: |
        `confirm` → e-mail de confirmation avec fichier `.ics` (+ lien visio si format Visio).
        `propose` → e-mail avec bouton d'acceptation du nouveau créneau.
        `cancel` → e-mail d'annulation. `complete` → statut « Terminé ».
      security: [{ cookieAuth: [], csrfToken: [] }]
      parameters: [{ $ref: '#/components/parameters/IdPath' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AppointmentAction' }
      responses:
        '200':
          description: Rendez-vous mis à jour.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminAppointment' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }


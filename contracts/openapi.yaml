        status: { $ref: '#/components/schemas/SubscriberStatus' }
        tags: { type: array, items: { type: string } }
        source: { type: [string, 'null'] }
        confirmedAt: { oneOf: [{ $ref: '#/components/schemas/DateTime' }, { type: 'null' }] }

              schema:
                type: object
                required: [data, pending]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/AdminAppointment' } }
                  pending: { type: array, items: { $ref: '#/components/schemas/AdminAppointment' } }
              examples:
                default: { $ref: '#/components/examples/AdminAppointments' }
        '401': { $ref: '#/components/responses/Unauthorized' }

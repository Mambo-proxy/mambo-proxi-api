      allOf:
        - $ref: '#/components/schemas/AdminPageSummary'
        - type: object
          required: [sections, allowedSectionTypes, seo]
          properties:
            sections:
              type: array
              description: Brouillon s'il existe, sinon version publiée — toutes les sections, y compris masquées.
              items: { $ref: '#/components/schemas/PageSection' }
            allowedSectionTypes: { type: array, items: { $ref: '#/components/schemas/PageSectionType' } }
            seo: { $ref: '#/components/schemas/Seo' }

    PageDraftInput:
      type: object
      required: [sections]
      properties:
        sections: { type: array, maxItems: 40, items: { $ref: '#/components/schemas/PageSection' } }
        seo: { $ref: '#/components/schemas/Seo' }

    # ──────────────────────────── Admin — Avis ──────────────────────
    ReviewStatus:
      type: string
      enum: [A_VALIDER, PUBLIE, MASQUE]
      description: Libellés — À valider, Publié, Masqué.

    AdminReview:
      type: object
      required: [id, authorName, rating, text, status, verified, featured, publishConsent, createdAt]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        authorName: { type: string }
        initials: { type: string }
        city: { type: [string, 'null'] }
        rating: { type: integer, minimum: 1, maximum: 5 }
        text: { type: string }
        service: { oneOf: [{ $ref: '#/components/schemas/CategoryRef' }, { type: 'null' }], description: Service (slug + nom). }
        requestReference: { oneOf: [{ $ref: '#/components/schemas/Reference' }, { type: 'null' }] }
        serviceDate: { oneOf: [{ $ref: '#/components/schemas/DateTime' }, { type: 'null' }] }
        status: { $ref: '#/components/schemas/ReviewStatus' }
        verified: { type: boolean }
        featured: { type: boolean }
        publishConsent: { type: boolean }
        answers:
          type: array
          items:
            type: object
            required: [question, answer]
            properties:
              question: { type: string }
              answer: { type: string }
        reply: { type: [string, 'null'] }
        publishedAt: { oneOf: [{ $ref: '#/components/schemas/DateTime' }, { type: 'null' }] }
        createdAt: { $ref: '#/components/schemas/DateTime' }

    ReviewInput:
      type: object
      required: [authorName, rating, text]
      properties:
        authorName: { type: string, maxLength: 60 }
        city: { type: [string, 'null'], maxLength: 80 }
        rating: { type: integer, minimum: 1, maximum: 5 }
        text: { type: string, minLength: 10, maxLength: 2000 }
        serviceId: { oneOf: [{ $ref: '#/components/schemas/Id' }, { type: 'null' }] }
        date: { oneOf: [{ $ref: '#/components/schemas/DateTime' }, { type: 'null' }] }
        status: { $ref: '#/components/schemas/ReviewStatus' }

    ReviewStats:
      type: object
      required: [average, published, toValidate, responseRate, distribution]
      properties:
        average: { type: number }
        averageDelta:
          type: [number, 'null']
          description: Évolution de la note moyenne sur 30 jours (écart avec les 30 jours précédents, en points de note).
        published: { type: integer }
        toValidate: { type: integer }
        hidden: { type: integer }
        responseRate: { type: number, description: Taux de réponse au questionnaire (%). }
        surveysSent: { type: integer }
        recommendationRate: { type: [number, 'null'], description: Part des notes de recommandation 9 ou 10 (%). }
        recommendationDelta:
          type: [number, 'null']
          description: Évolution de la part des notes 9 ou 10 sur 30 jours (en points de pourcentage).
        npsAverage: { type: [number, 'null'] }
        distribution: { $ref: '#/components/schemas/ReviewSummary/properties/distribution' }

    AdminSurveyQuestion:
      allOf:
        - $ref: '#/components/schemas/SurveyQuestion'
        - type: object
          required: [active]
          properties:
            active: { type: boolean }

    SurveyQuestionInput:
      type: object
      required: [kind, label, required, active]
      properties:
        id: { oneOf: [{ $ref: '#/components/schemas/Id' }, { type: 'null' }] }
        kind: { $ref: '#/components/schemas/SurveyQuestionKind' }
        label: { type: string, maxLength: 200 }
        helpText: { type: [string, 'null'], maxLength: 200 }
        options: { type: array, maxItems: 10, items: { type: string, maxLength: 60 } }
        required: { type: boolean }
        active: { type: boolean }

    # ─────────────────────────── Admin — Rendez-vous ────────────────
    AppointmentStatus:
      type: string
      enum: [A_CONFIRMER, CONFIRME, AUTRE_CRENEAU_PROPOSE, ANNULE, TERMINE]
      description: Libellés — À confirmer, Confirmé, Autre créneau proposé, Annulé, Terminé.

    AdminAppointment:
      type: object
      required: [id, reference, contact, reason, format, startsAt, endsAt, status, createdAt]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        reference: { $ref: '#/components/schemas/Reference' }
        contact: { $ref: '#/components/schemas/ContactSummary' }
        reason: { $ref: '#/components/schemas/AppointmentReason' }
        format: { $ref: '#/components/schemas/AppointmentFormat' }
        startsAt: { $ref: '#/components/schemas/DateTime' }
        endsAt: { $ref: '#/components/schemas/DateTime' }
        status: { $ref: '#/components/schemas/AppointmentStatus' }
        proposedStartsAt: { oneOf: [{ $ref: '#/components/schemas/DateTime' }, { type: 'null' }] }
        location: { type: [string, 'null'] }
        videoLink: { type: [string, 'null'], format: uri }
        message: { type: [string, 'null'] }
        notes: { type: [string, 'null'] }
        reminderSentAt: { oneOf: [{ $ref: '#/components/schemas/DateTime' }, { type: 'null' }] }
        assignedTo: { oneOf: [{ $ref: '#/components/schemas/UserRef' }, { type: 'null' }], description: Personne chargée du rendez-vous. }
        createdAt: { $ref: '#/components/schemas/DateTime' }

    AdminAppointmentInput:
      type: object
      required: [contact, reason, format, startsAt]
      properties:
        contact: { $ref: '#/components/schemas/ContactIdentity' }
        reason: { $ref: '#/components/schemas/AppointmentReason' }
        format: { $ref: '#/components/schemas/AppointmentFormat' }
        startsAt: { $ref: '#/components/schemas/DateTime' }
        durationMinutes: { type: integer, minimum: 15, maximum: 480, default: 90 }
        location: { type: [string, 'null'] }
        videoLink: { type: [string, 'null'], format: uri }
        notes: { type: [string, 'null'], maxLength: 2000 }
        notifyClient: { type: boolean, default: true }
        assignedToId: { oneOf: [{ $ref: '#/components/schemas/Id' }, { type: 'null' }], description: Absent = l'utilisateur qui saisit le rendez-vous. }

    AppointmentAction:
      oneOf:
        - type: object
          title: Confirmer
          required: [action]
          properties:
            action: { type: string, const: confirm }
            videoLink: { type: [string, 'null'], format: uri }
            location: { type: [string, 'null'] }
        - type: object
          title: Proposer un autre créneau
          required: [action, proposedStartsAt]
          properties:
            action: { type: string, const: propose }
            proposedStartsAt: { $ref: '#/components/schemas/DateTime' }
            message: { type: [string, 'null'], maxLength: 1000 }
        - type: object
          title: Annuler
          required: [action]
          properties:
            action: { type: string, const: cancel }
            message: { type: [string, 'null'], maxLength: 1000 }
        - type: object
          title: Terminer
          required: [action]
          properties:
            action: { type: string, const: complete }
        - type: object
          title: Modifier les notes
          required: [action, notes]
          properties:
            action: { type: string, const: notes }
            notes: { type: [string, 'null'], maxLength: 2000 }
        - type: object
          title: Assigner
          required: [action, assignedToId]
          properties:
            action: { type: string, const: assign }
            assignedToId: { oneOf: [{ $ref: '#/components/schemas/Id' }, { type: 'null' }] }

    AvailabilityConfig:
      type: object
      required: [rules, exceptions, minNoticeHours, maxAdvanceDays]
      properties:
        rules:
          type: array
          items:
            type: object
            required: [weekday, startTime, endTime, slotMinutes, formats]
            properties:
              id: { oneOf: [{ $ref: '#/components/schemas/Id' }, { type: 'null' }] }
              weekday: { type: integer, minimum: 1, maximum: 7, description: 1 = lundi … 7 = dimanche. }
              startTime: { type: string, pattern: '^([01]\d|2[0-3]):[0-5]\d$', examples: ['09:00'] }
              endTime: { type: string, pattern: '^([01]\d|2[0-3]):[0-5]\d$', examples: ['17:00'] }
              slotMinutes: { type: integer, minimum: 15, maximum: 240 }
              formats: { type: array, minItems: 1, items: { $ref: '#/components/schemas/AppointmentFormat' } }
        exceptions:
          type: array
          items:
            type: object
            required: [date, closed]
            properties:
              id: { oneOf: [{ $ref: '#/components/schemas/Id' }, { type: 'null' }] }
              date: { type: string, format: date }
              closed: { type: boolean }
              startTime: { type: [string, 'null'] }
              endTime: { type: [string, 'null'] }
              label: { type: [string, 'null'], examples: [Fête nationale] }
        minNoticeHours: { type: integer, minimum: 0, maximum: 168, default: 24 }
        maxAdvanceDays: { type: integer, minimum: 7, maximum: 365, default: 60 }
        agencyAddress: { type: [string, 'null'] }
        defaultVideoLink: { type: [string, 'null'], format: uri }


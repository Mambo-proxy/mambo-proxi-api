openapi: 3.1.0
info:
  title: API MAMBO Proxi
  version: 1.0.0
  summary: API du site officiel MAMBO Proxi (site public et back-office).
  description: |
    Contrat de référence partagé par le site (`mambo-proxi-web`) et l'API (`mambo-proxi-api`).
    Toute évolution d'un échange commence par une modification de ce fichier.

    Conventions :
    - préfixe `/v1`, JSON en `camelCase`, dates ISO 8601 en UTC ;
    - pagination `?page=&pageSize=` → `{ data, meta: { page, pageSize, total, totalPages } }` ;
    - tri `?sort=-createdAt` (préfixe `-` = décroissant) ;
    - erreurs au format RFC 9457 « Problem Details » (`application/problem+json`), messages en français prêts à afficher ;
    - références lisibles des demandes `MP-AAAA-NNNN` (séquence annuelle) ;
    - aucun prix n'est stocké ni renvoyé pour les prestations (devis uniquement).

    Authentification du back-office : cookies `httpOnly` (`mp_at` jeton d'accès 15 min, `mp_rt` jeton de rafraîchissement rotatif),
    plus un jeton CSRF « double-submit » : cookie lisible `mp_csrf` recopié dans l'en-tête `X-CSRF-Token` pour toute mutation.
  contact:
    name: MAMBO Proxi
    email: contact@mamboproxi.com
  license:
    name: Propriétaire — MAMBO Proxi
    identifier: LicenseRef-Proprietary
servers:
  - url: http://localhost:4000
    description: Développement local
  - url: https://api.mamboproxi.com
    description: Production
tags:
  - name: Site
    description: Paramètres, navigation, pages éditoriales et plan du site.
  - name: Catalogue
    description: Rubriques et services.
  - name: Avis
    description: Avis clients publiés.
  - name: Contenus
    description: Partenaires, formations, offres d'emploi, agenda.
  - name: Formulaires
    description: Envois publics (devis, contact, rendez-vous, inscription…).
  - name: Newsletter
    description: Inscription en double opt-in, confirmation, désinscription.
  - name: Questionnaire
    description: Questionnaire de satisfaction (lien reçu par e-mail).
  - name: Santé
    description: Supervision de l'API.
  - name: Authentification
    description: Connexion au back-office (mot de passe + code par e-mail), sessions.
  - name: Admin — Tableau de bord
    description: 'Back-office : tableau de bord.'
  - name: Admin — Demandes
    description: 'Back-office : demandes.'
  - name: Admin — Services
    description: 'Back-office : services.'
  - name: Admin — Pages
    description: 'Back-office : pages.'
  - name: Admin — Avis
    description: 'Back-office : avis.'
  - name: Admin — Rendez-vous
    description: 'Back-office : rendez-vous.'
  - name: Admin — Recrutement
    description: 'Back-office : recrutement.'
  - name: Admin — Partenaires
    description: 'Back-office : partenaires.'
  - name: Admin — Formations
    description: 'Back-office : formations.'
  - name: Admin — Agenda
    description: 'Back-office : agenda.'
  - name: Admin — Contacts
    description: 'Back-office : contacts.'
  - name: Admin — Newsletter
    description: 'Back-office : newsletter.'
  - name: Admin — Paramètres
    description: 'Back-office : paramètres.'
  - name: Admin — Utilisateurs
    description: 'Back-office : utilisateurs.'
  - name: Admin — Médias
    description: 'Back-office : médias.'
  - name: Admin — Journal
    description: 'Back-office : journal.'
paths:
  # ───────────────────────────── Site ─────────────────────────────
  /v1/site/settings:
    get:
      tags: [Site]
      operationId: getSiteSettings
      summary: Paramètres publics du site
      description: Coordonnées, WhatsApp, réseaux, agence, chiffres clés, clés publiques (Turnstile, GA4). Tag de revalidation `settings`.
      responses:
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '200':
          description: Paramètres publics.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SiteSettings' }
              examples:
                default: { $ref: '#/components/examples/SiteSettings' }

  /v1/site/navigation:
    get:
      tags: [Site]
      operationId: getNavigation
      summary: Menu principal, méga-menu, sous-menus et pied de page
      description: Les entrées du méga-menu sont générées à partir des rubriques publiées et des services `showInMenu`. Tag `navigation`.
      responses:
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '200':
          description: Navigation.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Navigation' }
              examples:
                default: { $ref: '#/components/examples/Navigation' }

  /v1/site/redirects:
    get:
      tags: [Site]
      operationId: listRedirects
      summary: Redirections 301 (changements de slug de services publiés)
      responses:
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '200':
          description: Redirections.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Redirect' }
              example:
                - { from: /services/experience/chef-a-domicile, to: /services/experience/chef-prive, permanent: true }

  /v1/pages/{key}:
    get:
      tags: [Site]
      operationId: getPage
      summary: Sections publiées d'une page éditoriale
      parameters:
        - $ref: '#/components/parameters/PageKeyPath'
        - $ref: '#/components/parameters/Preview'
      responses:
        '200':
          description: Page.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Page' }
              examples:
                accueil: { $ref: '#/components/examples/PageAccueil' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/sitemap:
    get:
      tags: [Site]
      operationId: getSitemap
      summary: URLs publiques et date de dernière modification
      responses:
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '200':
          description: Entrées du plan du site.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/SitemapEntry' }
              example:
                - { path: /, lastModified: '2026-10-20T08:00:00.000Z', changeFrequency: weekly, priority: 1 }
                - { path: /services/experience/chef-prive, lastModified: '2026-10-18T14:12:00.000Z', changeFrequency: monthly, priority: 0.8 }

  /v1/health:
    get:
      tags: [Santé]
      operationId: getHealth
      summary: État de l'API et de ses dépendances
      responses:
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '200':
          description: Tout fonctionne.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
              example: { status: ok, version: 1.0.0, checks: { database: up, redis: up, storage: up } }
        '503':
          description: Une dépendance est indisponible.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }

  # ─────────────────────────── Catalogue ──────────────────────────
  /v1/categories:
    get:
      tags: [Catalogue]
      operationId: listCategories
      summary: Rubriques publiées
      parameters:
        - name: include
          in: query
          description: '`services` pour inclure les services publiés de chaque rubrique.'
          schema: { type: string, enum: [services] }
      responses:
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '200':
          description: Rubriques triées.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CategorySummary' }
              examples:
                default: { $ref: '#/components/examples/Categories' }

  /v1/categories/{slug}:
    get:
      tags: [Catalogue]
      operationId: getCategory
      summary: Page rubrique complète
      parameters:
        - $ref: '#/components/parameters/SlugPath'
        - $ref: '#/components/parameters/Preview'
      responses:
        '200':
          description: Rubrique.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CategoryDetail' }
              examples:
                experience: { $ref: '#/components/examples/CategoryExperience' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/services:
    get:
      tags: [Catalogue]
      operationId: listServices
      summary: Services publiés
      parameters:
        - name: category
          in: query
          schema: { $ref: '#/components/schemas/Slug' }
        - name: featured
          in: query
          schema: { type: boolean }
        - $ref: '#/components/parameters/Q'
      responses:
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '200':
          description: Services triés (rubrique puis ordre).
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ServiceSummary' }

  /v1/services/{slug}:
    get:
      tags: [Catalogue]
      operationId: getService
      summary: Fiche service
      parameters:
        - $ref: '#/components/parameters/SlugPath'
        - $ref: '#/components/parameters/Preview'
      responses:
        '200':
          description: Service avec services liés et avis.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceDetail' }
              examples:
                chefPrive: { $ref: '#/components/examples/ServiceChefPrive' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ──────────────────────────── Avis ──────────────────────────────
  /v1/reviews:
    get:
      tags: [Avis]
      operationId: listReviews
      summary: Avis publiés
      parameters:
        - name: category
          in: query
          schema: { $ref: '#/components/schemas/Slug' }
        - name: service
          in: query
          schema: { $ref: '#/components/schemas/Slug' }
        - name: featured
          in: query
          schema: { type: boolean }
        - name: sort
          in: query
          schema: { type: string, enum: [recent, rating], default: recent }
        - $ref: '#/components/parameters/Page'
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 12 }
      responses:
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '200':
          description: Page d'avis.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Review' } }
                  meta: { $ref: '#/components/schemas/PaginationMeta' }
              examples:
                default: { $ref: '#/components/examples/ReviewsPage' }

  /v1/reviews/summary:
    get:
      tags: [Avis]
      operationId: getReviewSummary
      summary: Note moyenne et répartition
      parameters:
        - name: category
          in: query
          schema: { $ref: '#/components/schemas/Slug' }
        - name: service
          in: query
          schema: { $ref: '#/components/schemas/Slug' }
      responses:
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '200':
          description: Synthèse.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReviewSummary' }
              example: { average: 4.9, total: 120, verifiedCount: 112, distribution: { '5': 104, '4': 13, '3': 2, '2': 1, '1': 0 } }

  # ─────────────────────────── Contenus ───────────────────────────
  /v1/partners:
    get:
      tags: [Contenus]
      operationId: listPartners
      summary: Partenaires visibles
      parameters:
        - name: category
          in: query
          schema: { $ref: '#/components/schemas/PartnerCategory' }
      responses:
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '200':
          description: Partenaires triés.
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Partner' } }
              examples:
                default: { $ref: '#/components/examples/Partners' }

  /v1/trainings:
    get:
      tags: [Contenus]
      operationId: listTrainings
      summary: Catalogue des formations
      parameters:
        - name: category
          in: query
          schema: { $ref: '#/components/schemas/TrainingCategory' }
      responses:
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '200':
          description: Formations publiées.
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Training' } }
              examples:
                default: { $ref: '#/components/examples/Trainings' }

  /v1/jobs:
    get:
      tags: [Contenus]
      operationId: listJobs
      summary: Offres d'emploi publiées et non expirées
      parameters:
        - name: city
          in: query
          schema: { type: string }
        - name: contract
          in: query
          schema: { type: string }
        - $ref: '#/components/parameters/Q'
      responses:
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '200':
          description: Offres.
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/JobOfferSummary' } }
              examples:
                default: { $ref: '#/components/examples/Jobs' }

  /v1/jobs/{slug}:
    get:
      tags: [Contenus]
      operationId: getJob
      summary: Détail d'une offre
      parameters:
        - $ref: '#/components/parameters/SlugPath'
        - $ref: '#/components/parameters/Preview'
      responses:
        '200':
          description: Offre.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobOfferDetail' }
              examples:
                default: { $ref: '#/components/examples/JobDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
        '410':
          description: Offre pourvue ou expirée.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example:
                type: https://api.mamboproxi.com/problems/job-closed
                title: Offre pourvue
                status: 410
                detail: Cette offre n'est plus disponible. Découvrez nos autres postes ouverts.

  /v1/events:
    get:
      tags: [Contenus]
      operationId: listEvents
      summary: Agenda culturel
      parameters:
        - name: upcoming
          in: query
          schema: { type: boolean, default: true }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50 }
        - $ref: '#/components/parameters/Page'
      responses:
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '200':
          description: Événements publiés.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Event' } }
                  meta: { $ref: '#/components/schemas/PaginationMeta' }
              examples:
                default: { $ref: '#/components/examples/EventsPage' }

  # ─────────────────────────── Rendez-vous ────────────────────────
  /v1/appointments/availability:
    get:
      tags: [Formulaires]
      operationId: getAvailability
      summary: Jours et créneaux libres
      description: Règles hebdomadaires − fermetures exceptionnelles − RDV confirmés ou à confirmer − délai minimal de 24 h. Dimanches fermés par défaut.
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string, format: date }
        - name: to
          in: query
          required: true
          description: 62 jours maximum après `from`.
          schema: { type: string, format: date }
        - name: format
          in: query
          schema: { $ref: '#/components/schemas/AppointmentFormat' }
      responses:
        '200':
          description: Disponibilités.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Availability' }
              examples:
                default: { $ref: '#/components/examples/Availability' }
        '422': { $ref: '#/components/responses/ValidationError' }

  # ─────────────────────────── Formulaires ────────────────────────
  /v1/quote-requests:
    post:
      tags: [Formulaires]
      operationId: createQuoteRequest
      summary: Demande de devis gratuit
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QuoteRequestInput' }
            examples:
              chefPrive: { $ref: '#/components/examples/QuoteRequestInput' }
      responses:
        '201':
          description: Demande enregistrée ; accusé de réception envoyé.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SubmissionAccepted' }
        '400': { $ref: '#/components/responses/SpamRejected' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /v1/contact-messages:
    post:
      tags: [Formulaires]
      operationId: createContactMessage
      summary: Message de contact ou demande d'information
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ContactMessageInput' }
            example:
              type: INFORMATION
              contact: { fullName: Paul Ekotto, email: paul.ekotto@example.com, phone: '+33600000000', country: FR }
              subject: Information sur un service
              serviceSlug: recherche-logement
              message: Bonjour, je souhaiterais savoir comment se déroule une recherche de logement à Douala depuis la France.
              consent: true
              antiSpam: { turnstileToken: XXXX.DUMMY.TOKEN.XXXX, honeypot: '', startedAt: '2026-10-20T09:41:12.000Z' }
      responses:
        '201':
          description: Message enregistré.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SubmissionAccepted' }
        '400': { $ref: '#/components/responses/SpamRejected' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /v1/appointments:
    post:
      tags: [Formulaires]
      operationId: createAppointment
      summary: Demande de rendez-vous (statut « À confirmer »)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AppointmentInput' }
            example:
              reason: DEVIS
              format: VISIO
              startsAt: '2026-10-22T09:00:00.000Z'
              contact: { fullName: Aminata Diallo, email: aminata.diallo@example.com, phone: '+237600000000' }
              message: Je souhaite parler d'un dîner pour 12 personnes en décembre.
              consent: true
              antiSpam: { turnstileToken: XXXX.DUMMY.TOKEN.XXXX, honeypot: '', startedAt: '2026-10-20T09:41:12.000Z' }
      responses:
        '201':
          description: Demande enregistrée.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SubmissionAccepted' }
              example:
                reference: MP-2026-0143
                message: Votre demande de rendez-vous est enregistrée. Nous la confirmons par e-mail très rapidement.
        '400': { $ref: '#/components/responses/SpamRejected' }
        '409':
          description: Le créneau vient d'être réservé.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example:
                type: https://api.mamboproxi.com/problems/slot-taken
                title: Créneau indisponible
                status: 409
                detail: Ce créneau vient d'être réservé. Choisissez un autre horaire.
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /v1/registrations:
    post:
      tags: [Formulaires]
      operationId: createRegistration
      summary: Inscription particulier ou professionnel / partenaire
      description: Crée ou met à jour une fiche contact (pas de compte avec mot de passe au lot 1).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegistrationInput' }
            example:
              profile: PARTICULIER
              firstName: Aminata
              lastName: Diallo
              email: aminata.diallo@example.com
              phone: '+33600000000'
              country: FR
              city: Lyon
              interests: [experience, immobilier]
              newsletter: false
              consent: true
              antiSpam: { turnstileToken: XXXX.DUMMY.TOKEN.XXXX, honeypot: '', startedAt: '2026-10-20T09:41:12.000Z' }
      responses:
        '201':
          description: Inscription enregistrée ; e-mail « Inscription confirmée » envoyé.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SubmissionAccepted' }
        '400': { $ref: '#/components/responses/SpamRejected' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /v1/training-requests:
    post:
      tags: [Formulaires]
      operationId: createTrainingRequest
      summary: Demande de formation
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TrainingRequestInput' }
      responses:
        '201':
          description: Demande enregistrée.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SubmissionAccepted' }
        '400': { $ref: '#/components/responses/SpamRejected' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /v1/partner-requests:
    post:
      tags: [Formulaires]
      operationId: createPartnerRequest
      summary: Demande « Devenir partenaire »
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PartnerRequestInput' }
      responses:
        '201':
          description: Demande enregistrée.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SubmissionAccepted' }
        '400': { $ref: '#/components/responses/SpamRejected' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /v1/event-registrations:
    post:
      tags: [Formulaires]
      operationId: createEventRegistration
      summary: Inscription à un événement de l'agenda
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EventRegistrationInput' }
      responses:
        '201':
          description: Inscription enregistrée.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SubmissionAccepted' }
        '400': { $ref: '#/components/responses/SpamRejected' }
        '409':
          description: Plus de places disponibles.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example:
                type: https://api.mamboproxi.com/problems/event-full
                title: Complet
                status: 409
                detail: Il ne reste plus assez de places pour cet événement.
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /v1/job-applications:
    post:
      tags: [Formulaires]
      operationId: createJobApplication
      summary: Candidature (offre ou spontanée) avec CV
      description: CV obligatoire, PDF/DOC/DOCX, 5 Mo maximum ; type réel contrôlé par signature de fichier.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: '#/components/schemas/JobApplicationInput' }
            encoding:
              cv:
                contentType: application/pdf, application/msword, application/vnd.openxmlformats-officedocument.wordprocessingml.document
      responses:
        '201':
          description: Candidature enregistrée.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SubmissionAccepted' }
        '400': { $ref: '#/components/responses/SpamRejected' }
        '413':
          description: Fichier trop volumineux.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example:
                type: https://api.mamboproxi.com/problems/file-too-large
                title: Fichier trop volumineux
                status: 413
                detail: Votre CV dépasse 5 Mo. Compressez-le ou envoyez une version PDF plus légère.
        '415':
          description: Type de fichier refusé.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example:
                type: https://api.mamboproxi.com/problems/unsupported-file
                title: Format non accepté
                status: 415
                detail: 'Formats acceptés pour le CV : PDF, DOC ou DOCX.'
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  # ─────────────────────────── Newsletter ─────────────────────────
  /v1/newsletter/subscriptions:
    post:
      tags: [Newsletter]
      operationId: subscribeNewsletter
      summary: Inscription (double opt-in)
      description: Envoie l'e-mail de confirmation. Réponse identique si l'adresse est déjà inscrite (pas de fuite d'information) ; `alreadySubscribed` n'est vrai que pour une adresse déjà confirmée.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NewsletterSubscriptionInput' }
            example:
              name: Aminata Diallo
              email: aminata.diallo@example.com
              phone: '+237600000000'
              source: footer
              consent: true
              antiSpam: { turnstileToken: XXXX.DUMMY.TOKEN.XXXX, honeypot: '', startedAt: '2026-10-20T09:41:12.000Z' }
      responses:
        '202':
          description: E-mail de confirmation envoyé.
          content:
            application/json:
              schema:
                type: object
                required: [message, alreadySubscribed]
                properties:
                  message: { type: string }
                  alreadySubscribed: { type: boolean }
              example:
                message: Merci ! Confirmez votre inscription dans l'e-mail que nous venons de vous envoyer.
                alreadySubscribed: false
        '400': { $ref: '#/components/responses/SpamRejected' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /v1/newsletter/confirm:
    post:
      tags: [Newsletter]
      operationId: confirmNewsletter
      summary: Confirmation de l'inscription (lien de l'e-mail)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string, maxLength: 512 }
      responses:
        '200':
          description: Inscription confirmée.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageResponse' }
              example: { message: Votre inscription à la newsletter est confirmée. À très vite ! }
        '410':
          description: Lien invalide ou expiré.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /v1/newsletter/unsubscribe:
    post:
      tags: [Newsletter]
      operationId: unsubscribeNewsletter
      summary: Désinscription en un clic (jeton signé, compatible `List-Unsubscribe-Post`)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string, maxLength: 512 }
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                token: { type: string }
                List-Unsubscribe: { type: string, const: One-Click }
      responses:
        '200':
          description: Désinscription effectuée.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageResponse' }
              example: { message: Vous êtes bien désinscrit·e. Vous ne recevrez plus notre newsletter. }
        '410':
          description: Lien invalide.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  # ────────────────────────── Questionnaire ───────────────────────
  /v1/surveys/{token}:
    get:
      tags: [Questionnaire]
      operationId: getSurvey
      summary: Questionnaire de satisfaction (lien reçu par e-mail)
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string, maxLength: 512 }
      responses:
        '200':
          description: Questionnaire ouvert.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicSurvey' }
              examples:
                default: { $ref: '#/components/examples/PublicSurvey' }
        '404': { $ref: '#/components/responses/NotFound' }
        '410':
          description: Lien expiré ou questionnaire déjà rempli.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              examples:
                expired:
                  value: { type: https://api.mamboproxi.com/problems/survey-expired, title: Lien expiré, status: 410, detail: Ce questionnaire n'est plus disponible. Merci pour votre confiance ! }
                completed:
                  value: { type: https://api.mamboproxi.com/problems/survey-completed, title: Déjà rempli, status: 410, detail: Vous avez déjà répondu à ce questionnaire. Merci ! }

  /v1/surveys/{token}/responses:
    post:
      tags: [Questionnaire]
      operationId: submitSurvey
      summary: Envoi des réponses
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string, maxLength: 512 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [answers, publishConsent]
              properties:
                answers:
                  type: array
                  minItems: 1
                  maxItems: 10
                  items: { $ref: '#/components/schemas/SurveyAnswer' }
                publishConsent: { type: boolean, description: Accord pour publier l'avis (note et commentaire) sur le site. }
                displayName: { type: [string, 'null'], maxLength: 60, description: Nom affiché « Prénom N. » (déduit de la demande si absent). }
                city: { type: [string, 'null'], maxLength: 80 }
      responses:
        '201':
          description: Réponses enregistrées.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageResponse' }
              example: { message: Merci pour votre retour ! }
        '410':
          description: Lien expiré ou déjà utilisé.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  # ─────────────────────────── Authentification ───────────────────
  /v1/auth/login:
    post:
      tags: [Authentification]
      operationId: login
      summary: Connexion (e-mail + mot de passe)
      description: |
        Appareil reconnu (cookie `mp_td` d'appareil de confiance valide) → session ouverte (`200`, cookies déposés).
        Sinon → un code à 6 chiffres est envoyé par e-mail (`202`). Verrouillage progressif après échecs.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginInput' }
            example: { email: mireille@mamboproxi.com, password: '••••••••••••', rememberMe: true }
      responses:
        '200':
          description: Connecté. Cookies `mp_at`, `mp_rt` et `mp_csrf` déposés.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResult' }
              example: { status: AUTHENTICATED, user: { id: clx8m2k4p0001mp9a7v3f2c1d, email: mireille@mamboproxi.com, name: Mireille Bell, firstName: Mireille, initials: MB, role: ADMIN, lastLoginAt: '2026-10-19T07:58:00.000Z' } }
        '202':
          description: Code de vérification envoyé par e-mail.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResult' }
              example: { status: OTP_REQUIRED, challengeId: clx8m9q2r0004mp9ahd8s7k2x, emailHint: 'm•••••@mamboproxi.com', resendAvailableAt: '2026-10-20T09:42:12.000Z' }
        '401':
          description: Identifiants incorrects.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example: { type: https://api.mamboproxi.com/problems/invalid-credentials, title: Identifiants incorrects, status: 401, detail: L'adresse e-mail ou le mot de passe est incorrect. }
        '423':
          description: Compte temporairement verrouillé.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example: { type: https://api.mamboproxi.com/problems/account-locked, title: Compte verrouillé, status: 423, detail: Trop de tentatives. Réessayez dans 15 minutes ou réinitialisez votre mot de passe. }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /v1/auth/verify-otp:
    post:
      tags: [Authentification]
      operationId: verifyOtp
      summary: Vérification du code reçu par e-mail
      description: Code à 6 chiffres valable 10 minutes, 5 essais. `trustDevice` mémorise l'appareil 30 jours.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [challengeId, code]
              properties:
                challengeId: { $ref: '#/components/schemas/Id' }
                code: { type: string, pattern: '^\d{6}$' }
                trustDevice: { type: boolean, default: false }
      responses:
        '200':
          description: Connecté.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResult' }
        '401':
          description: Code incorrect ou expiré.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example: { type: https://api.mamboproxi.com/problems/invalid-otp, title: Code incorrect, status: 401, detail: Ce code est incorrect. Il vous reste 3 essais. }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /v1/auth/resend-otp:
    post:
      tags: [Authentification]
      operationId: resendOtp
      summary: Renvoi du code (après 60 s)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [challengeId]
              properties:
                challengeId: { $ref: '#/components/schemas/Id' }
      responses:
        '202':
          description: Nouveau code envoyé.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResult' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /v1/auth/refresh:
    post:
      tags: [Authentification]
      operationId: refreshSession
      summary: Rotation des jetons (cookie `mp_rt`)
      responses:
        '204': { description: Nouveaux cookies déposés. }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /v1/auth/logout:
    post:
      tags: [Authentification]
      operationId: logout
      summary: Déconnexion (révoque la session)
      security: [{ cookieAuth: [], csrfToken: [] }]
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '204': { description: 'Session révoquée, cookies effacés.' }

  /v1/auth/me:
    get:
      tags: [Authentification]
      operationId: getMe
      summary: Utilisateur connecté
      security: [{ cookieAuth: [] }]
      responses:
        '200':
          description: Utilisateur.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CurrentUser' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /v1/auth/forgot-password:
    post:
      tags: [Authentification]
      operationId: forgotPassword
      summary: Demande de réinitialisation du mot de passe
      description: Réponse identique que l'adresse existe ou non.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { $ref: '#/components/schemas/Email' }
      responses:
        '202':
          description: E-mail envoyé si un compte correspond.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageResponse' }
              example: { message: 'Si un compte correspond à cette adresse, vous allez recevoir un lien de réinitialisation.' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /v1/auth/reset-password:
    post:
      tags: [Authentification]
      operationId: resetPassword
      summary: Nouveau mot de passe (lien reçu par e-mail)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetPasswordInput' }
      responses:
        '204': { description: Mot de passe modifié ; toutes les sessions sont révoquées. }
        '410':
          description: Lien invalide ou expiré.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /v1/auth/accept-invite:
    post:
      tags: [Authentification]
      operationId: acceptInvite
      summary: Acceptation d'une invitation au back-office
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetPasswordInput' }
      responses:
        '204': { description: Compte activé. }
        '410':
          description: Invitation invalide ou expirée.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422': { $ref: '#/components/responses/ValidationError' }

  # ─────────────────────── Admin — Tableau de bord ────────────────
  /v1/admin/dashboard:
    get:
      tags: [Admin — Tableau de bord]
      operationId: adminGetDashboard
      summary: Indicateurs du tableau de bord
      security: [{ cookieAuth: [] }]
      parameters:
        - name: range
          in: query
          schema: { type: string, enum: [7d, 30d, 12m], default: 30d }
      responses:
        '200':
          description: Tableau de bord.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Dashboard' }
              examples:
                default: { $ref: '#/components/examples/Dashboard' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /v1/admin/search:
    get:
      tags: [Admin — Tableau de bord]
      operationId: adminSearch
      summary: Recherche globale (palette ⌘K)
      security: [{ cookieAuth: [] }]
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 2, maxLength: 120 }
      responses:
        '200':
          description: Résultats groupés.
          content:
            application/json:
              schema:
                type: object
                required: [groups]
                properties:
                  groups:
                    type: array
                    items:
                      type: object
                      required: [kind, label, items]
                      properties:
                        kind: { type: string, enum: [requests, contacts, services, jobs, pages] }
                        label: { type: string, examples: [Demandes] }
                        items:
                          type: array
                          items:
                            type: object
                            required: [id, title, href]
                            properties:
                              id: { type: string }
                              title: { type: string }
                              subtitle: { type: [string, 'null'] }
                              href: { type: string }
              example:
                groups:
                  - kind: requests
                    label: Demandes
                    items: [{ id: clx8n0a1b0009mp9a1c2d3e4f, title: MP-2026-0142 · Aminata Diallo, subtitle: Chef privé · Nouvelle, href: '/admin/demandes?id=clx8n0a1b0009mp9a1c2d3e4f' }]
        '401': { $ref: '#/components/responses/Unauthorized' }

  /v1/admin/notifications:
    get:
      tags: [Admin — Tableau de bord]
      operationId: adminListNotifications
      summary: Notifications récentes
      security: [{ cookieAuth: [] }]
      responses:
        '200':
          description: 30 dernières notifications.
          content:
            application/json:
              schema:
                type: object
                required: [data, unreadCount]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Notification' } }
                  unreadCount: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /v1/admin/notifications/read:
    patch:
      tags: [Admin — Tableau de bord]
      operationId: adminMarkNotificationsRead
      summary: Marquer des notifications comme lues
      security: [{ cookieAuth: [], csrfToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ids: { type: array, items: { $ref: '#/components/schemas/Id' }, description: Absent = toutes. }
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ─────────────────────────── Admin — Demandes ───────────────────
  /v1/admin/requests:
    get:
      tags: [Admin — Demandes]
      operationId: adminListRequests
      summary: Demandes (devis, contacts, inscriptions, candidatures…)
      security: [{ cookieAuth: [] }]
      parameters:
        - name: type
          in: query
          schema: { $ref: '#/components/schemas/RequestType' }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/RequestStatus' }
        - name: category
          in: query
          schema: { $ref: '#/components/schemas/Slug' }
        - name: country
          in: query
          schema: { $ref: '#/components/schemas/CountryCode' }
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - $ref: '#/components/parameters/Q'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          description: Page de demandes + compteurs par statut (calculés avec les autres filtres).
          content:
            application/json:
              schema:
                type: object
                required: [data, meta, counts]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/RequestListItem' } }
                  meta: { $ref: '#/components/schemas/PaginationMeta' }
                  counts: { $ref: '#/components/schemas/RequestStatusCounts' }
              examples:
                default: { $ref: '#/components/examples/AdminRequestsPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /v1/admin/requests/export.csv:
    get:
      tags: [Admin — Demandes]
      operationId: adminExportRequests
      summary: Export CSV (mêmes filtres que la liste)
      security: [{ cookieAuth: [] }]
      parameters:
        - name: type
          in: query
          schema: { $ref: '#/components/schemas/RequestType' }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/RequestStatus' }
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
      responses:
        '200':
          description: Fichier CSV (UTF-8 avec BOM, séparateur `;`).
          content:
            text/csv:
              schema: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /v1/admin/requests/{id}:
    get:
      tags: [Admin — Demandes]
      operationId: adminGetRequest
      summary: Détail d'une demande
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/IdPath' }]
      responses:
        '200':
          description: Demande.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RequestDetail' }
              examples:
                default: { $ref: '#/components/examples/AdminRequestDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Admin — Demandes]
      operationId: adminUpdateRequest
      summary: Changer le statut ou l'assignation
      description: |
        Chaque changement crée un événement d'historique. Le passage à `PRESTATION_REALISEE` d'un devis planifie
        l'invitation au questionnaire (délai paramétrable). Le retour arrière est réservé aux administrateurs.
      security: [{ cookieAuth: [], csrfToken: [] }]
      parameters: [{ $ref: '#/components/parameters/IdPath' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                status: { $ref: '#/components/schemas/RequestStatus' }
                assignedToId: { oneOf: [{ $ref: '#/components/schemas/Id' }, { type: 'null' }] }
      responses:
        '200':
          description: Demande mise à jour.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RequestDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Admin — Demandes]
      operationId: adminAnonymizeRequest
      summary: Anonymiser une demande (RGPD)
      security: [{ cookieAuth: [], csrfToken: [] }]
      parameters: [{ $ref: '#/components/parameters/IdPath' }]
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/admin/requests/{id}/notes:
    post:
      tags: [Admin — Demandes]
      operationId: adminAddRequestNote
      summary: Ajouter une note interne
      security: [{ cookieAuth: [], csrfToken: [] }]
      parameters: [{ $ref: '#/components/parameters/IdPath' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string, minLength: 1, maxLength: 5000 }
      responses:
        '201':
          description: Note ajoutée.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RequestNote' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /v1/admin/requests/{id}/duplicate:
    post:
      tags: [Admin — Demandes]
      operationId: adminDuplicateRequest
      summary: Dupliquer une demande (nouvelle référence, statut « Nouvelle »)
      security: [{ cookieAuth: [], csrfToken: [] }]
      parameters: [{ $ref: '#/components/parameters/IdPath' }]
      responses:
        '201':
          description: Copie créée.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RequestDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/admin/requests/{id}/attachments/{attachmentId}:
    get:
      tags: [Admin — Demandes]
      operationId: adminGetRequestAttachment
      summary: URL signée (5 min) d'une pièce jointe
      security: [{ cookieAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - name: attachmentId
          in: path
          required: true
          schema: { $ref: '#/components/schemas/Id' }
      responses:
        '200':
          description: URL signée.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SignedUrl' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ─────────────────────────── Admin — Services ───────────────────
  /v1/admin/services:
    get:
      tags: [Admin — Services]
      operationId: adminListServices
      summary: Services (toutes rubriques, tous statuts)
      security: [{ cookieAuth: [] }]
      parameters:
        - name: category
          in: query
          schema: { $ref: '#/components/schemas/Slug' }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/PublishStatus' }
        - $ref: '#/components/parameters/Q'
      responses:
        '200':
          description: Services triés par rubrique puis ordre + compteurs par rubrique.
          content:
            application/json:
              schema:
                type: object
                required: [data, countsByCategory]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/AdminServiceListItem' } }
                  countsByCategory:
                    type: object
                    additionalProperties: { type: integer }
              examples:
                default: { $ref: '#/components/examples/AdminServices' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Admin — Services]
      operationId: adminCreateService
      summary: Créer un service (brouillon)
      description: Seuls le nom, la rubrique et l'accroche sont nécessaires ; le slug et le SEO sont pré-remplis.
      security: [{ cookieAuth: [], csrfToken: [] }]
      requestBody:
        required: true
        content:

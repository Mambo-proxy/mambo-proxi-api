        resultEn: { type: [string, 'null'], maxLength: 240 }
        delay: { type: [string, 'null'], maxLength: 30, description: 'Délai moyen d''intervention ; `null` = « Sur devis ».', examples: [30–45 min] }
        fee: { oneOf: [{ $ref: '#/components/schemas/ZoneFee' }, { type: 'null' }] }

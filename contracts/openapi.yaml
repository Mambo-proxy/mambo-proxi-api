  # ──────────────────────────── Admin — Avis ──────────────────────
  /v1/admin/reviews:
    get:
      tags: [Admin — Avis]
      operationId: adminListReviews
      summary: Avis (à valider, publiés, masqués)
      security: [{ cookieAuth: [] }]
      parameters:
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/ReviewStatus' }
        - name: service
          in: query
          schema: { $ref: '#/components/schemas/Slug' }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Page d'avis + compteurs.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta, counts]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/AdminReview' } }
                  meta: { $ref: '#/components/schemas/PaginationMeta' }
                  counts:
                    type: object
                    required: [A_VALIDER, PUBLIE, MASQUE]
                    properties:
                      A_VALIDER: { type: integer }
                      PUBLIE: { type: integer }
                      MASQUE: { type: integer }
              examples:
                default: { $ref: '#/components/examples/AdminReviewsPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Admin — Avis]
      operationId: adminCreateReview
      summary: Ajout manuel d'un témoignage (marqué « non vérifié »)
      security: [{ cookieAuth: [], csrfToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReviewInput' }
      responses:
        '201':
          description: Avis créé.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminReview' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /v1/admin/reviews/stats:
    get:
      tags: [Admin — Avis]
      operationId: adminGetReviewStats
      summary: KPI des avis et du questionnaire
      security: [{ cookieAuth: [] }]
      responses:
        '200':
          description: Statistiques.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReviewStats' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /v1/admin/reviews/{id}:
    patch:
      tags: [Admin — Avis]
      operationId: adminUpdateReview
      summary: Publier, masquer, mettre en avant
      description: La publication est refusée (`409`) si le client n'a pas consenti à la publication.
      security: [{ cookieAuth: [], csrfToken: [] }]
      parameters: [{ $ref: '#/components/parameters/IdPath' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                status: { $ref: '#/components/schemas/ReviewStatus' }
                featured: { type: boolean }
                serviceId: { oneOf: [{ $ref: '#/components/schemas/Id' }, { type: 'null' }] }
      responses:
        '200':
          description: Avis mis à jour.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminReview' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Publication impossible sans consentement.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example: { type: https://api.mamboproxi.com/problems/no-publish-consent, title: Publication impossible, status: 409, detail: Le client n'a pas autorisé la publication de cet avis. Il reste consultable en suivi interne. }
    delete:
      tags: [Admin — Avis]
      operationId: adminDeleteReview
      summary: Supprimer un avis ajouté manuellement
      security: [{ cookieAuth: [], csrfToken: [] }]
      parameters: [{ $ref: '#/components/parameters/IdPath' }]
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }


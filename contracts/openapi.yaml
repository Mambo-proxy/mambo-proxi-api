  # ─────────────────────────── Admin — Demandes ───────────────────
  /v1/admin/requests:
    get:
      tags: [Admin — Demandes]
      operationId: adminListRequests
      x-permissions: [requests:read, requests:read-assigned]
      summary: Demandes (devis, contacts, inscriptions, candidatures…)
      description: |
        Avec la seule permission `requests:read-assigned`, la liste et les compteurs se limitent aux demandes assignées
        à l'utilisateur connecté (`assignee=me` appliqué d'office, autre valeur → `403`).

        Les demandes anonymisées n'apparaissent plus. `district` et `q` ne tiennent compte ni de la casse ni des
        accents ; `q` cherche dans la référence, le sujet, le nom, l'adresse e-mail et la structure du contact.
        Tri (`sort`) : `createdAt` (défaut `-createdAt`), `updatedAt`, `dueAt`, `reference`, `status`, `type`.
        `counts` : compteurs par statut calculés avec tous les filtres sauf `status` (onglets).
      security: [{ cookieAuth: [] }]
      parameters:
        - name: type
          in: query
          schema: { $ref: '#/components/schemas/RequestType' }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/RequestStatus' }
        - name: category
          in: query
          schema: { $ref: '#/components/schemas/Slug' }
        - name: country
          in: query
          schema: { $ref: '#/components/schemas/CountryCode' }
        - $ref: '#/components/parameters/District'
        - $ref: '#/components/parameters/Assignee'
        - $ref: '#/components/parameters/Due'
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - $ref: '#/components/parameters/Q'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          description: Page de demandes + compteurs par statut (calculés avec les autres filtres).
          content:
            application/json:
              schema:
                type: object
                required: [data, meta, counts]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/RequestListItem' } }
                  meta: { $ref: '#/components/schemas/PaginationMeta' }
                  counts: { $ref: '#/components/schemas/RequestStatusCounts' }
              examples:
                default: { $ref: '#/components/examples/AdminRequestsPage' }
        '400': { $ref: '#/components/responses/InvalidQuery' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /v1/admin/requests/export.csv:
    get:
      tags: [Admin — Demandes]
      operationId: adminExportRequests
      x-permissions: [requests:export]
      summary: Export CSV (mêmes filtres que la liste)
      description: |
        Toutes les demandes filtrées (périmètre de l'utilisateur, sans pagination), des plus récentes aux plus
        anciennes. Colonnes : Référence ; Type ; Statut ; Client ; E-mail ; Téléphone ; Ville ; Pays ; Service ; Assignée
        à ; Échéance ; Reçue le (libellés des types et statuts, dates ISO 8601 UTC). Chaque cellule est entre
        guillemets ; une cellule qui commence par `=`, `+`, `-`, `@`, une tabulation ou un retour chariot est préfixée
        d'une apostrophe (injection de formules), sauf un nombre ou un numéro de téléphone. Chaque export est inscrit
        au journal d'activité.
      security: [{ cookieAuth: [] }]
      parameters:
        - name: type
          in: query
          schema: { $ref: '#/components/schemas/RequestType' }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/RequestStatus' }
        - name: category

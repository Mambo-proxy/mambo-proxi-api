      operationId: adminUpdateUser
      x-permissions: [users:manage]
      summary: Modifier le rôle, désactiver / réactiver
      security: [{ cookieAuth: [], csrfToken: [] }]
      parameters: [{ $ref: '#/components/parameters/IdPath' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                name: { type: string, maxLength: 120 }
                role: { $ref: '#/components/schemas/Role' }
                isActive: { type: boolean }
      responses:
        '200':
          description: Utilisateur enregistré.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminUser' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Impossible de retirer (rétrograder ou désactiver) le dernier administrateur actif, ou de désactiver son propre compte.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example: { type: https://api.mamboproxi.com/problems/conflict, title: Conflit, status: 409, detail: Impossible de retirer le dernier administrateur actif. }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Admin — Utilisateurs]
      operationId: adminDeleteUser
      x-permissions: [users:manage]
      summary: Supprimer un utilisateur
      description: |
        Refus (`409`) : son propre compte, le dernier administrateur actif, ou un utilisateur auteur de notes sur des
        demandes (historique conservé : le désactiver plutôt que le supprimer).
      security: [{ cookieAuth: [], csrfToken: [] }]
      parameters: [{ $ref: '#/components/parameters/IdPath' }]
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Son propre compte, dernier administrateur actif, ou utilisateur ayant un historique dans les demandes.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example: { type: https://api.mamboproxi.com/problems/conflict, title: Conflit, status: 409, detail: 'Cet utilisateur a un historique dans les demandes : désactivez-le plutôt que de le supprimer.' }

  /v1/admin/users/{id}/reset-password:
    post:
      tags: [Admin — Utilisateurs]
      operationId: adminResetUserPassword
      x-permissions: [users:manage]
      summary: Envoyer un lien de réinitialisation et révoquer les sessions
      description: |
        Lien valable 1 heure, sessions du compte révoquées. Invitation pas encore acceptée : nouvelle invitation
        (7 jours) à la place.
      security: [{ cookieAuth: [], csrfToken: [] }]
      parameters: [{ $ref: '#/components/parameters/IdPath' }]
      responses:
        '202':
          description: Lien envoyé.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Compte désactivé (le réactiver d'abord).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example: { type: https://api.mamboproxi.com/problems/conflict, title: Conflit, status: 409, detail: 'Ce compte est désactivé : réactivez-le avant de lui envoyer un lien.' }

  # ──────────────────────────── Admin — Médias ────────────────────
  /v1/admin/media:
    get:
      tags: [Admin — Médias]
      operationId: adminListMedia
      x-permissions: [content:read]
      summary: Médiathèque
      security: [{ cookieAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Q'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Page de médias.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Media' } }
                  meta: { $ref: '#/components/schemas/PaginationMeta' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Admin — Médias]
      operationId: adminUploadMedia
      x-permissions: [media:write]
      summary: Envoyer une image (JPG, PNG, WebP, SVG assaini ; 10 Mo max)
      description: Génère les variantes WebP/AVIF 480/960/1600 en tâche de fond.
      security: [{ cookieAuth: [], csrfToken: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, alt]
              properties:
                file: { type: string, contentMediaType: application/octet-stream }
                alt: { type: string, minLength: 1, maxLength: 200, description: Texte alternatif obligatoire. }
      responses:
        '201':
          description: Média créé.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Media' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '413':
          description: Fichier trop volumineux.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '415':
          description: Format non accepté.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /v1/admin/media/{id}:
    patch:
      tags: [Admin — Médias]
      operationId: adminUpdateMedia
      x-permissions: [media:write]
      summary: Texte alternatif et point focal
      security: [{ cookieAuth: [], csrfToken: [] }]
      parameters: [{ $ref: '#/components/parameters/IdPath' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                alt: { type: string, minLength: 1, maxLength: 200 }
                focalPoint:
                  type: object
                  required: [x, y]
                  properties:
                    x: { type: number, minimum: 0, maximum: 1 }
                    y: { type: number, minimum: 0, maximum: 1 }
      responses:
        '200':
          description: Média enregistré.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Media' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Admin — Médias]
      operationId: adminDeleteMedia
      x-permissions: [media:write]
      summary: Supprimer un média non utilisé
      security: [{ cookieAuth: [], csrfToken: [] }]
      parameters: [{ $ref: '#/components/parameters/IdPath' }]
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Média encore utilisé.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example: { type: https://api.mamboproxi.com/problems/media-in-use, title: Image utilisée, status: 409, detail: 'Cette image est utilisée par : Chef privé (photo principale). Remplacez-la avant de la supprimer.' }

  # ──────────────────────────── Admin — Journal ───────────────────
  /v1/admin/audit-log:
    get:
      tags: [Admin — Journal]
      operationId: adminListAuditLog
      x-permissions: [audit:read]
      summary: Journal d'activité
      security: [{ cookieAuth: [] }]
      parameters:
        - name: actor
          in: query
          schema: { $ref: '#/components/schemas/Id' }
        - name: entity
          in: query
          schema: { type: string }
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Entrées du journal.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/AuditLogEntry' } }
                  meta: { $ref: '#/components/schemas/PaginationMeta' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: mp_at
      description: Jeton d'accès JWT (15 min) déposé en cookie `httpOnly`, `Secure`, `SameSite=Lax`.
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: Recopie du cookie `mp_csrf` (double-submit). Obligatoire sur toutes les mutations authentifiées.
  parameters:
    District:
      name: district
      in: query
      description: |
        Quartier (nom tel que dans `GET /v1/zones`, ex. `Bonapriso`) : contacts dont la ville commence par ce quartier
        (« Bonapriso, Douala »), sans tenir compte de la casse ni des accents.
      schema: { type: string, maxLength: 80, examples: [Bonapriso] }
    Assignee:
      name: assignee
      in: query
      description: |
        Personne assignée : `me` (utilisateur connecté), `none` (non assigné) ou identifiant d'un utilisateur.
      schema:
        anyOf:
          - { type: string, enum: [me, none] }
          - $ref: '#/components/schemas/Id'
        examples: [me]
    Due:
      name: due
      in: query
      description: |
        Échéance des demandes ouvertes (`NOUVELLE`, `EN_COURS`) : `overdue` en retard, `today` à traiter aujourd'hui,
        `week` dans les 7 prochains jours (fuseau `Africa/Douala`).
      schema: { type: string, enum: [overdue, today, week] }
    Lang:
      name: lang
      in: query
      description: |
        Langue des contenus renvoyés : `fr` (par défaut) ou `en`. Un contenu non encore traduit est renvoyé en
        français. Le paramètre fait partie de l'adresse : chaque langue est mise en cache séparément.
      schema: { type: string, enum: [fr, en], default: fr }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: pageSize
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    Sort:
      name: sort
      in: query
      description: Champ de tri, préfixé de `-` pour un tri décroissant.
      schema: { type: string, example: -createdAt }
    Q:
      name: q
      in: query
      description: Recherche plein texte.
      schema: { type: string, maxLength: 120 }
    IdPath:
      name: id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Id' }
    SlugPath:
      name: slug
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Slug' }
    PageKeyPath:
      name: key
      in: path
      required: true
      schema: { $ref: '#/components/schemas/PageKey' }
    Preview:
      name: preview
      in: query
      description: Jeton de prévisualisation délivré par le back-office ; renvoie le brouillon.
      schema: { type: string }
    SettingsGroupPath:
      name: group
      in: path
      required: true
      schema: { $ref: '#/components/schemas/SettingsGroup' }
    EmailTemplateKeyPath:
      name: key
      in: path
      required: true
      schema: { $ref: '#/components/schemas/EmailTemplateKey' }
    From:
      name: from
      in: query
      schema: { type: string, format: date-time }
    To:
      name: to
      in: query
      schema: { type: string, format: date-time }

  headers:
    RateLimitLimit:
      description: Nombre de requêtes autorisées dans la fenêtre.
      schema: { type: integer }
    RateLimitRemaining:
      description: Requêtes restantes dans la fenêtre.
      schema: { type: integer }
    RetryAfter:
      description: Délai en secondes avant de pouvoir réessayer.
      schema: { type: integer }

  responses:
    ValidationError:
      description: Données invalides (un message par champ).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://api.mamboproxi.com/problems/validation-error
            title: Certaines informations sont à corriger
            status: 422
            detail: Vérifiez les champs signalés puis renvoyez le formulaire.
            errors:
              - path: contact.email
                code: invalid_email
                message: Saisissez une adresse e-mail valide.
              - path: consent
                code: required
                message: Merci d'accepter le traitement de vos données pour envoyer votre demande.
    InvalidQuery:
      description: |
        Paramètres de requête invalides (`invalid-query`) : valeur inconnue (type, statut, profil), format (date,
        pays, slug), bornes de la pagination (`page` ≥ 1, `pageSize` de 1 à 100) ou champ de tri non autorisé.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://api.mamboproxi.com/problems/invalid-query
            title: Requête invalide
            status: 400
            detail: Vérifiez les paramètres de la requête.
            errors:
              - { path: pageSize, code: too_big, message: La valeur doit être inférieure ou égale à 100. }
    Unauthorized:
      description: Session absente ou expirée.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://api.mamboproxi.com/problems/unauthorized
            title: Session expirée
            status: 401
            detail: Veuillez vous reconnecter.
    Forbidden:
      description: |
        Droits insuffisants (`forbidden`) ou, pour une mutation, jeton CSRF absent ou invalide (`csrf-token-invalid` :
        en-tête `X-CSRF-Token` différent du cookie `mp_csrf` ou émis pour un autre compte).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          examples:
            forbidden:
              summary: Rôle insuffisant
              value:
                type: https://api.mamboproxi.com/problems/forbidden
                title: Action non autorisée
                status: 403
                detail: Votre rôle ne permet pas d'effectuer cette action.
            csrfTokenInvalid:
              summary: Jeton CSRF absent ou invalide
              value:
                type: https://api.mamboproxi.com/problems/csrf-token-invalid
                title: Action non autorisée
                status: 403
                detail: Le jeton de sécurité est absent ou invalide. Rechargez la page puis réessayez.
    NotFound:
      description: Ressource introuvable.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://api.mamboproxi.com/problems/not-found
            title: Introuvable
            status: 404
            detail: La ressource demandée n'existe pas ou n'est plus disponible.
    Conflict:
      description: Conflit avec l'état actuel (doublon, créneau déjà pris…).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://api.mamboproxi.com/problems/conflict
            title: Conflit
            status: 409
            detail: Cet élément a été modifié entre-temps.
    TooManyRequests:
      description: Trop de requêtes.
      headers:
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
        RateLimit-Limit: { $ref: '#/components/headers/RateLimitLimit' }
        RateLimit-Remaining: { $ref: '#/components/headers/RateLimitRemaining' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://api.mamboproxi.com/problems/rate-limited
            title: Trop de tentatives
            status: 429
            detail: Vous avez effectué trop de demandes. Réessayez dans quelques minutes.
    SpamRejected:
      description: Vérification anti-spam échouée.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://api.mamboproxi.com/problems/spam-check-failed
            title: Vérification de sécurité échouée
            status: 400
            detail: La vérification anti-robot n'a pas abouti. Rechargez la page puis réessayez.
    NoContent:
      description: Opération effectuée.

  schemas:
    Id:
      type: string
      description: Identifiant opaque (cuid).
      minLength: 1
      maxLength: 64
      examples: [clx8m2k4p0001mp9a7v3f2c1d]
    Slug:
      type: string
      pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
      maxLength: 120
      examples: [chef-prive]
    Reference:
      type: string
      pattern: '^MP-\d{4}-\d{4,}$'
      examples: [MP-2026-0142]
    Email:
      type: string
      format: email
      maxLength: 254
      examples: [aminata.diallo@example.com]
    PhoneE164:
      type: string
      description: Numéro au format E.164 (ex. +237 / +33).
      pattern: '^\+[1-9]\d{6,14}$'
      examples: ['+237600000000']
    CountryCode:
      type: string
      description: Code pays ISO 3166-1 alpha-2.
      pattern: '^[A-Z]{2}$'
      examples: [CM]
    IllustrationScene:
      type: string
      description: Scène illustrée provisoire (exportée des maquettes) affichée tant qu'aucune photo n'est fournie.
      enum: [accueil, chef, colis, courses, culture, equipe, evenement, formation, livraison, logement, marche, massage, photo, portrait, voiture]
    IconName:
      type: string
      description: Nom d'icône lucide-react (PascalCase).
      pattern: '^[A-Z][A-Za-z0-9]*$'
      maxLength: 48
      examples: [ChefHat]
    PublishStatus:
      type: string
      enum: [DRAFT, PUBLISHED, ARCHIVED]
    DateTime:
      type: string
      format: date-time
    Html:
      type: string
      description: 'HTML assaini côté serveur (balises autorisées : p, h2, h3, h4, strong, em, a, ul, ol, li, br, blockquote).'
      maxLength: 200000

    EmailHtml:
      type: string
      description: >-
        Corps d'un e-mail, assaini côté serveur : balises de `Html`, plus `img` (`src` d'une image de la médiathèque,
        `alt`) et les boutons d'appel à l'action `<a data-button href="…">`. Variable disponible `{prénom}`.
      maxLength: 200000

    Problem:
      type: object
      description: Erreur au format RFC 9457 (Problem Details).
      required: [type, title, status]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer, minimum: 400, maximum: 599 }
        detail: { type: string }
        instance: { type: string }
        errors:
          type: array
          items:
            type: object
            required: [path, message]
            properties:
              path: { type: string, description: Chemin du champ (notation pointée). }
              code: { type: string }
              message: { type: string, description: Message en français prêt à afficher. }

    PaginationMeta:
      type: object
      required: [page, pageSize, total, totalPages]
      properties:
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1 }
        total: { type: integer, minimum: 0 }
        totalPages: { type: integer, minimum: 0 }

    Visual:
      type: object
      description: |
        Visuel d'un emplacement « photo ». Tant qu'aucune image n'est fournie, l'illustration est affichée ;
        lorsqu'une image (média du back-office) est renseignée, elle la remplace sans changer la mise en page.
      required: [illustration]
      properties:
        illustration: { $ref: '#/components/schemas/IllustrationScene' }
        image:
          oneOf:
            - $ref: '#/components/schemas/MediaImage'
            - type: 'null'
        alt: { type: string, maxLength: 200, description: Texte alternatif (vide si décoratif). }

    MediaImage:
      type: object
      description: Image optimisée (variantes AVIF/WebP 480/960/1600).
      required: [id, url, width, height, variants]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        url: { type: string, format: uri-reference, description: 'Adresse absolue (stockage des médias) ou relative au site (médias livrés avec le site).' }
        width: { type: integer }
        height: { type: integer }
        alt: { type: [string, 'null'] }
        focalPoint:
          type: [object, 'null']
          properties:
            x: { type: number, minimum: 0, maximum: 1 }
            y: { type: number, minimum: 0, maximum: 1 }
        blurDataUrl: { type: [string, 'null'] }
        variants:
          type: array
          items:
            type: object
            required: [url, width, format]
            properties:
              url: { type: string, format: uri-reference }
              width: { type: integer, enum: [480, 960, 1600] }
              format: { type: string, enum: [avif, webp] }

    Link:
      type: object
      description: Lien de bouton ou de menu (destination interne ou externe).
      required: [label, href]
      properties:
        label: { type: string, maxLength: 80 }
        href: { type: string, maxLength: 500, examples: [/devis] }
        external: { type: boolean, default: false }
        labelMobile: { type: [string, 'null'], maxLength: 80, description: Libellé raccourci en mobile ; vide = libellé principal. }

    Seo:
      type: object
      properties:
        title: { type: [string, 'null'], maxLength: 70 }
        description: { type: [string, 'null'], maxLength: 170 }
        ogImageUrl: { type: [string, 'null'], format: uri }
        noindex: { type: boolean, default: false }

    AntiSpam:
      type: object
      description: |
        Protection anti-spam commune à tous les formulaires publics : jeton Cloudflare Turnstile, champ piège
        (doit rester vide) et horodatage d'ouverture du formulaire (délai minimal de remplissage : 3 s).
      required: [turnstileToken, startedAt]
      properties:
        turnstileToken: { type: string, maxLength: 4096 }
        honeypot: { type: string, maxLength: 0, description: Champ piège invisible — doit rester vide. }
        startedAt: { type: string, format: date-time }
      example:
        turnstileToken: XXXX.DUMMY.TOKEN.XXXX
        honeypot: ''
        startedAt: '2026-10-20T09:41:12.000Z'

    Consent:
      type: boolean
      const: true
      description: Consentement au traitement des données (case non cochée par défaut, obligatoire).

    ContactIdentity:
      type: object
      required: [fullName, email, phone]
      properties:
        fullName: { type: string, minLength: 2, maxLength: 120, examples: [Aminata Diallo] }
        email: { $ref: '#/components/schemas/Email' }
        phone: { $ref: '#/components/schemas/PhoneE164' }
        country: { $ref: '#/components/schemas/CountryCode' }
        city: { type: string, maxLength: 80 }

    SubmissionAccepted:
      type: object
      required: [reference, message]
      properties:
        reference: { $ref: '#/components/schemas/Reference' }
        message: { type: string, description: Message de confirmation prêt à afficher. }
      example:
        reference: MP-2026-0142
        message: Merci, votre demande est bien envoyée ! Vous recevrez un e-mail de confirmation dans quelques instants.

    MessageResponse:
      type: object
      required: [message]
      properties:
        message: { type: string }

    # ───────────────────────────── Site ─────────────────────────────
    AccentText:
      type: string
      description: |
        Texte pouvant contenir une partie mise en avant (couleur `text/brand`), balisée `==…==`.
        Exemple : `Mambo, ce n'est pas qu'un service. ==C'est une expérience pensée pour vous.==`
      maxLength: 400

    SocialNetwork:
      type: string
      enum: [instagram, facebook, linkedin, tiktok, youtube, x]

    KeyFigure:
      type: object
      required: [key, label]
      description: Chiffre clé ; `valueText` remplace le nombre animé (ex. « Douala »).
      properties:
        key: { type: string, examples: [projects] }
        value: { type: number, examples: [150] }
        valueText: { type: [string, 'null'], maxLength: 24, examples: [Douala] }
        prefix: { type: string, maxLength: 4, default: '' }
        suffix: { type: string, maxLength: 16, examples: ['+', ' pays', ' countries'] }
        decimals: { type: integer, minimum: 0, maximum: 2, default: 0 }
        label: { type: string, maxLength: 80, examples: [projets accompagnés] }
        labelMobile: { type: [string, 'null'], maxLength: 80, description: Libellé raccourci en mobile ; vide = libellé principal. }

    SiteSettings:
      type: object
      required: [siteName, contact, whatsapp, social, agency, keyFigures, turnstileSiteKey, analytics, seo, features]
      properties:
        siteName: { type: string, examples: [MAMBO Proxi] }
        tagline: { type: string, examples: ["Vos services, au plus près de vous"] }
        signature: { type: string, examples: ["Mambo, ce n'est pas qu'un service. C'est une expérience pensée pour vous."] }
        contact:
          type: object
          required: [phoneCameroon, email, hoursLabel]
          properties:
            phoneFrance:
              $ref: '#/components/schemas/PhoneE164'
              description: Facultatif depuis le recentrage sur Douala (n'est plus affiché par le site).
            phoneFranceDisplay: { type: string, examples: ['+33 6 00 00 00 00'] }
            phoneCameroon: { $ref: '#/components/schemas/PhoneE164' }
            phoneCameroonDisplay: { type: string, examples: ['+237 6 00 00 00 00'] }
            email: { $ref: '#/components/schemas/Email' }
            hoursLabel: { type: string, description: Horaires résumés (barre supérieure). }
        whatsapp:
          type: object
          required: [enabled, number, message]
          properties:
            enabled: { type: boolean }
            number: { $ref: '#/components/schemas/PhoneE164' }
            numberDisplay: { type: string, examples: ['+237 6 00 00 00 00'], description: "Numéro WhatsApp tel qu'affiché (barre supérieure, pied de page)." }
            message: { type: string, maxLength: 500, description: Message pré-rempli (le nom du service ou la référence y est ajouté selon le contexte). }
        social:
          type: array
          items:
            type: object
            required: [network, url]
            properties:
              network: { $ref: '#/components/schemas/SocialNetwork' }
              url: { type: string, format: uri }
        agency:
          type: object
          required: [name, addressLines, city, country, openingHours]
          properties:
            name: { type: string }
            addressLines: { type: array, items: { type: string } }
            city: { type: string }
            country: { $ref: '#/components/schemas/CountryCode' }
            phone:
              oneOf: [{ $ref: '#/components/schemas/PhoneE164' }, { type: 'null' }]
              description: Téléphone de l'agence (carte « Douala » de la page Contact) ; vide = carte masquée.
            phoneDisplay: { type: [string, 'null'], examples: ['+237 6 00 00 00 00'] }
            latitude: { type: [number, 'null'], minimum: -90, maximum: 90, description: "Latitude WGS84 de l'agence (repère de la carte interactive et de la page Contact)." }
            longitude: { type: [number, 'null'], minimum: -180, maximum: 180, description: "Longitude WGS84 de l'agence." }
            mapsUrl: { type: [string, 'null'], format: uri }
            openingHours:
              type: array
              items:
                type: object
                required: [label, hours]
                properties:
                  label: { type: string, examples: [Lundi – vendredi] }
                  hours: { type: string, examples: ['8 h 30 – 18 h'] }
            parcelReceptionNote: { type: [string, 'null'] }
        keyFigures:
          type: array
          items: { $ref: '#/components/schemas/KeyFigure' }
        turnstileSiteKey: { type: string }
        analytics:
          type: object
          properties:
            ga4MeasurementId: { type: [string, 'null'], pattern: '^G-[A-Z0-9]+$' }
            searchConsoleVerification: { type: [string, 'null'] }
        seo:
          type: object
          properties:
            defaultTitle: { type: string }
            defaultDescription: { type: string }
            ogImageUrl: { type: [string, 'null'], format: uri }
        features:
          type: object
          required: [maintenanceMode]
          properties:
            maintenanceMode: { type: boolean }
            newsletterTracking: { type: boolean, description: Mesure d'ouverture/clic des campagnes activée (mentionnée dans la politique de confidentialité). }
        updatedAt: { $ref: '#/components/schemas/DateTime' }

    NavLink:
      type: object
      required: [label, href]
      properties:
        label: { type: string }
        href: { type: string }
        description: { type: [string, 'null'] }
        icon: { oneOf: [{ $ref: '#/components/schemas/IconName' }, { type: 'null' }] }

    NavItem:
      type: object
      required: [key, label, href, kind]
      properties:
        key: { type: string, examples: [services] }
        label: { type: string, examples: [Nos services] }
        href: { type: string, examples: [/services] }
        kind:
          type: string
          enum: [link, mega, dropdown]
        placement:
          type: string
          enum: [all, mobile]
          default: all
          description: '`mobile` : entrée du menu mobile seulement (absente de l''en-tête desktop).'
        children:
          type: array
          items: { $ref: '#/components/schemas/NavLink' }

    MegaMenuCategory:
      type: object
      required: [slug, name, tagline, icon, href, services]
      properties:
        slug: { $ref: '#/components/schemas/Slug' }
        name: { type: string }
        tagline: { type: string }
        icon: { $ref: '#/components/schemas/IconName' }
        tint: { $ref: '#/components/schemas/CategoryTint' }
        href: { type: string }
        countLabel: { type: string, examples: [4 formules · 2 services, 5 services], description: Nombre d'entrées affiché dans le menu mobile. }
        services:
          type: array
          items:
            type: object
            required: [slug, name, href]
            properties:
              slug: { $ref: '#/components/schemas/Slug' }
              name: { type: string }
              href: { type: string }

    ZoneTone:
      type: string
      description: Couleur de la zone sur la carte et dans la légende.
      enum: [zone1, zone2, zone3, special]

    GeoPoint:
      type: object
      description: Point géographique WGS84 (EPSG:4326), en degrés décimaux (6 décimales au plus, ≈ 0,1 m).
      required: [lat, lng]
      properties:
        lat: { type: number, minimum: -90, maximum: 90, examples: [4.0565] }
        lng: { type: number, minimum: -180, maximum: 180, examples: [9.732] }

    GeoJsonPosition:
      type: array
      description: 'Position GeoJSON `[longitude, latitude]` (ordre RFC 7946, inverse de `GeoPoint`).'
      minItems: 2
      maxItems: 2
      items: { type: number }
      examples: [[9.732, 4.0565]]

    GeoJsonLinearRing:
      type: array
      description: Anneau fermé (premier point = dernier point), 4 à 500 positions ; extérieur dans le sens inverse des aiguilles d'une montre.
      minItems: 4
      maxItems: 500
      items: { $ref: '#/components/schemas/GeoJsonPosition' }

    GeoJsonPolygon:
      type: object
      required: [type, coordinates]
      properties:
        type: { type: string, const: Polygon }
        coordinates:
          type: array
          description: Anneau extérieur puis éventuels trous.
          minItems: 1
          maxItems: 10
          items: { $ref: '#/components/schemas/GeoJsonLinearRing' }

    GeoJsonMultiPolygon:
      type: object
      required: [type, coordinates]
      properties:
        type: { type: string, const: MultiPolygon }
        coordinates:
          type: array
          minItems: 1
          maxItems: 20
          items:
            type: array
            minItems: 1
            maxItems: 10
            items: { $ref: '#/components/schemas/GeoJsonLinearRing' }

    ZoneArea:
      description: |
        Contour d'une zone sur la carte interactive (fond OpenStreetMap) : géométrie GeoJSON RFC 7946 `Polygon` ou
        `MultiPolygon` (une zone en plusieurs morceaux, ex. de part et d'autre du Wouri), en WGS84. Directement
        utilisable par `L.geoJSON()` (Leaflet) ou une source `geojson` (MapLibre), et importable depuis geojson.io ou uMap.
        5 000 positions au plus par zone ; validée côté serveur (anneaux fermés, emprise du Cameroun).
      oneOf:
        - $ref: '#/components/schemas/GeoJsonPolygon'
        - $ref: '#/components/schemas/GeoJsonMultiPolygon'

    ZoneQuarter:
      type: object
      required: [name]
      properties:
        name: { type: string, examples: [Bonamoussadi] }
        detail: { type: [string, 'null'], examples: [rive ouest du Wouri], description: Précision affichée dans la liste. }
        mapLabel: { type: [string, 'null'], examples: [Cité SIC · base de départ], description: Libellé sur la carte ; null = nom. }
        isBase: { type: boolean, default: false, description: Base de départ des interventions (point mis en avant). }
        labelOnSmallMap: { type: boolean, default: false, description: "Libellé affiché sur la carte réduite (mobile) ; les autres apparaissent en zoomant." }
        coordinates:
          description: Position géographique du quartier (repère de la carte interactive OpenStreetMap) ; `null` = non placé.
          oneOf:
            - $ref: '#/components/schemas/GeoPoint'
            - type: 'null'
        position:
          description: Position sur la carte stylisée de Douala (0 à 1, origine en haut à gauche) ; null = absent de la carte. Conservée pour la carte illustrée.
          oneOf:
            - type: object
              required: [x, y]
              properties:
                x: { type: number, minimum: 0, maximum: 1 }
                y: { type: number, minimum: 0, maximum: 1 }
            - type: 'null'

    Zone:
      type: object
      required: [key, name, tone, description, result, quarters]
      properties:
        key: { $ref: '#/components/schemas/Slug' }
        name: { type: string, examples: [Zone 3 — Élargie] }
        tone: { $ref: '#/components/schemas/ZoneTone' }
        description: { type: string, examples: [Quartiers résidentiels et périphérie.] }
        result: { type: string, description: Réponse affichée quand un quartier de la zone est recherché., examples: [Intervention à domicile et livraison possibles. Conditions confirmées sur devis.] }
        quarters: { type: array, items: { $ref: '#/components/schemas/ZoneQuarter' } }
        area:
          description: Contour de la zone sur la carte interactive ; `null` = pas de contour (seuls les quartiers sont placés).
          oneOf:
            - $ref: '#/components/schemas/ZoneArea'
            - type: 'null'

    ServiceAreas:
      type: object
      required: [zones]
      properties:
        zones: { type: array, items: { $ref: '#/components/schemas/Zone' } }
        map:
          description: |
            Cadrage initial de la carte interactive, calculé par l'API à partir des contours et des quartiers placés ;
            `null` si aucune zone n'est géolocalisée. L'agence est placée avec `SiteSettings.agency.latitude/longitude`.
          oneOf:
            - type: object
              required: [center, zoom, bounds]
              properties:
                center: { $ref: '#/components/schemas/GeoPoint' }
                zoom: { type: number, minimum: 1, maximum: 19, examples: [12] }
                bounds:
                  type: array
                  description: Emprise `[sud-ouest, nord-est]` couvrant zones et quartiers.
                  minItems: 2
                  maxItems: 2
                  items: { $ref: '#/components/schemas/GeoPoint' }
            - type: 'null'
        note: { type: [string, 'null'], examples: ["Votre quartier n’apparaît pas ? Contactez-nous : nous étudions chaque demande."] }
        updatedAt: { $ref: '#/components/schemas/DateTime' }

    Navigation:
      type: object
      required: [main, megaMenu, signUp, footer, legal]
      properties:
        main:
          type: array
          items: { $ref: '#/components/schemas/NavItem' }
        megaMenu:
          type: object
          required: [categories, promo]
          properties:
            categories:
              type: array
              items: { $ref: '#/components/schemas/MegaMenuCategory' }
            promo:
              type: object
              required: [title, text, cta, visual]
              properties:
                title: { type: string }
                text: { type: string }
                cta: { $ref: '#/components/schemas/Link' }
                visual: { $ref: '#/components/schemas/Visual' }
        signUp:
          type: array
          items: { $ref: '#/components/schemas/NavLink' }
        footer:
          type: object
          required: [about, columns, copyright, newsletter]
          properties:
            about: { type: string }
            copyright: { type: string, examples: ['© 2026 Mambo Proxi · France — Cameroun'] }
            newsletter:
              type: object
              required: [eyebrow, title, text]
              properties:
                eyebrow: { type: string, examples: [La lettre Mambo] }
                title: { type: string, examples: [Restez au plus près de nos nouveautés] }
                text: { type: string }
            columns:
              type: array
              items:
                type: object
                required: [title, links]
                properties:
                  title: { type: string }
                  links:
                    type: array
                    items: { $ref: '#/components/schemas/NavLink' }
        legal:
          type: array
          items: { $ref: '#/components/schemas/NavLink' }

    PageKey:
      type: string
      enum: [accueil, services, zones-d-intervention, magazine, qui-sommes-nous, mission, partenaires, formation, recrutement, avis-clients, contact, devis, devis-confirmation, inscription, suivi-mambo, questionnaire, mentions-legales, confidentialite, cookies, cgu, '404', erreur, maintenance, newsletter-confirmation, newsletter-desinscription]

    Page:
      type: object
      required: [key, title, sections, seo, updatedAt]
      properties:
        key: { $ref: '#/components/schemas/PageKey' }
        title: { type: string }
        sections:
          type: array
          description: Sections publiées et visibles, dans l'ordre d'affichage.
          items: { $ref: '#/components/schemas/PageSection' }
        seo: { $ref: '#/components/schemas/Seo' }
        isPreview: { type: boolean, default: false }
        updatedAt: { $ref: '#/components/schemas/DateTime' }

    SitemapEntry:
      type: object
      required: [path, lastModified]
      properties:
        path: { type: string, examples: [/services/experience/chef-prive] }
        lastModified: { $ref: '#/components/schemas/DateTime' }
        changeFrequency: { type: string, enum: [daily, weekly, monthly, yearly] }
        priority: { type: number, minimum: 0, maximum: 1 }

    Redirect:
      type: object
      required: [from, to, permanent]
      properties:
        from: { type: string }
        to: { type: string }
        permanent: { type: boolean }

    Health:
      type: object
      required: [status, checks]
      properties:
        status: { type: string, enum: [ok, degraded, down] }
        version: { type: string }
        checks:
          type: object
          properties:
            database: { type: string, enum: [up, down] }
            redis: { type: string, enum: [up, down] }
            storage: { type: string, enum: [up, down] }

    # ─────────────────────────── Recherche ──────────────────────────
    SearchResultType:
      type: string
      description: Libellés — Service, Rubrique, Page, Article du Magazine, Offre d'emploi, Formation.
      enum: [service, category, page, article, job, training]

    TextRange:
      type: object
      description: Plage d'un texte à surligner, en positions UTF-16 (`String.prototype.slice`), `end` exclu.
      required: [start, end]
      properties:
        start: { type: integer, minimum: 0 }
        end: { type: integer, minimum: 1 }

    SearchResult:
      type: object
      required: [type, id, key, title, context, excerpt, titleHighlights, highlights, href, visual, icon]
      properties:
        type: { $ref: '#/components/schemas/SearchResultType' }
        id: { $ref: '#/components/schemas/Id' }
        key:
          type: [string, 'null']
          description: 'Slug du service, de la rubrique, de l''offre ou de la formation ; clé de page (`PageKey`) ; `null` pour un article.'
          examples: [chef-prive]
        title: { type: string }
        context: { type: [string, 'null'], description: 'Précision affichée avec le titre : rubrique d''un service, thème d''un article, contrat et ville d''une offre…', examples: [Expérience] }
        excerpt: { type: string, maxLength: 240, description: 'Extrait en texte brut, centré sur le premier passage trouvé (« … » s''il est coupé).' }
        titleHighlights: { type: array, items: { $ref: '#/components/schemas/TextRange' }, description: Plages de `title` correspondant à la recherche. }
        highlights: { type: array, items: { $ref: '#/components/schemas/TextRange' }, description: Plages de `excerpt` correspondant à la recherche. }
        href:
          type: string
          maxLength: 500
          description: |
            Adresse interne française, comme partout dans le contrat ; le site la convertit dans la langue de la page
            (`SiteLink`). Services `/services/{rubrique}/{service}`, rubriques `/services/{rubrique}`, offres
            `/recrutement/{slug}`, formations `/formation#{slug}`, articles `/magazine#article-{id}`, pages : leur adresse.
          examples: [/services/experience/chef-prive]
        visual:
          description: Photo ou illustration du contenu ; `null` pour une page sans visuel ou une offre d'emploi.
          oneOf: [{ $ref: '#/components/schemas/Visual' }, { type: 'null' }]
        icon:
          description: Icône (rubriques, formations) ; `null` sinon.
          oneOf: [{ $ref: '#/components/schemas/IconName' }, { type: 'null' }]

    SearchGroup:
      type: object
      required: [type, label, total, items]
      properties:
        type: { $ref: '#/components/schemas/SearchResultType' }
        label: { type: string, description: Titre du groupe dans la langue demandée., examples: [Services] }
        total: { type: integer, minimum: 1, description: 'Nombre total de résultats du type (au-delà de `limit`).' }
        items: { type: array, minItems: 1, items: { $ref: '#/components/schemas/SearchResult' } }

    SearchResults:
      type: object
      required: [query, lang, total, groups]
      properties:
        query: { type: string, description: Texte recherché tel qu'interprété (espaces superflus retirés). }
        lang: { type: string, enum: [fr, en] }
        total: { type: integer, minimum: 0 }
        groups: { type: array, items: { $ref: '#/components/schemas/SearchGroup' }, description: Groupes non vides ; aucun résultat = liste vide. }

    # ─────────────────────── Mesure d'audience ──────────────────────
    AnalyticsAction:
      type: string
      description: 'Action mesurée — `quote` Devis, `whatsapp` WhatsApp, `call` Appel, `email` E-mail, `participate` « Je participe », `newsletter` Inscription newsletter, `appointment` Rendez-vous, `sign_up` Inscription, `contact` Message de contact, `application` Candidature, `partner` Demande de partenariat, `training` Demande de formation.'
      enum: [quote, whatsapp, call, email, participate, newsletter, appointment, sign_up, contact, application, partner, training]

    AnalyticsEventBase:
      type: object
      required: [path, lang, occurredAt]
      properties:
        path:
          type: string
          maxLength: 300
          pattern: '^/'
          description: |
            Adresse interne française de la page (sans préfixe de langue, paramètres ni ancre), ex.
            `/services/experience/chef-prive` pour `/en/services/experience/private-chef`. Les adresses de
            prévisualisation et du back-office sont ignorées.
          examples: [/services/experience/chef-prive]
        lang: { type: string, enum: [fr, en] }
        occurredAt: { $ref: '#/components/schemas/DateTime' }
        device: { type: string, enum: [mobile, tablet, desktop], description: 'Selon la largeur de la fenêtre (< 768, < 1280, au-delà).' }

    AnalyticsPageView:
      title: Page vue
      allOf:
        - $ref: '#/components/schemas/AnalyticsEventBase'
        - type: object
          required: [type]
          properties:
            type: { type: string, const: page_view }
            referrerHost: { type: [string, 'null'], maxLength: 253, description: 'Domaine du site d''origine, sans chemin ; `null` = accès direct ou navigation interne.', examples: [www.google.com] }

    AnalyticsActionEvent:
      title: Action
      allOf:
        - $ref: '#/components/schemas/AnalyticsEventBase'
        - type: object
          required: [type, action]
          properties:
            type: { type: string, const: action }
            action: { $ref: '#/components/schemas/AnalyticsAction' }
            step: { type: string, enum: [click, submit], default: click, description: '`click` : clic sur le bouton ou le lien ; `submit` : formulaire envoyé avec succès.' }
            target: { type: [string, 'null'], maxLength: 120, description: 'Contenu concerné : slug du service, de l''offre, de la formation ou de l''événement.', examples: [chef-prive] }
            placement: { type: [string, 'null'], maxLength: 40, description: 'Emplacement du bouton : `header`, `hero`, `section`, `sticky`, `footer`, `form`…', examples: [hero] }

    AnalyticsEvent:
      oneOf:
        - $ref: '#/components/schemas/AnalyticsPageView'
        - $ref: '#/components/schemas/AnalyticsActionEvent'

    AnalyticsEventBatch:
      type: object
      required: [consent, events]
      properties:
        consent: { type: boolean, description: Consentement « Mesure d'audience » donné dans le bandeau cookies. }
        visitorId:
          type: string
          format: uuid
          description: |
            Identifiant pseudonyme aléatoire (UUID v4) généré et conservé par le navigateur, **uniquement si
            `consent` vaut `true`** (sinon `422`) ; renouvelé si le consentement est retiré puis redonné, 13 mois au plus.
        events: { type: array, minItems: 1, maxItems: 50, items: { $ref: '#/components/schemas/AnalyticsEvent' } }

    AnalyticsBatchAccepted:
      type: object
      required: [accepted, rejected]
      properties:
        accepted: { type: integer, minimum: 0 }
        rejected: { type: integer, minimum: 0, description: 'Événements ignorés (horodatage hors fenêtre, page exclue, doublon).' }

    # ─────────────────────────── Catalogue ──────────────────────────
    CategoryTint:
      type: string
      description: Teinte de la carte de rubrique (token de couleur).
      enum: [orange-50, neutral-100, vert-50, neutral-900]

    IconTextItem:
      type: object
      required: [title, text]
      properties:
        icon: { oneOf: [{ $ref: '#/components/schemas/IconName' }, { type: 'null' }] }
        title: { type: string, maxLength: 120 }
        text: { type: string, maxLength: 600 }

    StepItem:
      type: object
      required: [title, text]
      properties:
        title: { type: string, maxLength: 120 }
        text: { type: string, maxLength: 600 }

    FaqItem:
      type: object
      required: [question, answer]
      properties:
        question: { type: string, maxLength: 200 }
        answer: { type: string, maxLength: 2000 }

    ServiceOffer:
      type: object
      description: |
        Carte du carrousel « Nos offres » d'une fiche service (offre, chef, formule…). Deux actions : l'action
        principale (`action`, libellé et flèche →) et l'autre action (flèche ↗) : devis ou prise de rendez-vous,
        le service étant présélectionné.
      required: [id, title, text, visual, action, actionLabel]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        title: { type: string, maxLength: 80, examples: [Entretien régulier] }
        titleMobile: { type: [string, 'null'], maxLength: 60, description: Titre court en mobile (null = même titre). }
        text: { type: string, maxLength: 200, examples: [Ménage hebdomadaire ou bimensuel, mêmes intervenantes à chaque passage.] }
        textMobile: { type: [string, 'null'], maxLength: 160, description: Texte court en mobile (null = même texte). }
        icon: { oneOf: [{ $ref: '#/components/schemas/IconName' }, { type: 'null' }], description: Pastille d'icône à gauche du titre (null = sans pastille). }
        visual: { $ref: '#/components/schemas/Visual' }
        action: { type: string, enum: [QUOTE, BOOKING], description: '`QUOTE` : devis gratuit ; `BOOKING` : prise de rendez-vous.' }
        actionLabel: { type: string, maxLength: 40, examples: [Je demande un devis gratuit] }
        actionLabelMobile: { type: [string, 'null'], maxLength: 24, examples: [Devis gratuit] }
        serviceSlug: { oneOf: [{ $ref: '#/components/schemas/Slug' }, { type: 'null' }], description: "Service présélectionné par les deux actions (carrousels d'une rubrique) ; null = service de la fiche." }

    ServiceOffers:
      type: object
      required: [eyebrow, title, items]
      properties:
        eyebrow: { type: string, maxLength: 40, examples: [Nos offres] }
        title: { $ref: '#/components/schemas/AccentText' }
        titleMobile: { type: [string, 'null'], maxLength: 80, description: Titre court en mobile (null = même titre). }
        lead: { type: [string, 'null'], maxLength: 200 }
        leadMobile: { type: [string, 'null'], maxLength: 120, description: Chapô court en mobile (null = même chapô). }
        items: { type: array, minItems: 1, maxItems: 12, items: { $ref: '#/components/schemas/ServiceOffer' } }

    ServiceOfferInput:
      type: object
      required: [title, text, action, actionLabel]
      properties:
        id: { oneOf: [{ $ref: '#/components/schemas/Id' }, { type: 'null' }], description: Absent ou null pour une nouvelle offre. }
        title: { type: string, minLength: 2, maxLength: 80 }
        titleMobile: { type: [string, 'null'], maxLength: 60 }
        text: { type: string, minLength: 2, maxLength: 200 }
        textMobile: { type: [string, 'null'], maxLength: 160 }
        icon: { oneOf: [{ $ref: '#/components/schemas/IconName' }, { type: 'null' }] }
        illustration: { $ref: '#/components/schemas/IllustrationScene' }
        imageId: { oneOf: [{ $ref: '#/components/schemas/Id' }, { type: 'null' }] }
        action: { type: string, enum: [QUOTE, BOOKING] }
        actionLabel: { type: string, minLength: 2, maxLength: 40 }
        actionLabelMobile: { type: [string, 'null'], maxLength: 24 }
        serviceId: { oneOf: [{ $ref: '#/components/schemas/Id' }, { type: 'null' }], description: "Service présélectionné (carrousels d'une rubrique) ; null = service de la fiche." }

    QuoteField:
      type: object
      description: Champ dynamique de l'étape « Votre besoin » du devis (défini par rubrique dans le back-office).
      required: [name, label, type, required]
      properties:
        name: { type: string, pattern: '^[a-z][a-zA-Z0-9]*$', examples: [eventDate] }
        label: { type: string, examples: [Date souhaitée] }
        type: { type: string, enum: [text, textarea, date, number, select, chips, city] }
        required: { type: boolean }
        placeholder: { type: [string, 'null'] }
        helpText: { type: [string, 'null'] }
        options: { type: array, items: { type: string } }
        min: { type: [number, 'null'] }
        max: { type: [number, 'null'] }
        width: { type: string, enum: [full, half], default: half }

    CategoryRef:
      type: object
      required: [slug, name]
      properties:
        slug: { $ref: '#/components/schemas/Slug' }
        name: { type: string }

    CategorySummary:
      type: object
      required: [id, slug, name, tagline, description, icon, tint, visual, sortOrder, serviceCount, href]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        slug: { $ref: '#/components/schemas/Slug' }
        name: { type: string, examples: [Expérience] }
        tagline: { type: string, examples: [Des moments sur mesure] }
        description: { type: string }
        icon: { $ref: '#/components/schemas/IconName' }
        tint: { $ref: '#/components/schemas/CategoryTint' }
        iconColor: { type: string, description: Token de couleur de l'icône, examples: [orange-700] }
        visual: { $ref: '#/components/schemas/Visual' }
        thumbnail:
          oneOf: [{ $ref: '#/components/schemas/Visual' }, { type: 'null' }]
          description: Vignette des cartes « Nos autres rubriques » (pages rubrique) ; null = visuel principal.
        sortOrder: { type: integer }
        serviceCount: { type: integer }
        href: { type: string, examples: [/services/experience] }
        number: { type: string, examples: ['01'], description: Numéro affiché (ordre). }
        homeCard:
          type: object
          description: Carte « Nos univers » de l'accueil (textes courts propres à la carte).
          properties:
            title: { type: string, examples: [Des moments sur mesure] }
            text: { type: string }
            textMobile: { type: [string, 'null'], description: Texte raccourci en mobile ; null = texte principal. }
            chips: { type: array, items: { type: string } }
            visual:
              oneOf: [{ $ref: '#/components/schemas/Visual' }, { type: 'null' }]
              description: Visuel de la carte de l'accueil ; null = visuel principal de la rubrique.
            visualMobile:
              oneOf: [{ $ref: '#/components/schemas/Visual' }, { type: 'null' }]
              description: Visuel de la carte en mobile ; null = visuel de la carte.
        services:
          type: array
          description: Présent avec `include=services`.
          items: { $ref: '#/components/schemas/ServiceSummary' }

    CategoryHighlight:
      type: object
      description: Bloc spécifique à une rubrique (réception de colis, agenda culturel, bande d'engagements).
      required: [kind, title]
      properties:
        kind:
          type: string
          enum: [PARCEL_RECEPTION, AGENDA, STEPS_BAND]
          description: '`STEPS_BAND` : bande sombre de cartes numérotées avec note (ex. « Des intervenantes de confiance »), même présentation que la réception de colis.'
        eyebrow: { type: [string, 'null'] }
        title: { $ref: '#/components/schemas/AccentText' }
        text: { type: [string, 'null'] }
        steps:
          type: array
          description: Étapes illustrées (réception de colis).
          items: { $ref: '#/components/schemas/IconTextItem' }
        note: { type: [string, 'null'] }
        link: { oneOf: [{ $ref: '#/components/schemas/Link' }, { type: 'null' }], description: "Lien complémentaire (ex. « Voir tout l'agenda »)." }

    CategoryDetail:
      allOf:
        - $ref: '#/components/schemas/CategorySummary'
        - type: object
          required: [heroTitle, heroLead, audiences, processSteps, services, groups, quoteFields, otherCategories, cta, seo]
          properties:
            eyebrow: { type: [string, 'null'] }
            heroTitle: { $ref: '#/components/schemas/AccentText' }
            heroLead: { type: string }
            heroVisual: { $ref: '#/components/schemas/Visual' }
            audiencesTitle: { type: [string, 'null'] }
            audiences: { type: array, items: { $ref: '#/components/schemas/IconTextItem' } }
            servicesTitle: { type: [string, 'null'] }
            servicesLead: { type: [string, 'null'], examples: [Zones desservies communiquées lors du devis.] }
            groups:
              type: array
              description: "Groupes titrés de services (ex. Immobilier). Vide = liste simple. Rubrique de formules : services proposés à la carte, sous les formules."
              items:
                type: object
                required: [title, serviceSlugs]
                properties:
                  title: { type: string }
                  serviceSlugs: { type: array, items: { $ref: '#/components/schemas/Slug' } }
            highlight:
              oneOf:
                - $ref: '#/components/schemas/CategoryHighlight'
                - type: 'null'
            offerSections:
              type: array
              description: "Carrousels d'offres sous les services de la rubrique (ex. véhicules, prestataires) ; chaque offre précise son service."
              items: { $ref: '#/components/schemas/ServiceOffers' }
            processEyebrow: { type: [string, 'null'], examples: [Comment ça marche ?], description: Sur-titre du déroulé ; null = libellé par défaut. }
            processTitle: { type: [string, 'null'] }
            processSteps: { type: array, items: { $ref: '#/components/schemas/StepItem' } }
            testimonial:
              oneOf:
                - $ref: '#/components/schemas/Review'
                - type: 'null'
            testimonialVisual: { $ref: '#/components/schemas/Visual' }
            quoteFields: { type: array, items: { $ref: '#/components/schemas/QuoteField' } }
            otherCategories: { type: array, items: { $ref: '#/components/schemas/CategorySummary' } }
            cta:
              type: object
              required: [title, text]
              properties:
                title: { $ref: '#/components/schemas/AccentText' }
                text: { type: string }
            seo: { $ref: '#/components/schemas/Seo' }

    ServiceSummary:
      type: object
      required: [id, slug, name, summary, icon, visual, category, href]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        slug: { $ref: '#/components/schemas/Slug' }
        name: { type: string, examples: [Chef privé] }
        shortName: { type: [string, 'null'] }
        summary: { type: string, examples: [Un chef à domicile pour vos dîners, réceptions et grandes occasions.] }
        icon: { $ref: '#/components/schemas/IconName' }
        visual: { $ref: '#/components/schemas/Visual' }
        category: { $ref: '#/components/schemas/CategoryRef' }
        href: { type: string, examples: [/services/experience/chef-prive] }
        featuredOnHome: { type: boolean }
        kind:
          type: string
          enum: [service, formula]
          default: service
          description: '`formula` : formule de la rubrique « Services à domicile » (carte avec photo, « Réserver un créneau » et « Devis »).'

    ServiceDetail:
      allOf:
        - $ref: '#/components/schemas/ServiceSummary'
        - type: object
          required: [tagline, cities, audiences, steps, advantages, faq, quoteBullets, gallery, showWhatsapp, related, reviews, seo, toComplete, updatedAt]
          properties:
            tagline: { type: string }
            cities: { type: array, items: { type: string } }
            audiences: { type: array, items: { type: string } }
            steps: { type: array, items: { $ref: '#/components/schemas/StepItem' } }
            advantages: { type: array, items: { $ref: '#/components/schemas/IconTextItem' } }
            faq: { type: array, items: { $ref: '#/components/schemas/FaqItem' } }
            quoteBullets: { type: array, items: { type: string } }
            gallery:
              type: array
              maxItems: 3
              items: { $ref: '#/components/schemas/Visual' }
            showWhatsapp: { type: boolean }
            related: { type: array, items: { $ref: '#/components/schemas/ServiceSummary' } }
            offers:
              description: Carrousel « Nos offres » sous le héros (null = section absente).
              oneOf:
                - $ref: '#/components/schemas/ServiceOffers'
                - type: 'null'
            reviews: { type: array, items: { $ref: '#/components/schemas/Review' } }
            reviewsTitle: { type: [string, 'null'], examples: [Ils ont reçu un chef à domicile] }
            relatedTitle: { type: [string, 'null'], examples: [Pour compléter votre événement] }
            cta:
              type: object
              required: [title, text]
              properties:
                title: { $ref: '#/components/schemas/AccentText' }
                text: { type: string }
            reviewSummary:
              oneOf:
                - $ref: '#/components/schemas/ReviewSummary'
                - type: 'null'
            seo: { $ref: '#/components/schemas/Seo' }
            toComplete: { type: boolean, description: Contenu provisoire à compléter par la cliente. }
            updatedAt: { $ref: '#/components/schemas/DateTime' }

    # ──────────────────────────── Avis ──────────────────────────────
    Review:
      type: object
      required: [id, authorName, initials, rating, text, verified, date]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        authorName: { type: string, description: Nom affiché « Prénom N. », examples: [Aminata D.] }
        initials: { type: string, maxLength: 3, examples: [AD] }
        city: { type: [string, 'null'], examples: [Douala] }
        rating: { type: integer, minimum: 1, maximum: 5 }
        text: { type: string, maxLength: 2000 }
        excerpt: { type: [string, 'null'], maxLength: 200, description: "Citation courte d'un avis mis en avant (accueil en mobile) ; null = texte tronqué." }
        service:
          oneOf:
            - type: object
              required: [slug, name, categorySlug]
              properties:
                slug: { $ref: '#/components/schemas/Slug' }
                name: { type: string }
                categorySlug: { $ref: '#/components/schemas/Slug' }
                categoryName: { type: string }
            - type: 'null'
        verified: { type: boolean, description: Avis issu du questionnaire après prestation. }
        featured: { type: boolean }
        date: { $ref: '#/components/schemas/DateTime' }
        reply: { type: [string, 'null'] }

    ReviewSummary:
      type: object
      required: [average, total, verifiedCount, distribution]
      properties:
        average: { type: number, minimum: 0, maximum: 5, examples: [4.9] }
        total: { type: integer, examples: [120] }
        verifiedCount: { type: integer }
        distribution:
          type: object
          required: ['1', '2', '3', '4', '5']
          properties:
            '1': { type: integer }
            '2': { type: integer }
            '3': { type: integer }
            '4': { type: integer }
            '5': { type: integer }

    # ─────────────────────────── Contenus ───────────────────────────
    PartnerCategory:
      type: string
      enum: [EXPERIENCE, IMMOBILIER, ENTREPRISES]
      description: Prestataires Expérience · Immobilier · Entreprises & prestataires.

    Partner:
      type: object
      required: [id, name, category, categoryLabel]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        name: { type: string }
        category: { $ref: '#/components/schemas/PartnerCategory' }
        categoryLabel: { type: string, examples: [Prestataires Expérience] }
        logo:
          oneOf:
            - $ref: '#/components/schemas/MediaImage'
            - type: 'null'
        url: { type: [string, 'null'], format: uri }

    TrainingCategory:
      type: string
      enum: [PROFESSIONNELS, ATELIERS, SENSIBILISATION]

    Training:
      type: object
      required: [id, slug, title, category, categoryLabel, audienceLabel, icon, duration, format]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        slug: { $ref: '#/components/schemas/Slug' }
        title: { type: string }
        category: { $ref: '#/components/schemas/TrainingCategory' }
        categoryLabel: { type: string }
        audienceLabel: { type: string }
        icon: { $ref: '#/components/schemas/IconName' }
        duration: { type: string }
        format: { type: string }
        location: { type: [string, 'null'] }
        description: { type: [string, 'null'] }

    JobOfferSummary:
      type: object
      required: [id, slug, title, city, country, contractType, summary, publishedAt, isNew]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        slug: { $ref: '#/components/schemas/Slug' }
        title: { type: string }
        city: { type: string }
        country: { $ref: '#/components/schemas/CountryCode' }
        contractType: { type: string, examples: [CDI] }
        summary: { type: string }
        publishedAt: { $ref: '#/components/schemas/DateTime' }
        isNew: { type: boolean, description: Publiée il y a moins de 7 jours. }

    JobOfferDetail:
      allOf:
        - $ref: '#/components/schemas/JobOfferSummary'
        - type: object
          required: [missions, profile, benefits, sectors]
          properties:
            startDate: { type: [string, 'null'], examples: ['janvier 2027'] }
            workingTime: { type: [string, 'null'], examples: [temps plein] }
            locationLabel: { type: [string, 'null'], examples: ['Douala, Cameroun'] }
            sectors:
              type: array
              items: { type: string }
              description: "Quartiers d'intervention ; affichés « Secteurs : … » à la place du lieu quand la liste n'est pas vide."
              examples: [[Bonamoussadi, Makèpè, Cité SIC]]
            salary:
              oneOf: [{ $ref: '#/components/schemas/JobSalary' }, { type: 'null' }]
            schedule: { type: [string, 'null'], examples: ['8 h par jour · 5 jours par semaine'] }
            description: { type: [string, 'null'] }
            missions: { type: array, items: { type: string } }
            profile: { type: array, items: { type: string } }
            benefits: { type: array, items: { type: string } }
            expiresAt: { oneOf: [{ $ref: '#/components/schemas/DateTime' }, { type: 'null' }] }

    JobSalary:
      type: object
      description: Rémunération du poste (salaire proposé au candidat, sans rapport avec le prix des prestations). Affichée « 90 000 – 120 000 FCFA par mois ».
      required: [min, max, currency, period]
      properties:
        min: { type: integer, minimum: 0, examples: [90000] }
        max: { type: [integer, 'null'], minimum: 0, description: Absent pour un montant unique., examples: [120000] }
        currency: { type: string, enum: [XAF, EUR] }
        period: { type: string, enum: [HOUR, DAY, WEEK, MONTH, YEAR] }

    Event:
      type: object
      required: [id, slug, title, startsAt, city, tag, visual, limited]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        slug: { $ref: '#/components/schemas/Slug' }
        title: { type: string }
        startsAt: { $ref: '#/components/schemas/DateTime' }
        endsAt: { oneOf: [{ $ref: '#/components/schemas/DateTime' }, { type: 'null' }] }
        city: { type: string }
        place: { type: [string, 'null'] }
        tag: { type: string, examples: [Concert] }
        visual: { $ref: '#/components/schemas/Visual' }
        description: { type: [string, 'null'] }
        capacity: { type: [integer, 'null'] }
        remainingPlaces: { type: [integer, 'null'] }
        limited: { type: boolean, description: Afficher la mention « Places limitées ». }

    # ─────────────────────────── Rendez-vous ────────────────────────
    AppointmentFormat:
      type: string
      enum: [AGENCE, TELEPHONE, VISIO]

    AppointmentReason:
      type: string
      enum: [DEVIS, IMMOBILIER, PARTENARIAT, RECRUTEMENT, AUTRE]

    AvailabilitySlot:
      type: object
      required: [startsAt, endsAt, formats]
      properties:
        startsAt: { $ref: '#/components/schemas/DateTime' }
        endsAt: { $ref: '#/components/schemas/DateTime' }
        formats: { type: array, items: { $ref: '#/components/schemas/AppointmentFormat' } }

    Availability:
      type: object
      required: [timezone, days]
      properties:
        timezone: { type: string, const: Africa/Douala }
        timezoneLabel: { type: string, examples: ['Heure de Douala (UTC+1)'] }
        days:
          type: array
          items:
            type: object
            required: [date, available, slots]
            properties:
              date: { type: string, format: date }
              available: { type: boolean }
              closedReason: { type: [string, 'null'] }
              slots: { type: array, items: { $ref: '#/components/schemas/AvailabilitySlot' } }

    # ────────────────────────── Questionnaire ───────────────────────
    SurveyQuestionKind:
      type: string
      enum: [STARS, CHOICE, NPS, TEXT]

    SurveyQuestion:
      type: object
      required: [id, order, kind, label, options, required]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        order: { type: integer }
        kind: { $ref: '#/components/schemas/SurveyQuestionKind' }
        label: { type: string }
        helpText: { type: [string, 'null'] }
        options: { type: array, items: { type: string }, description: 'Choix proposés (CHOICE), libellés des notes 1→5 (STARS) ou bornes de l''échelle 0–10 (NPS : [gauche, droite]).' }
        required: { type: boolean }

    PublicSurvey:
      type: object
      required: [reference, service, questions, expiresAt]
      properties:
        reference: { $ref: '#/components/schemas/Reference' }
        firstName: { type: [string, 'null'] }
        service:
          type: object
          required: [name, categoryName, visual]
          properties:
            name: { type: string }
            categoryName: { type: string }
            visual: { $ref: '#/components/schemas/Visual' }
        serviceDate: { oneOf: [{ $ref: '#/components/schemas/DateTime' }, { type: 'null' }] }
        questions: { type: array, items: { $ref: '#/components/schemas/SurveyQuestion' } }
        expiresAt: { $ref: '#/components/schemas/DateTime' }

    SurveyAnswer:
      type: object
      required: [questionId]
      properties:
        questionId: { $ref: '#/components/schemas/Id' }
        value:
          description: Note (STARS 1–5, NPS 0–10), choix (CHOICE) ou texte (TEXT).
          oneOf:
            - type: integer
            - type: string
              maxLength: 2000
            - type: 'null'

    # ──────────────────────── Formulaires publics ───────────────────
    ContactPreference:
      type: string
      enum: [WHATSAPP, TELEPHONE, EMAIL]

    QuoteRequestInput:
      type: object
      required: [categorySlug, needs, description, contact, contactPreference, consent, antiSpam]
      properties:
        categorySlug: { $ref: '#/components/schemas/Slug' }
        serviceSlug: { oneOf: [{ $ref: '#/components/schemas/Slug' }, { type: 'null' }] }
        needs:
          type: object
          description: Valeurs des champs dynamiques (`quoteFields` de la rubrique), indexées par `name`.
          additionalProperties:
            oneOf:
              - type: string
                maxLength: 500
              - type: number
              - type: array
                items: { type: string, maxLength: 120 }
                maxItems: 20
              - type: 'null'
        description: { type: string, minLength: 20, maxLength: 3000 }
        contact:
          allOf:
            - $ref: '#/components/schemas/ContactIdentity'
            - type: object
              required: [country]
        contactPreference: { $ref: '#/components/schemas/ContactPreference' }
        consent: { $ref: '#/components/schemas/Consent' }
        antiSpam: { $ref: '#/components/schemas/AntiSpam' }

    ContactMessageInput:
      type: object
      required: [type, contact, message, consent, antiSpam]
      properties:
        type: { type: string, enum: [CONTACT, INFORMATION] }
        contact:
          type: object
          description: Téléphone, pays et sujet facultatifs (maquette Contact).
          required: [fullName, email]
          properties:
            fullName: { type: string, minLength: 2, maxLength: 120 }
            email: { $ref: '#/components/schemas/Email' }
            phone: { oneOf: [{ $ref: '#/components/schemas/PhoneE164' }, { type: 'null' }] }
            country: { oneOf: [{ $ref: '#/components/schemas/CountryCode' }, { type: 'null' }] }
            city: { type: [string, 'null'], maxLength: 80 }
        subject: { type: [string, 'null'], maxLength: 120 }
        serviceSlug:
          description: Service concerné (demande d'information uniquement).
          oneOf: [{ $ref: '#/components/schemas/Slug' }, { type: 'null' }]
        message: { type: string, minLength: 10, maxLength: 3000 }
        consent: { $ref: '#/components/schemas/Consent' }
        antiSpam: { $ref: '#/components/schemas/AntiSpam' }

    AppointmentInput:
      type: object
      required: [reason, format, startsAt, contact, consent, antiSpam]
      properties:
        reason: { $ref: '#/components/schemas/AppointmentReason' }
        format: { $ref: '#/components/schemas/AppointmentFormat' }
        startsAt: { $ref: '#/components/schemas/DateTime' }
        contact: { $ref: '#/components/schemas/ContactIdentity' }
        message: { type: [string, 'null'], maxLength: 1000 }
        consent: { $ref: '#/components/schemas/Consent' }
        antiSpam: { $ref: '#/components/schemas/AntiSpam' }

    RegistrationInput:
      type: object
      required: [profile, firstName, lastName, email, phone, consent, antiSpam]
      properties:
        profile: { type: string, enum: [PARTICULIER, PROFESSIONNEL] }
        firstName: { type: string, minLength: 1, maxLength: 60 }
        lastName: { type: string, minLength: 1, maxLength: 60 }
        email: { $ref: '#/components/schemas/Email' }
        phone: { $ref: '#/components/schemas/PhoneE164' }
        country:
          description: Pays de résidence ; absent ou `null` quand la personne vit hors du Cameroun sans préciser (champ « Ville ou quartier » de la maquette).
          oneOf: [{ $ref: '#/components/schemas/CountryCode' }, { type: 'null' }]
        city: { type: [string, 'null'], maxLength: 80, description: 'Ville, avec le quartier s’il est indiqué (« Akwa, Douala »).' }
        interests:
          type: array
          description: Slugs des rubriques qui intéressent le contact (particulier) ou rubriques d'intervention (professionnel).
          items: { $ref: '#/components/schemas/Slug' }
          maxItems: 10
        organization: { type: [string, 'null'], maxLength: 120, description: 'Nom de la structure (professionnel, obligatoire).' }
        activity: { type: [string, 'null'], maxLength: 120, description: 'Activité principale (professionnel, obligatoire).' }
        newsletter: { type: boolean, default: false, description: Case non cochée par défaut (consentement explicite). }
        consent: { $ref: '#/components/schemas/Consent' }
        antiSpam: { $ref: '#/components/schemas/AntiSpam' }

    TrainingRequestInput:
      type: object
      required: [trainingSlug, contact, participants, consent, antiSpam]
      properties:
        trainingSlug:
          description: Formation choisie dans le catalogue ou `autre`.
          type: string
          maxLength: 120
        otherTraining: { type: [string, 'null'], maxLength: 200 }
        organization: { type: [string, 'null'], maxLength: 120 }
        participants: { type: integer, minimum: 1, maximum: 500 }
        period: { type: [string, 'null'], maxLength: 120, description: Période souhaitée. }
        contact: { $ref: '#/components/schemas/ContactIdentity' }
        message: { type: [string, 'null'], maxLength: 3000 }
        consent: { $ref: '#/components/schemas/Consent' }
        antiSpam: { $ref: '#/components/schemas/AntiSpam' }

    PartnershipType:
      type: string
      enum: [PRESTATAIRE_EXPERIENCE, IMMOBILIER, ENTREPRISE_PRESTATAIRE, AUTRE]

    PartnerRequestInput:
      type: object
      required: [partnershipType, organization, activity, contact, consent, antiSpam]
      properties:
        partnershipType: { $ref: '#/components/schemas/PartnershipType' }
        organization: { type: string, maxLength: 120 }
        activity: { type: string, maxLength: 120 }
        contact:
          allOf:
            - $ref: '#/components/schemas/ContactIdentity'

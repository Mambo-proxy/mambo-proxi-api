      type: object
      title: seo
      required: [group, defaultTitle, defaultDescription]
      properties:
        group: { type: string, const: seo }
        defaultTitle: { type: string, maxLength: 60 }
        defaultDescription: { type: string, maxLength: 160 }
        ogImageId: { oneOf: [{ $ref: '#/components/schemas/Id' }, { type: 'null' }] }
        ogImage:
          readOnly: true
          description: Image de partage correspondant à `ogImageId` (lecture seule, ignorée à l'enregistrement).
          oneOf: [{ $ref: '#/components/schemas/MediaImage' }, { type: 'null' }]
        searchConsoleVerification: { type: [string, 'null'] }

    SettingsAnalytics:
      type: object
      title: analytics
      required: [group]
      properties:
        group: { type: string, const: analytics }
        ga4MeasurementId: { type: [string, 'null'], pattern: '^G-[A-Z0-9]+$' }
        ga4PropertyId: { type: [string, 'null'], description: Pour la carte « Visites » du tableau de bord (GA4 Data API). }
        newsletterTracking: { type: boolean, default: false }

    SettingsChiffres:
      type: object
      title: chiffres
      required: [group, keyFigures]
      properties:
        group: { type: string, const: chiffres }
        keyFigures: { type: array, maxItems: 8, items: { $ref: '#/components/schemas/KeyFigure' } }

    SettingsRgpd:
      type: object
      title: rgpd
      required: [group, inactiveContactsRetentionMonths, rejectedApplicationsRetentionMonths]
      properties:
        group: { type: string, const: rgpd }
        inactiveContactsRetentionMonths: { type: integer, minimum: 6, maximum: 120, default: 36 }
        rejectedApplicationsRetentionMonths: { type: integer, minimum: 1, maximum: 60, default: 24 }

    SettingsSecurite:
      type: object
      title: securite
      required: [group, maintenanceMode]
      properties:
        group: { type: string, const: securite }
        maintenanceMode: { type: boolean }
        trustedDeviceDays: { type: integer, minimum: 0, maximum: 90, default: 30 }

    SystemStatus:
      type: object
      required: [https, lastBackupAt, backupRetentionDays, version]
      properties:
        https: { type: boolean }
        lastBackupAt: { oneOf: [{ $ref: '#/components/schemas/DateTime' }, { type: 'null' }] }
        lastBackupSize: { type: [integer, 'null'] }
        backupRetentionDays: { type: integer }
        version: { type: string }
        emailProvider: { type: [string, 'null'] }

    EmailTemplateKey:
      type: string
      enum:
        - quote-ack
        - team-new-request
        - team-assignment
        - contact-ack
        - appointment-received
        - appointment-confirmed
        - appointment-proposed
        - appointment-cancelled
        - appointment-reminder
        - survey-invitation
        - survey-reminder
        - registration-confirmed
        - application-received
        - training-request-received
        - partner-request-received
        - event-registration
        - newsletter-confirm
        - newsletter-campaign
        - user-invite
        - otp-code
        - password-reset

    EmailTemplateFields:
      type: object
      properties:
        subject: { type: string, maxLength: 150 }
        preheader: { type: [string, 'null'], maxLength: 150 }
        title: { type: string, maxLength: 150 }
        paragraphs: { type: array, maxItems: 8, items: { type: string, maxLength: 1500 } }
        buttonLabel: { type: [string, 'null'], maxLength: 60 }
        enabled: { type: boolean }

    EmailTemplateInput:
      allOf:
        - $ref: '#/components/schemas/EmailTemplateFields'
        - type: object
          minProperties: 1

    EmailTemplate:
      allOf:
        - $ref: '#/components/schemas/EmailTemplateFields'
        - type: object
          required: [key, name, description, subject, title, paragraphs, enabled, canDisable, variables, updatedAt]
          properties:
            key: { $ref: '#/components/schemas/EmailTemplateKey' }
            name: { type: string, examples: [Accusé de réception du devis] }
            description: { type: string }
            audience: { type: string, enum: [client, equipe, utilisateur] }
            canDisable: { type: boolean, description: 'Les e-mails de sécurité (code, mot de passe) ne peuvent pas être désactivés.' }
            variables:
              type: array
              description: Variables utilisables, ex. `{prénom}`, `{référence}`, `{service}`.
              items: { type: string }
            updatedAt: { $ref: '#/components/schemas/DateTime' }

    # ─────────────────────────── Admin — Utilisateurs ───────────────
    AdminUser:
      type: object
      required: [id, email, name, initials, role, isActive, status, createdAt]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        email: { $ref: '#/components/schemas/Email' }
        name: { type: string }
        initials: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        isActive: { type: boolean }
        status: { type: string, enum: [ACTIF, INVITE, DESACTIVE] }
        invitedAt: { oneOf: [{ $ref: '#/components/schemas/DateTime' }, { type: 'null' }] }
        lastLoginAt: { oneOf: [{ $ref: '#/components/schemas/DateTime' }, { type: 'null' }] }
        lastActiveAt:
          description: Dernière requête authentifiée (mise à jour au plus une fois par minute).
          oneOf: [{ $ref: '#/components/schemas/DateTime' }, { type: 'null' }]
        createdAt: { $ref: '#/components/schemas/DateTime' }

    TeamMemberPresence:
      type: object
      required: [user, role, online, lastActiveAt, lastLoginAt, assignable, openTasks]
      properties:
        user: { $ref: '#/components/schemas/UserRef' }
        role: { $ref: '#/components/schemas/Role' }
        online: { type: boolean, description: Activité depuis moins de `onlineWindowMinutes` sur une session encore valide. }
        lastActiveAt: { oneOf: [{ $ref: '#/components/schemas/DateTime' }, { type: 'null' }] }
        lastLoginAt: { oneOf: [{ $ref: '#/components/schemas/DateTime' }, { type: 'null' }] }
        assignable: { type: boolean, description: 'Peut recevoir des demandes et des rendez-vous (`requests:read` ou `requests:read-assigned`).' }
        openTasks: { type: integer, minimum: 0, description: 'Demandes ouvertes (`NOUVELLE`, `EN_COURS`) et rendez-vous à venir qui lui sont assignés.' }

    TeamPresence:
      type: object
      required: [onlineWindowMinutes, onlineCount, generatedAt, data]
      properties:
        onlineWindowMinutes: { type: integer, examples: [5] }
        onlineCount: { type: integer, minimum: 0 }
        generatedAt: { $ref: '#/components/schemas/DateTime' }
        data: { type: array, items: { $ref: '#/components/schemas/TeamMemberPresence' } }

    # ──────────────────────────── Admin — Médias ────────────────────
    Media:
      allOf:
        - $ref: '#/components/schemas/MediaImage'
        - type: object
          required: [fileName, mimeType, size, status, usages, createdAt]
          properties:
            fileName: { type: string }
            mimeType: { type: string, enum: [image/jpeg, image/png, image/webp, image/svg+xml] }
            size: { type: integer }
            status: { type: string, enum: [PROCESSING, READY, FAILED] }
            usages:
              type: array
              items:
                type: object
                required: [kind, label]
                properties:
                  kind: { type: string }
                  label: { type: string }
                  href: { type: [string, 'null'] }
            createdAt: { $ref: '#/components/schemas/DateTime' }

    # ──────────────────────────── Admin — Journal ───────────────────
    AuditLogEntry:
      type: object
      required: [id, action, entity, label, createdAt]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        actor: { oneOf: [{ $ref: '#/components/schemas/UserRef' }, { type: 'null' }] }
        action: { type: string, examples: [service.publish] }
        entity: { type: string, examples: [Service] }
        entityId: { type: [string, 'null'] }
        label: { type: string, examples: ['A publié le service « Chef privé »'] }
        diff: { type: [object, 'null'], additionalProperties: true }
        ip: { type: [string, 'null'] }
        createdAt: { $ref: '#/components/schemas/DateTime' }

    # ──────────────────────── Sections de pages (CMS) ───────────────
    PageSectionType:
      type: string
      enum: [hero, marquee, steps, featureList, cardGrid, textMedia, quote, statsGrid, team, faq, richText, ctaBand, dynamic]

    SectionTone:
      type: string
      description: Fond de la section (tokens) — light = neutral/0, muted = neutral/50, dark = neutral/900, green = vert/50, orange = orange/50.
      enum: [light, muted, dark, green, orange]

    SectionBase:
      type: object
      required: [id, type, enabled]
      properties:
        id: { type: string, maxLength: 64, description: Identifiant stable de la section dans la page. }
        type: { $ref: '#/components/schemas/PageSectionType' }
        enabled: { type: boolean, description: Interrupteur de visibilité. }
        adminLabel: { type: [string, 'null'], maxLength: 80, description: Nom affiché dans le back-office (ex. « Comment ça marche »). }
        anchor: { type: [string, 'null'], pattern: '^[a-z0-9-]+$', description: Ancre de navigation (ex. `notre-equipe`). }
        tone: { $ref: '#/components/schemas/SectionTone' }
        eyebrow: { type: [string, 'null'], maxLength: 80 }
        title: { oneOf: [{ $ref: '#/components/schemas/AccentText' }, { type: 'null' }] }
        lead: { type: [string, 'null'], maxLength: 600 }
        titleMobile:
          oneOf: [{ $ref: '#/components/schemas/AccentText' }, { type: 'null' }]
          description: Titre raccourci en mobile (< 768 px) ; null = titre principal.
        leadMobile: { type: [string, 'null'], maxLength: 300, description: "Chapô raccourci en mobile ; null = chapô principal, chaîne vide = chapô masqué en mobile." }

    SectionItem:
      type: object
      description: Élément générique d'une liste de cartes.
      required: [title]
      properties:
        icon: { oneOf: [{ $ref: '#/components/schemas/IconName' }, { type: 'null' }] }
        number: { type: [string, 'null'], maxLength: 4, examples: ['01'] }
        title: { type: string, maxLength: 160 }
        subtitle: { type: [string, 'null'], maxLength: 200, description: Sous-titre mis en avant (ex. métiers concernés d'un type de partenariat). }
        text: { type: [string, 'null'], maxLength: 800 }
        textMobile: { type: [string, 'null'], maxLength: 300, description: Texte raccourci en mobile ; null = texte principal. }
        visual: { oneOf: [{ $ref: '#/components/schemas/Visual' }, { type: 'null' }] }
        tone: { $ref: '#/components/schemas/SectionTone' }
        chips: { type: array, items: { type: string, maxLength: 60 }, maxItems: 8 }
        cta: { oneOf: [{ $ref: '#/components/schemas/Link' }, { type: 'null' }] }

    HeroSection:
      allOf:
        - $ref: '#/components/schemas/SectionBase'
        - type: object
          required: [type, variant]
          properties:
            type: { const: hero }
            variant: { type: string, enum: [home, page, centered, legal], description: Mise en page du héros (maquettes). }
            badge:
              oneOf:
                - type: object
                  required: [text]
                  properties:
                    tag: { type: [string, 'null'], examples: ['France  ·  Cameroun'] }
                    text: { type: string, examples: [Conciergerie de proximité] }
                - type: 'null'
            primaryCta: { oneOf: [{ $ref: '#/components/schemas/Link' }, { type: 'null' }] }
            secondaryCta: { oneOf: [{ $ref: '#/components/schemas/Link' }, { type: 'null' }] }
            showWhatsapp: { type: boolean, default: false }
            visual: { oneOf: [{ $ref: '#/components/schemas/Visual' }, { type: 'null' }] }
            visualSecondary: { oneOf: [{ $ref: '#/components/schemas/Visual' }, { type: 'null' }] }
            socialProof: { type: [string, 'null'], examples: ['4,9/5 · plus de 150 projets accompagnés'] }
            anchors:
              type: array
              description: Puces de navigation interne (scroll-spy).
              items: { $ref: '#/components/schemas/Link' }
            floatingCards:
              type: array
              maxItems: 3
              items:
                type: object
                required: [title]
                properties:
                  icon: { oneOf: [{ $ref: '#/components/schemas/IconName' }, { type: 'null' }] }
                  title: { type: string }
                  text: { type: [string, 'null'] }
                  progress: { type: [number, 'null'], minimum: 0, maximum: 1 }
                  footnote: { type: [string, 'null'] }
            sticker: { type: [string, 'null'], examples: [Pensé pour vous] }
            updatedLabel: { type: [string, 'null'], examples: ['Dernière mise à jour : octobre 2026'] }

    MarqueeSection:
      allOf:
        - $ref: '#/components/schemas/SectionBase'
        - type: object
          required: [type, items]
          properties:
            type: { const: marquee }
            items: { type: array, minItems: 1, maxItems: 30, items: { type: string, maxLength: 60 } }
            itemsMobile:
              type: array
              maxItems: 30
              items: { type: string, maxLength: 60 }
              description: Liste réduite affichée en mobile ; vide = même liste.

    StepsSection:
      allOf:
        - $ref: '#/components/schemas/SectionBase'
        - type: object
          required: [type, layout, items]
          properties:
            type: { const: steps }
            layout: { type: string, enum: [cards, timeline, rail] }
            items: { type: array, minItems: 1, maxItems: 8, items: { $ref: '#/components/schemas/SectionItem' } }
            channelsLabel: { type: [string, 'null'], examples: ['Au choix :'] }
            channels:
              type: array
              items:
                type: object
                required: [label, kind]
                properties:
                  label: { type: string }
                  kind: { type: string, enum: [form, whatsapp, appointment, phone, email] }
            note: { type: [string, 'null'] }

    FeatureListSection:
      allOf:
        - $ref: '#/components/schemas/SectionBase'
        - type: object
          required: [type, items]
          properties:
            type: { const: featureList }
            items: { type: array, maxItems: 8, items: { $ref: '#/components/schemas/SectionItem' } }
            visual: { oneOf: [{ $ref: '#/components/schemas/Visual' }, { type: 'null' }] }
            figures:
              description: Chiffres clés affichés ; vide = chiffres des Paramètres.
              type: array
              items: { $ref: '#/components/schemas/KeyFigure' }

    CardGridSection:
      allOf:
        - $ref: '#/components/schemas/SectionBase'
        - type: object
          required: [type, layout, columns, items]
          properties:
            type: { const: cardGrid }
            layout: { type: string, enum: [cards, numbered, illustrated, horizontal, compact] }
            columns: { type: integer, minimum: 1, maximum: 4 }
            items: { type: array, maxItems: 12, items: { $ref: '#/components/schemas/SectionItem' } }
            cta: { oneOf: [{ $ref: '#/components/schemas/Link' }, { type: 'null' }] }

    TextMediaSection:
      allOf:
        - $ref: '#/components/schemas/SectionBase'
        - type: object
          required: [type, paragraphs]
          properties:
            type: { const: textMedia }
            paragraphs: { type: array, maxItems: 8, items: { type: string, maxLength: 1500 } }
            visual: { oneOf: [{ $ref: '#/components/schemas/Visual' }, { type: 'null' }] }
            reverse: { type: boolean, default: false }
            chips: { type: array, items: { type: string, maxLength: 40 } }
            quote: { type: [string, 'null'], maxLength: 400 }
            signature: { type: [string, 'null'], examples: ['Mireille Bell — Fondatrice et directrice'] }
            cta: { oneOf: [{ $ref: '#/components/schemas/Link' }, { type: 'null' }] }

    QuoteSection:
      allOf:
        - $ref: '#/components/schemas/SectionBase'
        - type: object
          required: [type, text]
          properties:
            type: { const: quote }
            text: { type: string, maxLength: 600 }
            author: { type: [string, 'null'] }
            role: { type: [string, 'null'] }
            visual: { oneOf: [{ $ref: '#/components/schemas/Visual' }, { type: 'null' }] }

    StatsGridSection:
      allOf:
        - $ref: '#/components/schemas/SectionBase'
        - type: object
          required: [type, items]
          properties:
            type: { const: statsGrid }
            items: { type: array, maxItems: 8, items: { $ref: '#/components/schemas/KeyFigure' } }

    TeamSection:
      allOf:
        - $ref: '#/components/schemas/SectionBase'
        - type: object
          required: [type, members]
          properties:
            type: { const: team }
            members:
              type: array
              maxItems: 24
              items:
                type: object
                required: [name, role, visual]
                properties:
                  name: { type: string, maxLength: 80 }
                  role: { type: string, maxLength: 120 }
                  location: { type: [string, 'null'], maxLength: 80, examples: [Douala] }
                  visual: { $ref: '#/components/schemas/Visual' }

    FaqSection:
      allOf:
        - $ref: '#/components/schemas/SectionBase'
        - type: object
          required: [type, items]
          properties:
            type: { const: faq }
            items: { type: array, maxItems: 30, items: { $ref: '#/components/schemas/FaqItem' } }

    RichTextSection:
      allOf:
        - $ref: '#/components/schemas/SectionBase'
        - type: object
          required: [type, articles]
          properties:
            type: { const: richText }
            articles:
              type: array
              description: Sections numérotées d'un texte juridique.
              items:
                type: object
                required: [title, html]
                properties:
                  title: { type: string, maxLength: 160 }
                  html: { $ref: '#/components/schemas/Html' }
            toComplete: { type: boolean, description: Modèle à compléter par la cliente. }

    CtaBandSection:
      allOf:
        - $ref: '#/components/schemas/SectionBase'
        - type: object
          required: [type]
          properties:
            type: { const: ctaBand }
            text: { type: [string, 'null'], maxLength: 300 }
            textMobile: { type: [string, 'null'], maxLength: 200, description: Texte raccourci en mobile ; null = texte principal. }
            primaryCta: { oneOf: [{ $ref: '#/components/schemas/Link' }, { type: 'null' }] }
            secondaryCta:
              oneOf: [{ $ref: '#/components/schemas/Link' }, { type: 'null' }]
              description: Second bouton (vert), à la place du bouton WhatsApp (ex. « Lire en anglais » du Magazine).
            showWhatsapp: { type: boolean, default: true }

    DynamicSection:
      allOf:
        - $ref: '#/components/schemas/SectionBase'
        - type: object
          description: Section alimentée automatiquement (contenu géré dans un autre écran) — seuls l'en-tête et la visibilité sont éditables ici.
          required: [type, source]
          properties:
            type: { const: dynamic }
            source:
              type: string
              enum:
                - categories-bento
                - categories-list
                - reviews-highlight
                - reviews-list
                - partners-strip
                - partners-grid
                - trainings-catalog
                - jobs-list
                - contact-cards
                - appointment-booking
                - agency-map
                - quote-form
                - registration-form
                - partner-form
                - training-form
                - application-form
                - suivi-preview
                - formulas
                - zones-map
            categorySlug:
              oneOf: [{ $ref: '#/components/schemas/Slug' }, { type: 'null' }]
              description: Rubrique dont les services sont affichés (source `formulas`).
            link: { oneOf: [{ $ref: '#/components/schemas/Link' }, { type: 'null' }] }
            limit: { type: [integer, 'null'], minimum: 1, maximum: 50 }
            note: { type: [string, 'null'], maxLength: 400 }
            visual:
              oneOf: [{ $ref: '#/components/schemas/Visual' }, { type: 'null' }]
              description: Visuel à côté d'un formulaire (ex. photo de la demande de formation) ; null = aucun visuel.
            items:
              type: array
              description: Éléments éditables complémentaires (ex. « Et ensuite ? » à côté d'un formulaire).
              items: { $ref: '#/components/schemas/SectionItem' }

    PageSection:
      oneOf:
        - $ref: '#/components/schemas/HeroSection'
        - $ref: '#/components/schemas/MarqueeSection'
        - $ref: '#/components/schemas/StepsSection'
        - $ref: '#/components/schemas/FeatureListSection'
        - $ref: '#/components/schemas/CardGridSection'
        - $ref: '#/components/schemas/TextMediaSection'
        - $ref: '#/components/schemas/QuoteSection'
        - $ref: '#/components/schemas/StatsGridSection'
        - $ref: '#/components/schemas/TeamSection'
        - $ref: '#/components/schemas/FaqSection'
        - $ref: '#/components/schemas/RichTextSection'
        - $ref: '#/components/schemas/CtaBandSection'
        - $ref: '#/components/schemas/DynamicSection'
      discriminator:
        propertyName: type
        mapping:
          hero: '#/components/schemas/HeroSection'
          marquee: '#/components/schemas/MarqueeSection'
          steps: '#/components/schemas/StepsSection'
          featureList: '#/components/schemas/FeatureListSection'
          cardGrid: '#/components/schemas/CardGridSection'
          textMedia: '#/components/schemas/TextMediaSection'
          quote: '#/components/schemas/QuoteSection'
          statsGrid: '#/components/schemas/StatsGridSection'
          team: '#/components/schemas/TeamSection'
          faq: '#/components/schemas/FaqSection'
          richText: '#/components/schemas/RichTextSection'
          ctaBand: '#/components/schemas/CtaBandSection'
          dynamic: '#/components/schemas/DynamicSection'


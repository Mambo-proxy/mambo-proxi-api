          required: [tagline, summary, icon, illustration, cities, audiences, steps, advantages, faq, quoteBullets, relatedServiceIds, featuredReviewIds, galleryImageIds, showWhatsapp, completenessDetail, version]
          properties:
            shortName: { type: [string, 'null'] }
            tagline: { type: string }
            summary: { type: string }
            icon: { $ref: '#/components/schemas/IconName' }
            illustration: { $ref: '#/components/schemas/IllustrationScene' }
            coverImage: { oneOf: [{ $ref: '#/components/schemas/MediaImage' }, { type: 'null' }] }
            galleryImageIds: { type: array, items: { $ref: '#/components/schemas/Id' } }
            cities: { type: array, items: { type: string } }
            audiences: { type: array, items: { type: string } }
            steps: { type: array, items: { $ref: '#/components/schemas/StepItem' } }
            advantages: { type: array, items: { $ref: '#/components/schemas/IconTextItem' } }
            faq: { type: array, items: { $ref: '#/components/schemas/FaqItem' } }
            quoteBullets: { type: array, items: { type: string } }
            offersEyebrow: { type: [string, 'null'] }
            offersTitle: { type: [string, 'null'] }
            offersLead: { type: [string, 'null'] }
            offersLeadMobile: { type: [string, 'null'] }
            offers:
              type: array
              items:
                allOf:
                  - $ref: '#/components/schemas/ServiceOfferInput'

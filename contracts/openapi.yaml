  # ─────────────────────────── Admin — Contacts ───────────────────
  /v1/admin/contacts:
    get:
      tags: [Admin — Contacts]
      operationId: adminListContacts
      x-permissions: [contacts:read]
      summary: Contacts et inscrits
      description: |
        Fiches effacées exclues. `district` et `q` (nom, adresse e-mail, structure) ne tiennent compte ni de la casse
        ni des accents. Tri (`sort`) : `createdAt` (défaut `-createdAt`), `updatedAt`, `fullName`, `lastActivityAt`.
        `requestsCount` ne compte pas les demandes anonymisées. `stats` porte sur tous les contacts (sans les
        filtres) ; `newThisMonth` = créés dans les 30 derniers jours ; `locations.douala` = ville « Douala » ou
        « Quartier, Douala ».
      security: [{ cookieAuth: [] }]
      parameters:
        - name: profile
          in: query
          schema: { $ref: '#/components/schemas/ContactProfile' }
        - name: country
          in: query
          schema: { $ref: '#/components/schemas/CountryCode' }
        - $ref: '#/components/parameters/District'
        - name: interest
          in: query
          description: Rubrique d'intérêt (slug).
          schema: { $ref: '#/components/schemas/Slug' }
        - $ref: '#/components/parameters/Q'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          description: Page de contacts + KPI.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta, stats]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/AdminContactListItem' } }
                  meta: { $ref: '#/components/schemas/PaginationMeta' }
                  stats: { $ref: '#/components/schemas/ContactStats' }
        '400': { $ref: '#/components/responses/InvalidQuery' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /v1/admin/contacts/export.csv:
    get:
      tags: [Admin — Contacts]
      operationId: adminExportContacts
      x-permissions: [contacts:export]
      summary: Export CSV des contacts
      description: |
        Contacts filtrés, du plus récent au plus ancien. Colonnes : Nom ; Structure ; E-mail ; Téléphone ; Profil ;
        Ville ; Pays ; Intérêts ; Demandes ; Newsletter (Abonné, En attente, Désinscrit, Non) ; Créé le (date de
        Douala `AAAA-MM-JJ`). Même format et même protection contre l'injection de formules que l'export des demandes ;
        chaque export est inscrit au journal d'activité.
      security: [{ cookieAuth: [] }]
      parameters:
        - name: profile
          in: query
          schema: { $ref: '#/components/schemas/ContactProfile' }
        - name: country
          in: query
          schema: { $ref: '#/components/schemas/CountryCode' }
        - $ref: '#/components/parameters/District'
        - name: interest
          in: query
          schema: { $ref: '#/components/schemas/Slug' }
      responses:
        '200':
          description: Fichier CSV (UTF-8 avec BOM, séparateur `;`, lignes CRLF), non mis en cache (`no-store`).
          headers:
            Content-Disposition:
              description: '`attachment; filename="contacts-AAAA-MM-JJ.csv"` (date de Douala).'
              schema: { type: string }
          content:
            text/csv:
              schema: { type: string }
        '400': { $ref: '#/components/responses/InvalidQuery' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /v1/admin/contacts/{id}:
    get:
      tags: [Admin — Contacts]
      operationId: adminGetContact
      x-permissions: [contacts:read]
      summary: Fiche contact (demandes, abonnement)
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/IdPath' }]
      responses:
        '200':
          description: Contact.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminContact' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Admin — Contacts]
      operationId: adminEraseContact
      x-permissions: [contacts:write]
      summary: Droit à l'effacement (anonymise le contact et ses demandes)
      description: |
        La fiche est vidée (nom « Contact effacé », adresse factice, coordonnées, structure, centres d'intérêt), ses
        demandes sont anonymisées (comme `DELETE /v1/admin/requests/{id}`), le message et les notes de ses
        rendez-vous effacés, son abonnement anonymisé et désinscrit. La fiche n'apparaît plus (`404` ensuite) ;
        l'effacement est inscrit au journal d'activité, sans donnée personnelle.

              description: '`attachment; filename="donnees-<id>.json"`.'
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                required: [exportedAt, contact, requests]
                additionalProperties: true
                properties:
                  exportedAt: { $ref: '#/components/schemas/DateTime' }
                  contact: { $ref: '#/components/schemas/AdminContact' }
                  requests: { type: array, items: { type: object, additionalProperties: true } }
                  newsletter: { type: [object, 'null'], additionalProperties: true }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }


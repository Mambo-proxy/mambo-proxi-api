          required: [id, title, slug, city, country, contractType, summary, missions, profile, benefits, status, applicationsCount, createdAt]
          properties:
            id: { $ref: '#/components/schemas/Id' }
            applicationsCount: { type: integer }
            newApplicationsCount: { type: integer }
            publishedAt: { oneOf: [{ $ref: '#/components/schemas/DateTime' }, { type: 'null' }] }
            createdAt: { $ref: '#/components/schemas/DateTime' }

    ApplicationStatus:
      type: string
      enum: [NOUVEAU, LU, RETENU, REFUSE]
      description: Libellés — Nouveau, Lu, Retenu, Refusé.

    AdminApplication:
      type: object
      required: [id, requestId, reference, status, contact, cv, createdAt]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        requestId: { $ref: '#/components/schemas/Id' }
        reference: { $ref: '#/components/schemas/Reference' }
        status: { $ref: '#/components/schemas/ApplicationStatus' }
        job:
          oneOf:
            - type: object
              required: [id, title]
              properties:
                id: { $ref: '#/components/schemas/Id' }
                title: { type: string }
            - type: 'null'
        contact: { $ref: '#/components/schemas/ContactSummary' }
        message: { type: [string, 'null'] }
        cv: { $ref: '#/components/schemas/Attachment' }

        - type: object
          required: [titleEn, subtitleEn, coverId, editorial, editorialEn, signature, signatureEn, articles, newsletter]
          properties:
            titleEn: { type: [string, 'null'] }
            subtitleEn: { type: [string, 'null'] }
            coverId: { oneOf: [{ $ref: '#/components/schemas/Id' }, { type: 'null' }] }
            editorial: { type: [string, 'null'] }
            editorialEn: { type: [string, 'null'] }
            signature: { type: [string, 'null'] }
            signatureEn: { type: [string, 'null'] }
            articles:
              type: array

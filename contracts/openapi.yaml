                  required: [fr, en]
                  properties:
                    fr: { type: integer }
                    en: { type: integer }
                scheduledAt: { oneOf: [{ $ref: '#/components/schemas/DateTime' }, { type: 'null' }] }
                sentAt: { oneOf: [{ $ref: '#/components/schemas/DateTime' }, { type: 'null' }] }


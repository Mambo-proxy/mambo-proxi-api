      responses:
        '200':
          description: 30 dernières notifications.
          content:
            application/json:
              schema:
                type: object
                required: [data, unreadCount]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Notification' } }
                  unreadCount: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }


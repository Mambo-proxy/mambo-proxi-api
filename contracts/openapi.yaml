  /v1/admin/campaigns/{id}/schedule:
    post:
      tags: [Admin — Newsletter]
      operationId: adminScheduleCampaign
      summary: Programmer l'envoi
      security: [{ cookieAuth: [], csrfToken: [] }]
      parameters: [{ $ref: '#/components/parameters/IdPath' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scheduledAt]

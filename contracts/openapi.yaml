    ZoneInput:
      allOf:
        - $ref: '#/components/schemas/ZoneFields'
        - type: object
          required: [name, tone]

    ZonePatch:
      allOf:
        - $ref: '#/components/schemas/ZoneFields'
        - type: object
          minProperties: 1

    AdminZone:
      type: object
      required: [id, key, name, nameEn, tone, description, descriptionEn, result, resultEn, delay, fee, active, quarters, requestsCount, sortOrder, updatedAt]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        key: { $ref: '#/components/schemas/Slug' }
        name: { type: string, examples: [Zone 1 — Proximité] }
        nameEn: { type: [string, 'null'] }
        tone: { $ref: '#/components/schemas/ZoneTone' }
        description: { type: string }
        descriptionEn: { type: [string, 'null'] }
        result: { type: string }
        resultEn: { type: [string, 'null'] }
        delay: { type: [string, 'null'] }
        fee: { oneOf: [{ $ref: '#/components/schemas/ZoneFee' }, { type: 'null' }] }
        active: { type: boolean }
        quarters: { type: array, items: { $ref: '#/components/schemas/ZoneQuarter' } }
        area:
          oneOf:
            - $ref: '#/components/schemas/ZoneArea'
            - type: 'null'
        requestsCount: { type: integer, description: 'Demandes des 12 derniers mois dont la ville commence par un quartier de la zone.' }
        sortOrder: { type: integer }
        updatedAt: { $ref: '#/components/schemas/DateTime' }

    AdminZones:
      type: object
      required: [zones, showFees]
      properties:
        zones: { type: array, items: { $ref: '#/components/schemas/AdminZone' } }
        showFees: { type: boolean, description: 'Option « Afficher les tarifs » des paramètres ; désactivée, les tarifs indicatifs restent masqués sur le site.' }


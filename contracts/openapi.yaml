      type: object
      required: [id, number, label, title, subtitle, themes, cover, articlesCount, toTranslate, languages, readers, status, publishAt, updatedAt]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        number: { type: [integer, 'null'] }
        label: { type: string, description: « N° 1 » ou « Hors-série »., examples: [N° 1] }
        title: { type: string }
        subtitle: { type: [string, 'null'] }
        themes: { type: [string, 'null'] }
        cover: { oneOf: [{ $ref: '#/components/schemas/MediaImage' }, { type: 'null' }] }
        articlesCount: { type: integer }
        toTranslate: { type: integer, description: Articles sans version anglaise complète. }
        languages:
          type: array
          description: Langues dans lesquelles l'édition est complète.
          items: { $ref: '#/components/schemas/MagazineLanguage' }
        readers: { type: [integer, 'null'], description: 'Lecteurs uniques (site et e-mail) ; `null` avant la publication.' }
        status: { $ref: '#/components/schemas/MagazineEditionStatus' }
        publishAt: { oneOf: [{ $ref: '#/components/schemas/DateTime' }, { type: 'null' }] }
        updatedAt: { $ref: '#/components/schemas/DateTime' }

    AdminMagazineEdition:
      allOf:

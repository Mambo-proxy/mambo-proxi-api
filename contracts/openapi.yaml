        quoteBullets: { type: array, maxItems: 5, items: { type: string, maxLength: 120 } }
        offersEyebrow: { type: [string, 'null'], maxLength: 40 }
        offersTitle: { type: [string, 'null'], maxLength: 120 }
        offersLead: { type: [string, 'null'], maxLength: 200 }
        offersLeadMobile: { type: [string, 'null'], maxLength: 120 }
        offers: { type: array, maxItems: 12, items: { $ref: '#/components/schemas/ServiceOfferInput' }, description: Vide = pas de carrousel. }
        relatedServiceIds: { type: array, maxItems: 6, items: { $ref: '#/components/schemas/Id' } }
        featuredReviewIds: { type: array, maxItems: 6, items: { $ref: '#/components/schemas/Id' } }
        showInMenu: { type: boolean }
        featuredOnHome: { type: boolean }
        showWhatsapp: { type: boolean }
        reviewsTitle: { type: [string, 'null'], maxLength: 120 }
        relatedTitle: { type: [string, 'null'], maxLength: 120 }
        ctaTitle: { type: [string, 'null'], maxLength: 120 }
        ctaText: { type: [string, 'null'], maxLength: 300 }
        seoTitle: { type: [string, 'null'], maxLength: 60 }
        seoDescription: { type: [string, 'null'], maxLength: 160 }

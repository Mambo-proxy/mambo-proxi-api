        titleEn: { type: [string, 'null'], maxLength: 120 }
        subtitle: { type: [string, 'null'], maxLength: 120, examples: [Édition spéciale] }
        subtitleEn: { type: [string, 'null'], maxLength: 120 }
        themes: { type: [string, 'null'], maxLength: 80, description: Thèmes résumés dans la liste des éditions., examples: [Bien-être global] }
        publishAt: { oneOf: [{ $ref: '#/components/schemas/DateTime' }, { type: 'null' }], description: Date de publication affichée (et date de programmation). }
        coverId: { oneOf: [{ $ref: '#/components/schemas/Id' }, { type: 'null' }] }
        editorial: { type: [string, 'null'], maxLength: 20000, description: 'HTML de l''édito, signé, affiché en ouverture de l''édition.' }
        editorialEn: { type: [string, 'null'], maxLength: 20000 }
        signature: { type: [string, 'null'], maxLength: 120 }
        signatureEn: { type: [string, 'null'], maxLength: 120 }

    MagazineEditionInput:
      allOf:
        - $ref: '#/components/schemas/MagazineEditionFields'

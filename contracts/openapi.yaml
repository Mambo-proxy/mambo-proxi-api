      required: [amount, from]
      properties:
        amount: { type: integer, minimum: 0, examples: [1500] }
        currency: { type: string, enum: [XAF], default: XAF }
        from: { type: boolean, description: '« Dès 3 500 FCFA » : montant minimal.' }

    ZoneFields:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 60 }

      type: string
      enum: [coordonnees, whatsapp, reseaux, emails, seo, analytics, chiffres, rgpd, securite]

    SettingsGroupValue:
      description: Valeur d'un groupe de paramètres (forme selon le groupe).
      oneOf:
        - $ref: '#/components/schemas/SettingsCoordonnees'
        - $ref: '#/components/schemas/SettingsWhatsapp'
        - $ref: '#/components/schemas/SettingsReseaux'
        - $ref: '#/components/schemas/SettingsEmails'
        - $ref: '#/components/schemas/SettingsSeo'
        - $ref: '#/components/schemas/SettingsAnalytics'
        - $ref: '#/components/schemas/SettingsChiffres'
        - $ref: '#/components/schemas/SettingsRgpd'
        - $ref: '#/components/schemas/SettingsSecurite'


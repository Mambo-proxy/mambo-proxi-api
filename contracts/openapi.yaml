                scheduledAt: { $ref: '#/components/schemas/DateTime' }
      responses:
        '200':
          description: Campagne programmée.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Campaign' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /v1/admin/campaigns/{id}/cancel:
    post:
      tags: [Admin — Newsletter]
      operationId: adminCancelCampaign
      summary: Annuler une campagne programmée (repasse en brouillon)
      security: [{ cookieAuth: [], csrfToken: [] }]
      parameters: [{ $ref: '#/components/parameters/IdPath' }]
      responses:
        '200':
          description: Campagne annulée.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Campaign' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }

  /v1/admin/campaigns/{id}/send-now:
    post:
      tags: [Admin — Newsletter]
      operationId: adminSendCampaignNow
      summary: Envoyer maintenant (par lots via la file d'attente)
      security: [{ cookieAuth: [], csrfToken: [] }]
      parameters: [{ $ref: '#/components/parameters/IdPath' }]
      responses:
        '202':
          description: Envoi lancé.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Campaign' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }

  # ─────────────────────────── Admin — Paramètres ─────────────────
  /v1/admin/settings/{group}:
    get:
      tags: [Admin — Paramètres]
      operationId: adminGetSettings
      summary: Groupe de paramètres
      security: [{ cookieAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/SettingsGroupPath'
      responses:
        '200':
          description: Valeurs du groupe.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SettingsGroupValue' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      tags: [Admin — Paramètres]
      operationId: adminSaveSettings
      summary: Enregistrer un groupe de paramètres (mise à jour partout sur le site)
      description: Les groupes `analytics` et `securite` sont réservés aux administrateurs.
      security: [{ cookieAuth: [], csrfToken: [] }]
      parameters:
        - $ref: '#/components/parameters/SettingsGroupPath'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SettingsGroupValue' }
      responses:
        '200':
          description: Groupe enregistré (revalidation `settings`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SettingsGroupValue' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /v1/admin/system-status:
    get:
      tags: [Admin — Paramètres]
      operationId: adminGetSystemStatus
      summary: Sauvegardes, HTTPS, version
      security: [{ cookieAuth: [] }]
      responses:
        '200':
          description: État du système.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemStatus' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /v1/admin/email-templates:
    get:
      tags: [Admin — Paramètres]
      operationId: adminListEmailTemplates
      summary: E-mails automatiques
      security: [{ cookieAuth: [] }]
      responses:
        '200':
          description: Modèles.
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/EmailTemplate' } }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /v1/admin/email-templates/{key}:
    get:
      tags: [Admin — Paramètres]
      operationId: adminGetEmailTemplate
      summary: Modèle d'e-mail
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/EmailTemplateKeyPath' }]
      responses:
        '200':
          description: Modèle.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmailTemplate' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Admin — Paramètres]
      operationId: adminSaveEmailTemplate
      summary: Modifier un modèle (objet, titre, paragraphes, bouton, activation)
      security: [{ cookieAuth: [], csrfToken: [] }]
      parameters: [{ $ref: '#/components/parameters/EmailTemplateKeyPath' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmailTemplateInput' }
      responses:
        '200':
          description: Modèle enregistré.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmailTemplate' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /v1/admin/email-templates/{key}/preview:
    post:
      tags: [Admin — Paramètres]
      operationId: adminPreviewEmailTemplate
      summary: Aperçu avec des données d'exemple (contenu non enregistré possible)
      security: [{ cookieAuth: [], csrfToken: [] }]
      parameters: [{ $ref: '#/components/parameters/EmailTemplateKeyPath' }]
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmailTemplateInput' }
      responses:
        '200':
          description: Rendu.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmailPreview' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /v1/admin/email-templates/{key}/test:
    post:
      tags: [Admin — Paramètres]
      operationId: adminTestEmailTemplate
      summary: Envoi de test
      security: [{ cookieAuth: [], csrfToken: [] }]
      parameters: [{ $ref: '#/components/parameters/EmailTemplateKeyPath' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { $ref: '#/components/schemas/Email' }
      responses:
        '202':
          description: Test envoyé.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ─────────────────────────── Admin — Utilisateurs ───────────────
  /v1/admin/users:
    get:
      tags: [Admin — Utilisateurs]
      operationId: adminListUsers
      summary: Utilisateurs du back-office (ADMIN)
      security: [{ cookieAuth: [] }]
      responses:
        '200':
          description: Utilisateurs.
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/AdminUser' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /v1/admin/users/invite:
    post:
      tags: [Admin — Utilisateurs]
      operationId: adminInviteUser
      summary: Inviter un utilisateur (lien valable 7 jours)
      security: [{ cookieAuth: [], csrfToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, name, role]
              properties:
                email: { $ref: '#/components/schemas/Email' }
                name: { type: string, maxLength: 120 }
                role: { $ref: '#/components/schemas/Role' }
      responses:
        '201':
          description: Invitation envoyée.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminUser' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /v1/admin/users/{id}:
    patch:
      tags: [Admin — Utilisateurs]
      operationId: adminUpdateUser
      summary: Modifier le rôle, désactiver / réactiver
      security: [{ cookieAuth: [], csrfToken: [] }]
      parameters: [{ $ref: '#/components/parameters/IdPath' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                name: { type: string, maxLength: 120 }
                role: { $ref: '#/components/schemas/Role' }
                isActive: { type: boolean }
      responses:
        '200':
          description: Utilisateur enregistré.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminUser' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Impossible de retirer le dernier administrateur actif.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
    delete:
      tags: [Admin — Utilisateurs]
      operationId: adminDeleteUser
      summary: Supprimer un utilisateur
      security: [{ cookieAuth: [], csrfToken: [] }]
      parameters: [{ $ref: '#/components/parameters/IdPath' }]
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /v1/admin/users/{id}/reset-password:
    post:
      tags: [Admin — Utilisateurs]
      operationId: adminResetUserPassword
      summary: Envoyer un lien de réinitialisation et révoquer les sessions
      security: [{ cookieAuth: [], csrfToken: [] }]
      parameters: [{ $ref: '#/components/parameters/IdPath' }]
      responses:
        '202':
          description: Lien envoyé.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ──────────────────────────── Admin — Médias ────────────────────
  /v1/admin/media:
    get:
      tags: [Admin — Médias]
      operationId: adminListMedia
      summary: Médiathèque
      security: [{ cookieAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Q'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Page de médias.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Media' } }
                  meta: { $ref: '#/components/schemas/PaginationMeta' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Admin — Médias]
      operationId: adminUploadMedia
      summary: Envoyer une image (JPG, PNG, WebP, SVG assaini ; 10 Mo max)
      description: Génère les variantes WebP/AVIF 480/960/1600 en tâche de fond.
      security: [{ cookieAuth: [], csrfToken: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, alt]
              properties:
                file: { type: string, contentMediaType: application/octet-stream }
                alt: { type: string, minLength: 1, maxLength: 200, description: Texte alternatif obligatoire. }
      responses:
        '201':
          description: Média créé.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Media' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '413':
          description: Fichier trop volumineux.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '415':
          description: Format non accepté.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /v1/admin/media/{id}:
    patch:
      tags: [Admin — Médias]
      operationId: adminUpdateMedia
      summary: Texte alternatif et point focal
      security: [{ cookieAuth: [], csrfToken: [] }]
      parameters: [{ $ref: '#/components/parameters/IdPath' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                alt: { type: string, minLength: 1, maxLength: 200 }
                focalPoint:
                  type: object
                  required: [x, y]
                  properties:
                    x: { type: number, minimum: 0, maximum: 1 }
                    y: { type: number, minimum: 0, maximum: 1 }
      responses:
        '200':
          description: Média enregistré.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Media' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Admin — Médias]
      operationId: adminDeleteMedia
      summary: Supprimer un média non utilisé
      security: [{ cookieAuth: [], csrfToken: [] }]
      parameters: [{ $ref: '#/components/parameters/IdPath' }]
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Média encore utilisé.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example: { type: https://api.mamboproxi.com/problems/media-in-use, title: Image utilisée, status: 409, detail: 'Cette image est utilisée par : Chef privé (photo principale). Remplacez-la avant de la supprimer.' }

  # ──────────────────────────── Admin — Journal ───────────────────
  /v1/admin/audit-log:
    get:
      tags: [Admin — Journal]
      operationId: adminListAuditLog
      summary: Journal d'activité
      security: [{ cookieAuth: [] }]
      parameters:
        - name: actor
          in: query
          schema: { $ref: '#/components/schemas/Id' }
        - name: entity
          in: query
          schema: { type: string }
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Entrées du journal.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/AuditLogEntry' } }
                  meta: { $ref: '#/components/schemas/PaginationMeta' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: mp_at
      description: Jeton d'accès JWT (15 min) déposé en cookie `httpOnly`, `Secure`, `SameSite=Lax`.
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: Recopie du cookie `mp_csrf` (double-submit). Obligatoire sur toutes les mutations authentifiées.
  parameters:
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: pageSize
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    Sort:
      name: sort
      in: query
      description: Champ de tri, préfixé de `-` pour un tri décroissant.
      schema: { type: string, example: -createdAt }
    Q:
      name: q
      in: query
      description: Recherche plein texte.
      schema: { type: string, maxLength: 120 }
    IdPath:
      name: id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Id' }
    SlugPath:
      name: slug
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Slug' }
    PageKeyPath:
      name: key
      in: path
      required: true
      schema: { $ref: '#/components/schemas/PageKey' }
    Preview:
      name: preview
      in: query
      description: Jeton de prévisualisation délivré par le back-office ; renvoie le brouillon.
      schema: { type: string }
    SettingsGroupPath:
      name: group
      in: path
      required: true
      schema: { $ref: '#/components/schemas/SettingsGroup' }
    EmailTemplateKeyPath:
      name: key
      in: path
      required: true
      schema: { $ref: '#/components/schemas/EmailTemplateKey' }
    From:
      name: from
      in: query
      schema: { type: string, format: date-time }
    To:
      name: to
      in: query
      schema: { type: string, format: date-time }

  headers:
    RateLimitLimit:
      description: Nombre de requêtes autorisées dans la fenêtre.
      schema: { type: integer }
    RateLimitRemaining:
      description: Requêtes restantes dans la fenêtre.
      schema: { type: integer }
    RetryAfter:
      description: Délai en secondes avant de pouvoir réessayer.
      schema: { type: integer }

  responses:
    ValidationError:
      description: Données invalides (un message par champ).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://api.mamboproxi.com/problems/validation-error
            title: Certaines informations sont à corriger
            status: 422
            detail: Vérifiez les champs signalés puis renvoyez le formulaire.
            errors:
              - path: contact.email
                code: invalid_email
                message: Saisissez une adresse e-mail valide.
              - path: consent
                code: required
                message: Merci d'accepter le traitement de vos données pour envoyer votre demande.
    Unauthorized:
      description: Session absente ou expirée.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://api.mamboproxi.com/problems/unauthorized
            title: Session expirée
            status: 401
            detail: Veuillez vous reconnecter.
    Forbidden:
      description: Droits insuffisants ou jeton CSRF invalide.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://api.mamboproxi.com/problems/forbidden
            title: Action non autorisée
            status: 403
            detail: Votre rôle ne permet pas d'effectuer cette action.
    NotFound:
      description: Ressource introuvable.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://api.mamboproxi.com/problems/not-found
            title: Introuvable
            status: 404
            detail: La ressource demandée n'existe pas ou n'est plus disponible.
    Conflict:
      description: Conflit avec l'état actuel (doublon, créneau déjà pris…).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://api.mamboproxi.com/problems/conflict
            title: Conflit
            status: 409
            detail: Cet élément a été modifié entre-temps.
    TooManyRequests:
      description: Trop de requêtes.
      headers:
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
        RateLimit-Limit: { $ref: '#/components/headers/RateLimitLimit' }
        RateLimit-Remaining: { $ref: '#/components/headers/RateLimitRemaining' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://api.mamboproxi.com/problems/rate-limited
            title: Trop de tentatives
            status: 429
            detail: Vous avez effectué trop de demandes. Réessayez dans quelques minutes.
    SpamRejected:
      description: Vérification anti-spam échouée.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://api.mamboproxi.com/problems/spam-check-failed
            title: Vérification de sécurité échouée
            status: 400
            detail: La vérification anti-robot n'a pas abouti. Rechargez la page puis réessayez.
    NoContent:
      description: Opération effectuée.

  schemas:
    Id:
      type: string
      description: Identifiant opaque (cuid).
      minLength: 1
      maxLength: 64
      examples: [clx8m2k4p0001mp9a7v3f2c1d]
    Slug:
      type: string
      pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
      maxLength: 120
      examples: [chef-prive]
    Reference:
      type: string
      pattern: '^MP-\d{4}-\d{4,}$'
      examples: [MP-2026-0142]
    Email:
      type: string
      format: email
      maxLength: 254
      examples: [aminata.diallo@example.com]
    PhoneE164:
      type: string
      description: Numéro au format E.164 (ex. +237 / +33).
      pattern: '^\+[1-9]\d{6,14}$'
      examples: ['+237600000000']
    CountryCode:
      type: string
      description: Code pays ISO 3166-1 alpha-2.
      pattern: '^[A-Z]{2}$'
      examples: [CM]
    IllustrationScene:
      type: string
      description: Scène illustrée provisoire (exportée des maquettes) affichée tant qu'aucune photo n'est fournie.
      enum: [accueil, chef, colis, courses, culture, equipe, evenement, formation, livraison, logement, marche, massage, photo, portrait, voiture]
    IconName:
      type: string
      description: Nom d'icône lucide-react (PascalCase).
      pattern: '^[A-Z][A-Za-z0-9]*$'
      maxLength: 48
      examples: [ChefHat]
    PublishStatus:
      type: string
      enum: [DRAFT, PUBLISHED, ARCHIVED]
    DateTime:
      type: string
      format: date-time
    Html:
      type: string
      description: 'HTML assaini côté serveur (balises autorisées : p, h2, h3, h4, strong, em, a, ul, ol, li, br, blockquote).'
      maxLength: 200000

    Problem:
      type: object
      description: Erreur au format RFC 9457 (Problem Details).
      required: [type, title, status]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer, minimum: 400, maximum: 599 }
        detail: { type: string }
        instance: { type: string }
        errors:
          type: array
          items:
            type: object
            required: [path, message]
            properties:
              path: { type: string, description: Chemin du champ (notation pointée). }
              code: { type: string }
              message: { type: string, description: Message en français prêt à afficher. }

    PaginationMeta:
      type: object
      required: [page, pageSize, total, totalPages]
      properties:
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1 }
        total: { type: integer, minimum: 0 }
        totalPages: { type: integer, minimum: 0 }

    Visual:
      type: object
      description: |
        Visuel d'un emplacement « photo ». Tant qu'aucune image n'est fournie, l'illustration est affichée ;
        lorsqu'une image (média du back-office) est renseignée, elle la remplace sans changer la mise en page.
      required: [illustration]
      properties:
        illustration: { $ref: '#/components/schemas/IllustrationScene' }
        image:
          oneOf:
            - $ref: '#/components/schemas/MediaImage'
            - type: 'null'
        alt: { type: string, maxLength: 200, description: Texte alternatif (vide si décoratif). }

    MediaImage:
      type: object
      description: Image optimisée (variantes AVIF/WebP 480/960/1600).
      required: [id, url, width, height, variants]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        url: { type: string, format: uri }
        width: { type: integer }
        height: { type: integer }
        alt: { type: [string, 'null'] }
        focalPoint:
          type: [object, 'null']
          properties:
            x: { type: number, minimum: 0, maximum: 1 }
            y: { type: number, minimum: 0, maximum: 1 }
        blurDataUrl: { type: [string, 'null'] }
        variants:
          type: array
          items:
            type: object
            required: [url, width, format]
            properties:
              url: { type: string, format: uri }
              width: { type: integer, enum: [480, 960, 1600] }
              format: { type: string, enum: [avif, webp] }

    Link:
      type: object
      description: Lien de bouton ou de menu (destination interne ou externe).
      required: [label, href]
      properties:
        label: { type: string, maxLength: 80 }
        href: { type: string, maxLength: 500, examples: [/devis] }
        external: { type: boolean, default: false }
        labelMobile: { type: [string, 'null'], maxLength: 80, description: Libellé raccourci en mobile ; vide = libellé principal. }

    Seo:
      type: object
      properties:
        title: { type: [string, 'null'], maxLength: 70 }
        description: { type: [string, 'null'], maxLength: 170 }
        ogImageUrl: { type: [string, 'null'], format: uri }
        noindex: { type: boolean, default: false }

    AntiSpam:
      type: object
      description: |
        Protection anti-spam commune à tous les formulaires publics : jeton Cloudflare Turnstile, champ piège
        (doit rester vide) et horodatage d'ouverture du formulaire (délai minimal de remplissage : 3 s).
      required: [turnstileToken, startedAt]
      properties:
        turnstileToken: { type: string, maxLength: 4096 }
        honeypot: { type: string, maxLength: 0, description: Champ piège invisible — doit rester vide. }
        startedAt: { type: string, format: date-time }
      example:
        turnstileToken: XXXX.DUMMY.TOKEN.XXXX
        honeypot: ''
        startedAt: '2026-10-20T09:41:12.000Z'

    Consent:
      type: boolean
      const: true
      description: Consentement au traitement des données (case non cochée par défaut, obligatoire).

    ContactIdentity:
      type: object
      required: [fullName, email, phone]
      properties:
        fullName: { type: string, minLength: 2, maxLength: 120, examples: [Aminata Diallo] }
        email: { $ref: '#/components/schemas/Email' }
        phone: { $ref: '#/components/schemas/PhoneE164' }
        country: { $ref: '#/components/schemas/CountryCode' }
        city: { type: string, maxLength: 80 }

    SubmissionAccepted:
      type: object
      required: [reference, message]
      properties:
        reference: { $ref: '#/components/schemas/Reference' }
        message: { type: string, description: Message de confirmation prêt à afficher. }
      example:
        reference: MP-2026-0142
        message: Merci, votre demande est bien envoyée ! Vous recevrez un e-mail de confirmation dans quelques instants.

    MessageResponse:
      type: object
      required: [message]
      properties:
        message: { type: string }

    # ───────────────────────────── Site ─────────────────────────────
    AccentText:
      type: string
      description: |
        Texte pouvant contenir une partie mise en avant (couleur `text/brand`), balisée `==…==`.
        Exemple : `Mambo, ce n'est pas qu'un service. ==C'est une expérience pensée pour vous.==`
      maxLength: 400

    SocialNetwork:
      type: string
      enum: [instagram, facebook, linkedin, tiktok, youtube, x]

    KeyFigure:
      type: object
      required: [key, value, label]
      properties:
        key: { type: string, examples: [projects] }
        value: { type: number, examples: [150] }
        prefix: { type: string, maxLength: 4, default: '' }
        suffix: { type: string, maxLength: 8, examples: ['+'] }
        decimals: { type: integer, minimum: 0, maximum: 2, default: 0 }
        label: { type: string, maxLength: 80, examples: [projets accompagnés] }
        labelMobile: { type: [string, 'null'], maxLength: 80, description: Libellé raccourci en mobile ; vide = libellé principal. }

    SiteSettings:
      type: object
      required: [siteName, contact, whatsapp, social, agency, keyFigures, turnstileSiteKey, analytics, seo, features]
      properties:
        siteName: { type: string, examples: [MAMBO Proxi] }
        tagline: { type: string, examples: ["Vos services, au plus près de vous"] }
        signature: { type: string, examples: ["Mambo, ce n'est pas qu'un service. C'est une expérience pensée pour vous."] }
        contact:
          type: object
          required: [phoneFrance, phoneCameroon, email, hoursLabel]
          properties:
            phoneFrance: { $ref: '#/components/schemas/PhoneE164' }
            phoneFranceDisplay: { type: string, examples: ['+33 6 00 00 00 00'] }
            phoneCameroon: { $ref: '#/components/schemas/PhoneE164' }
            phoneCameroonDisplay: { type: string, examples: ['+237 6 00 00 00 00'] }
            email: { $ref: '#/components/schemas/Email' }
            hoursLabel: { type: string, description: Horaires résumés (barre supérieure). }
        whatsapp:
          type: object
          required: [enabled, number, message]
          properties:
            enabled: { type: boolean }
            number: { $ref: '#/components/schemas/PhoneE164' }
            message: { type: string, maxLength: 500, description: Message pré-rempli (le nom du service ou la référence y est ajouté selon le contexte). }
        social:
          type: array
          items:
            type: object
            required: [network, url]
            properties:
              network: { $ref: '#/components/schemas/SocialNetwork' }
              url: { type: string, format: uri }
        agency:
          type: object
          required: [name, addressLines, city, country, openingHours]
          properties:
            name: { type: string }
            addressLines: { type: array, items: { type: string } }
            city: { type: string }
            country: { $ref: '#/components/schemas/CountryCode' }
            latitude: { type: [number, 'null'] }
            longitude: { type: [number, 'null'] }
            mapsUrl: { type: [string, 'null'], format: uri }
            openingHours:
              type: array
              items:
                type: object
                required: [label, hours]
                properties:
                  label: { type: string, examples: [Lundi – vendredi] }
                  hours: { type: string, examples: ['8 h 30 – 18 h'] }
            parcelReceptionNote: { type: [string, 'null'] }
        keyFigures:
          type: array
          items: { $ref: '#/components/schemas/KeyFigure' }
        turnstileSiteKey: { type: string }
        analytics:
          type: object
          properties:
            ga4MeasurementId: { type: [string, 'null'], pattern: '^G-[A-Z0-9]+$' }
            searchConsoleVerification: { type: [string, 'null'] }
        seo:
          type: object
          properties:
            defaultTitle: { type: string }
            defaultDescription: { type: string }
            ogImageUrl: { type: [string, 'null'], format: uri }
        features:
          type: object
          required: [maintenanceMode]
          properties:
            maintenanceMode: { type: boolean }
            newsletterTracking: { type: boolean, description: Mesure d'ouverture/clic des campagnes activée (mentionnée dans la politique de confidentialité). }
        updatedAt: { $ref: '#/components/schemas/DateTime' }

    NavLink:
      type: object
      required: [label, href]
      properties:
        label: { type: string }
        href: { type: string }
        description: { type: [string, 'null'] }
        icon: { oneOf: [{ $ref: '#/components/schemas/IconName' }, { type: 'null' }] }

    NavItem:
      type: object
      required: [key, label, href, kind]
      properties:
        key: { type: string, examples: [services] }
        label: { type: string, examples: [Nos services] }
        href: { type: string, examples: [/services] }
        kind:
          type: string
          enum: [link, mega, dropdown]
        children:
          type: array
          items: { $ref: '#/components/schemas/NavLink' }

    MegaMenuCategory:
      type: object
      required: [slug, name, tagline, icon, href, services]
      properties:
        slug: { $ref: '#/components/schemas/Slug' }
        name: { type: string }
        tagline: { type: string }
        icon: { $ref: '#/components/schemas/IconName' }
        tint: { $ref: '#/components/schemas/CategoryTint' }
        href: { type: string }
        services:
          type: array
          items:
            type: object
            required: [slug, name, href]
            properties:
              slug: { $ref: '#/components/schemas/Slug' }
              name: { type: string }
              href: { type: string }

    Navigation:
      type: object
      required: [main, megaMenu, signUp, footer, legal]
      properties:
        main:
          type: array
          items: { $ref: '#/components/schemas/NavItem' }
        megaMenu:
          type: object
          required: [categories, promo]
          properties:
            categories:
              type: array
              items: { $ref: '#/components/schemas/MegaMenuCategory' }
            promo:
              type: object
              required: [title, text, cta, illustration]
              properties:
                title: { type: string }
                text: { type: string }
                cta: { $ref: '#/components/schemas/Link' }
                illustration: { $ref: '#/components/schemas/IllustrationScene' }
        signUp:
          type: array
          items: { $ref: '#/components/schemas/NavLink' }
        footer:
          type: object
          required: [about, columns, copyright, newsletter]
          properties:
            about: { type: string }
            copyright: { type: string, examples: ['© 2026 Mambo Proxi · France — Cameroun'] }
            newsletter:
              type: object
              required: [eyebrow, title, text]
              properties:
                eyebrow: { type: string, examples: [La lettre Mambo] }
                title: { type: string, examples: [Restez au plus près de nos nouveautés] }
                text: { type: string }
            columns:
              type: array
              items:
                type: object
                required: [title, links]
                properties:
                  title: { type: string }
                  links:
                    type: array
                    items: { $ref: '#/components/schemas/NavLink' }
        legal:
          type: array
          items: { $ref: '#/components/schemas/NavLink' }

    PageKey:
      type: string
      enum: [accueil, services, qui-sommes-nous, mission, partenaires, formation, recrutement, avis-clients, contact, devis, devis-confirmation, inscription, suivi-mambo, questionnaire, mentions-legales, confidentialite, cookies, cgu, '404', erreur, maintenance, newsletter-confirmation, newsletter-desinscription]

    Page:
      type: object
      required: [key, title, sections, seo, updatedAt]
      properties:
        key: { $ref: '#/components/schemas/PageKey' }
        title: { type: string }
        sections:
          type: array
          description: Sections publiées et visibles, dans l'ordre d'affichage.
          items: { $ref: '#/components/schemas/PageSection' }
        seo: { $ref: '#/components/schemas/Seo' }
        isPreview: { type: boolean, default: false }
        updatedAt: { $ref: '#/components/schemas/DateTime' }

    SitemapEntry:
      type: object
      required: [path, lastModified]
      properties:
        path: { type: string, examples: [/services/experience/chef-prive] }
        lastModified: { $ref: '#/components/schemas/DateTime' }
        changeFrequency: { type: string, enum: [daily, weekly, monthly, yearly] }
        priority: { type: number, minimum: 0, maximum: 1 }

    Redirect:
      type: object
      required: [from, to, permanent]
      properties:
        from: { type: string }
        to: { type: string }
        permanent: { type: boolean }

    Health:
      type: object
      required: [status, checks]
      properties:
        status: { type: string, enum: [ok, degraded, down] }
        version: { type: string }
        checks:
          type: object
          properties:
            database: { type: string, enum: [up, down] }
            redis: { type: string, enum: [up, down] }
            storage: { type: string, enum: [up, down] }

    # ─────────────────────────── Catalogue ──────────────────────────
    CategoryTint:
      type: string
      description: Teinte de la carte de rubrique (token de couleur).
      enum: [orange-50, neutral-100, vert-50, neutral-900]

    IconTextItem:
      type: object
      required: [title, text]
      properties:
        icon: { oneOf: [{ $ref: '#/components/schemas/IconName' }, { type: 'null' }] }
        title: { type: string, maxLength: 120 }
        text: { type: string, maxLength: 600 }

    StepItem:
      type: object
      required: [title, text]
      properties:
        title: { type: string, maxLength: 120 }
        text: { type: string, maxLength: 600 }

    FaqItem:
      type: object
      required: [question, answer]
      properties:
        question: { type: string, maxLength: 200 }
        answer: { type: string, maxLength: 2000 }

    QuoteField:
      type: object
      description: Champ dynamique de l'étape « Votre besoin » du devis (défini par rubrique dans le back-office).
      required: [name, label, type, required]
      properties:
        name: { type: string, pattern: '^[a-z][a-zA-Z0-9]*$', examples: [eventDate] }
        label: { type: string, examples: [Date souhaitée] }
        type: { type: string, enum: [text, textarea, date, number, select, chips, city] }
        required: { type: boolean }
        placeholder: { type: [string, 'null'] }
        helpText: { type: [string, 'null'] }
        options: { type: array, items: { type: string } }
        min: { type: [number, 'null'] }
        max: { type: [number, 'null'] }
        width: { type: string, enum: [full, half], default: half }

    CategoryRef:
      type: object
      required: [slug, name]
      properties:
        slug: { $ref: '#/components/schemas/Slug' }
        name: { type: string }

    CategorySummary:
      type: object
      required: [id, slug, name, tagline, description, icon, tint, visual, sortOrder, serviceCount, href]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        slug: { $ref: '#/components/schemas/Slug' }
        name: { type: string, examples: [Expérience] }
        tagline: { type: string, examples: [Des moments sur mesure] }
        description: { type: string }
        icon: { $ref: '#/components/schemas/IconName' }
        tint: { $ref: '#/components/schemas/CategoryTint' }
        iconColor: { type: string, description: Token de couleur de l'icône, examples: [orange-700] }
        visual: { $ref: '#/components/schemas/Visual' }
        sortOrder: { type: integer }
        serviceCount: { type: integer }
        href: { type: string, examples: [/services/experience] }
        number: { type: string, examples: ['01'], description: Numéro affiché (ordre). }
        homeCard:
          type: object
          description: Carte « Nos univers » de l'accueil (textes courts propres à la carte).
          properties:
            title: { type: string, examples: [Des moments sur mesure] }
            text: { type: string }
            textMobile: { type: [string, 'null'], description: Texte raccourci en mobile ; null = texte principal. }
            chips: { type: array, items: { type: string } }
        services:
          type: array
          description: Présent avec `include=services`.
          items: { $ref: '#/components/schemas/ServiceSummary' }

    CategoryHighlight:
      type: object
      description: Bloc spécifique à une rubrique (réception de colis, agenda culturel).
      required: [kind, title]
      properties:
        kind: { type: string, enum: [PARCEL_RECEPTION, AGENDA] }
        eyebrow: { type: [string, 'null'] }
        title: { $ref: '#/components/schemas/AccentText' }
        text: { type: [string, 'null'] }
        steps: { type: array, items: { $ref: '#/components/schemas/StepItem' } }
        note: { type: [string, 'null'] }

    CategoryDetail:
      allOf:
        - $ref: '#/components/schemas/CategorySummary'
        - type: object
          required: [heroTitle, heroLead, audiences, processSteps, services, groups, quoteFields, otherCategories, cta, seo]
          properties:
            eyebrow: { type: [string, 'null'] }
            heroTitle: { $ref: '#/components/schemas/AccentText' }
            heroLead: { type: string }
            heroVisual: { $ref: '#/components/schemas/Visual' }
            audiencesTitle: { type: [string, 'null'] }
            audiences: { type: array, items: { $ref: '#/components/schemas/IconTextItem' } }
            servicesTitle: { type: [string, 'null'] }
            servicesLead: { type: [string, 'null'], examples: [Zones desservies communiquées lors du devis.] }
            groups:
              type: array
              description: Groupes titrés de services (ex. Immobilier). Vide = liste simple.
              items:
                type: object
                required: [title, serviceSlugs]
                properties:
                  title: { type: string }
                  serviceSlugs: { type: array, items: { $ref: '#/components/schemas/Slug' } }
            highlight:
              oneOf:
                - $ref: '#/components/schemas/CategoryHighlight'
                - type: 'null'
            processTitle: { type: [string, 'null'] }
            processSteps: { type: array, items: { $ref: '#/components/schemas/StepItem' } }
            testimonial:
              oneOf:
                - $ref: '#/components/schemas/Review'
                - type: 'null'
            testimonialVisual: { $ref: '#/components/schemas/Visual' }
            quoteFields: { type: array, items: { $ref: '#/components/schemas/QuoteField' } }
            otherCategories: { type: array, items: { $ref: '#/components/schemas/CategorySummary' } }
            cta:
              type: object
              required: [title, text]
              properties:
                title: { $ref: '#/components/schemas/AccentText' }
                text: { type: string }
            seo: { $ref: '#/components/schemas/Seo' }

    ServiceSummary:
      type: object
      required: [id, slug, name, summary, icon, visual, category, href]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        slug: { $ref: '#/components/schemas/Slug' }
        name: { type: string, examples: [Chef privé] }
        shortName: { type: [string, 'null'] }
        summary: { type: string, examples: [Un chef à domicile pour vos dîners, réceptions et grandes occasions.] }
        icon: { $ref: '#/components/schemas/IconName' }
        visual: { $ref: '#/components/schemas/Visual' }
        category: { $ref: '#/components/schemas/CategoryRef' }
        href: { type: string, examples: [/services/experience/chef-prive] }
        featuredOnHome: { type: boolean }

    ServiceDetail:
      allOf:
        - $ref: '#/components/schemas/ServiceSummary'
        - type: object
          required: [tagline, cities, audiences, steps, advantages, faq, quoteBullets, gallery, showWhatsapp, related, reviews, seo, toComplete, updatedAt]
          properties:
            tagline: { type: string }
            cities: { type: array, items: { type: string } }
            audiences: { type: array, items: { type: string } }
            steps: { type: array, items: { $ref: '#/components/schemas/StepItem' } }
            advantages: { type: array, items: { $ref: '#/components/schemas/IconTextItem' } }
            faq: { type: array, items: { $ref: '#/components/schemas/FaqItem' } }
            quoteBullets: { type: array, items: { type: string } }
            gallery:
              type: array
              maxItems: 3
              items: { $ref: '#/components/schemas/Visual' }
            showWhatsapp: { type: boolean }
            related: { type: array, items: { $ref: '#/components/schemas/ServiceSummary' } }
            reviews: { type: array, items: { $ref: '#/components/schemas/Review' } }
            reviewsTitle: { type: [string, 'null'], examples: [Ils ont reçu un chef à domicile] }
            relatedTitle: { type: [string, 'null'], examples: [Pour compléter votre événement] }
            cta:
              type: object
              required: [title, text]
              properties:
                title: { $ref: '#/components/schemas/AccentText' }
                text: { type: string }
            reviewSummary:
              oneOf:
                - $ref: '#/components/schemas/ReviewSummary'
                - type: 'null'
            seo: { $ref: '#/components/schemas/Seo' }
            toComplete: { type: boolean, description: Contenu provisoire à compléter par la cliente. }
            updatedAt: { $ref: '#/components/schemas/DateTime' }

    # ──────────────────────────── Avis ──────────────────────────────
    Review:
      type: object
      required: [id, authorName, initials, rating, text, verified, date]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        authorName: { type: string, description: Nom affiché « Prénom N. », examples: [Aminata D.] }
        initials: { type: string, maxLength: 3, examples: [AD] }
        city: { type: [string, 'null'], examples: [Douala] }
        rating: { type: integer, minimum: 1, maximum: 5 }
        text: { type: string, maxLength: 2000 }
        service:
          oneOf:
            - type: object
              required: [slug, name, categorySlug]
              properties:
                slug: { $ref: '#/components/schemas/Slug' }
                name: { type: string }
                categorySlug: { $ref: '#/components/schemas/Slug' }
                categoryName: { type: string }
            - type: 'null'
        verified: { type: boolean, description: Avis issu du questionnaire après prestation. }
        featured: { type: boolean }
        date: { $ref: '#/components/schemas/DateTime' }
        reply: { type: [string, 'null'] }

    ReviewSummary:
      type: object
      required: [average, total, verifiedCount, distribution]
      properties:
        average: { type: number, minimum: 0, maximum: 5, examples: [4.9] }
        total: { type: integer, examples: [120] }
        verifiedCount: { type: integer }
        distribution:
          type: object
          required: ['1', '2', '3', '4', '5']
          properties:
            '1': { type: integer }
            '2': { type: integer }
            '3': { type: integer }
            '4': { type: integer }
            '5': { type: integer }

    # ─────────────────────────── Contenus ───────────────────────────
    PartnerCategory:
      type: string
      enum: [EXPERIENCE, IMMOBILIER, ENTREPRISES]
      description: Prestataires Expérience · Immobilier · Entreprises & prestataires.

    Partner:
      type: object
      required: [id, name, category, categoryLabel]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        name: { type: string }
        category: { $ref: '#/components/schemas/PartnerCategory' }
        categoryLabel: { type: string, examples: [Prestataires Expérience] }
        logo:
          oneOf:
            - $ref: '#/components/schemas/MediaImage'
            - type: 'null'
        url: { type: [string, 'null'], format: uri }

    TrainingCategory:
      type: string
      enum: [PROFESSIONNELS, ATELIERS, SENSIBILISATION]

    Training:
      type: object
      required: [id, slug, title, category, categoryLabel, audienceLabel, icon, duration, format]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        slug: { $ref: '#/components/schemas/Slug' }
        title: { type: string }
        category: { $ref: '#/components/schemas/TrainingCategory' }
        categoryLabel: { type: string }
        audienceLabel: { type: string }
        icon: { $ref: '#/components/schemas/IconName' }
        duration: { type: string }
        format: { type: string }
        location: { type: [string, 'null'] }
        description: { type: [string, 'null'] }

    JobOfferSummary:
      type: object
      required: [id, slug, title, city, country, contractType, summary, publishedAt, isNew]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        slug: { $ref: '#/components/schemas/Slug' }
        title: { type: string }
        city: { type: string }
        country: { $ref: '#/components/schemas/CountryCode' }
        contractType: { type: string, examples: [CDI] }
        summary: { type: string }
        publishedAt: { $ref: '#/components/schemas/DateTime' }
        isNew: { type: boolean, description: Publiée il y a moins de 7 jours. }

    JobOfferDetail:
      allOf:
        - $ref: '#/components/schemas/JobOfferSummary'
        - type: object
          required: [missions, profile, benefits]
          properties:
            startDate: { type: [string, 'null'], examples: ['janvier 2027'] }
            workingTime: { type: [string, 'null'], examples: [temps plein] }
            locationLabel: { type: [string, 'null'], examples: ['Douala, Cameroun'] }
            description: { type: [string, 'null'] }
            missions: { type: array, items: { type: string } }
            profile: { type: array, items: { type: string } }
            benefits: { type: array, items: { type: string } }
            expiresAt: { oneOf: [{ $ref: '#/components/schemas/DateTime' }, { type: 'null' }] }

    Event:
      type: object
      required: [id, slug, title, startsAt, city, tag, visual, limited]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        slug: { $ref: '#/components/schemas/Slug' }
        title: { type: string }
        startsAt: { $ref: '#/components/schemas/DateTime' }
        endsAt: { oneOf: [{ $ref: '#/components/schemas/DateTime' }, { type: 'null' }] }
        city: { type: string }
        place: { type: [string, 'null'] }
        tag: { type: string, examples: [Concert] }
        visual: { $ref: '#/components/schemas/Visual' }
        description: { type: [string, 'null'] }
        capacity: { type: [integer, 'null'] }
        remainingPlaces: { type: [integer, 'null'] }
        limited: { type: boolean, description: Afficher la mention « Places limitées ». }

    # ─────────────────────────── Rendez-vous ────────────────────────
    AppointmentFormat:
      type: string
      enum: [AGENCE, TELEPHONE, VISIO]

    AppointmentReason:
      type: string
      enum: [DEVIS, IMMOBILIER, PARTENARIAT, RECRUTEMENT, AUTRE]

    AvailabilitySlot:
      type: object
      required: [startsAt, endsAt, formats]
      properties:
        startsAt: { $ref: '#/components/schemas/DateTime' }
        endsAt: { $ref: '#/components/schemas/DateTime' }
        formats: { type: array, items: { $ref: '#/components/schemas/AppointmentFormat' } }

    Availability:
      type: object
      required: [timezone, days]
      properties:
        timezone: { type: string, const: Africa/Douala }
        timezoneLabel: { type: string, examples: ['Heure de Douala (UTC+1)'] }
        days:
          type: array
          items:
            type: object
            required: [date, available, slots]
            properties:
              date: { type: string, format: date }
              available: { type: boolean }
              closedReason: { type: [string, 'null'] }
              slots: { type: array, items: { $ref: '#/components/schemas/AvailabilitySlot' } }

    # ────────────────────────── Questionnaire ───────────────────────
    SurveyQuestionKind:
      type: string
      enum: [STARS, CHOICE, NPS, TEXT]

    SurveyQuestion:
      type: object
      required: [id, order, kind, label, options, required]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        order: { type: integer }
        kind: { $ref: '#/components/schemas/SurveyQuestionKind' }
        label: { type: string }
        helpText: { type: [string, 'null'] }
        options: { type: array, items: { type: string }, description: 'Choix proposés (CHOICE), libellés des notes 1→5 (STARS) ou bornes de l''échelle 0–10 (NPS : [gauche, droite]).' }
        required: { type: boolean }

    PublicSurvey:
      type: object
      required: [reference, service, questions, expiresAt]
      properties:
        reference: { $ref: '#/components/schemas/Reference' }
        firstName: { type: [string, 'null'] }
        service:
          type: object
          required: [name, categoryName, visual]
          properties:
            name: { type: string }
            categoryName: { type: string }
            visual: { $ref: '#/components/schemas/Visual' }
        serviceDate: { oneOf: [{ $ref: '#/components/schemas/DateTime' }, { type: 'null' }] }
        questions: { type: array, items: { $ref: '#/components/schemas/SurveyQuestion' } }
        expiresAt: { $ref: '#/components/schemas/DateTime' }

    SurveyAnswer:
      type: object
      required: [questionId]
      properties:
        questionId: { $ref: '#/components/schemas/Id' }
        value:
          description: Note (STARS 1–5, NPS 0–10), choix (CHOICE) ou texte (TEXT).
          oneOf:
            - type: integer
            - type: string
              maxLength: 2000
            - type: 'null'

    # ──────────────────────── Formulaires publics ───────────────────
    ContactPreference:
      type: string
      enum: [WHATSAPP, TELEPHONE, EMAIL]

    QuoteRequestInput:
      type: object
      required: [categorySlug, needs, description, contact, contactPreference, consent, antiSpam]
      properties:
        categorySlug: { $ref: '#/components/schemas/Slug' }
        serviceSlug: { oneOf: [{ $ref: '#/components/schemas/Slug' }, { type: 'null' }] }
        needs:
          type: object
          description: Valeurs des champs dynamiques (`quoteFields` de la rubrique), indexées par `name`.
          additionalProperties:
            oneOf:
              - type: string
                maxLength: 500
              - type: number
              - type: array
                items: { type: string, maxLength: 120 }
                maxItems: 20
              - type: 'null'
        description: { type: string, minLength: 20, maxLength: 3000 }
        contact:
          allOf:
            - $ref: '#/components/schemas/ContactIdentity'
            - type: object
              required: [country]
        contactPreference: { $ref: '#/components/schemas/ContactPreference' }
        consent: { $ref: '#/components/schemas/Consent' }
        antiSpam: { $ref: '#/components/schemas/AntiSpam' }

    ContactMessageInput:
      type: object
      required: [type, contact, message, consent, antiSpam]
      properties:
        type: { type: string, enum: [CONTACT, INFORMATION] }
        contact:
          type: object
          description: Téléphone, pays et sujet facultatifs (maquette Contact).
          required: [fullName, email]
          properties:
            fullName: { type: string, minLength: 2, maxLength: 120 }
            email: { $ref: '#/components/schemas/Email' }
            phone: { oneOf: [{ $ref: '#/components/schemas/PhoneE164' }, { type: 'null' }] }
            country: { oneOf: [{ $ref: '#/components/schemas/CountryCode' }, { type: 'null' }] }
            city: { type: [string, 'null'], maxLength: 80 }
        subject: { type: [string, 'null'], maxLength: 120 }
        serviceSlug:
          description: Service concerné (demande d'information uniquement).
          oneOf: [{ $ref: '#/components/schemas/Slug' }, { type: 'null' }]
        message: { type: string, minLength: 10, maxLength: 3000 }
        consent: { $ref: '#/components/schemas/Consent' }
        antiSpam: { $ref: '#/components/schemas/AntiSpam' }

    AppointmentInput:
      type: object
      required: [reason, format, startsAt, contact, consent, antiSpam]
      properties:
        reason: { $ref: '#/components/schemas/AppointmentReason' }
        format: { $ref: '#/components/schemas/AppointmentFormat' }
        startsAt: { $ref: '#/components/schemas/DateTime' }
        contact: { $ref: '#/components/schemas/ContactIdentity' }
        message: { type: [string, 'null'], maxLength: 1000 }
        consent: { $ref: '#/components/schemas/Consent' }
        antiSpam: { $ref: '#/components/schemas/AntiSpam' }

    RegistrationInput:
      type: object
      required: [profile, firstName, lastName, email, phone, country, consent, antiSpam]
      properties:
        profile: { type: string, enum: [PARTICULIER, PROFESSIONNEL] }
        firstName: { type: string, minLength: 1, maxLength: 60 }
        lastName: { type: string, minLength: 1, maxLength: 60 }
        email: { $ref: '#/components/schemas/Email' }
        phone: { $ref: '#/components/schemas/PhoneE164' }
        country: { $ref: '#/components/schemas/CountryCode' }
        city: { type: [string, 'null'], maxLength: 80 }
        interests:
          type: array
          description: Slugs des rubriques qui intéressent le contact (particulier) ou rubriques d'intervention (professionnel).
          items: { $ref: '#/components/schemas/Slug' }
          maxItems: 10
        organization: { type: [string, 'null'], maxLength: 120, description: 'Nom de la structure (professionnel, obligatoire).' }
        activity: { type: [string, 'null'], maxLength: 120, description: 'Activité principale (professionnel, obligatoire).' }
        newsletter: { type: boolean, default: false, description: Case non cochée par défaut (consentement explicite). }
        consent: { $ref: '#/components/schemas/Consent' }
        antiSpam: { $ref: '#/components/schemas/AntiSpam' }

    TrainingRequestInput:
      type: object
      required: [trainingSlug, contact, participants, consent, antiSpam]
      properties:
        trainingSlug:
          description: Formation choisie dans le catalogue ou `autre`.
          type: string
          maxLength: 120
        otherTraining: { type: [string, 'null'], maxLength: 200 }
        organization: { type: [string, 'null'], maxLength: 120 }
        participants: { type: integer, minimum: 1, maximum: 500 }
        period: { type: [string, 'null'], maxLength: 120, description: Période souhaitée. }
        contact: { $ref: '#/components/schemas/ContactIdentity' }
        message: { type: [string, 'null'], maxLength: 3000 }
        consent: { $ref: '#/components/schemas/Consent' }
        antiSpam: { $ref: '#/components/schemas/AntiSpam' }

    PartnershipType:
      type: string
      enum: [PRESTATAIRE_EXPERIENCE, IMMOBILIER, ENTREPRISE_PRESTATAIRE, AUTRE]

    PartnerRequestInput:
      type: object
      required: [partnershipType, organization, activity, contact, consent, antiSpam]
      properties:
        partnershipType: { $ref: '#/components/schemas/PartnershipType' }
        organization: { type: string, maxLength: 120 }
        activity: { type: string, maxLength: 120 }
        contact:
          allOf:
            - $ref: '#/components/schemas/ContactIdentity'
            - type: object
              required: [country, city]
        presentation: { type: [string, 'null'], maxLength: 3000, description: 'Présentation de l''activité (expérience, zones d''intervention, disponibilités).' }
        consent: { $ref: '#/components/schemas/Consent' }
        antiSpam: { $ref: '#/components/schemas/AntiSpam' }

    EventRegistrationInput:
      type: object
      required: [eventSlug, contact, seats, consent, antiSpam]
      properties:
        eventSlug: { $ref: '#/components/schemas/Slug' }
        seats: { type: integer, minimum: 1, maximum: 10 }
        contact: { $ref: '#/components/schemas/ContactIdentity' }
        consent: { $ref: '#/components/schemas/Consent' }
        antiSpam: { $ref: '#/components/schemas/AntiSpam' }

    JobApplicationInput:
      type: object
      description: Corps `multipart/form-data`. Les objets sont envoyés sous forme de champs à plat.
      required: [fullName, email, phone, city, cv, consent, turnstileToken, startedAt]
      properties:
        jobSlug: { type: string, description: 'Slug de l''offre, vide pour une candidature spontanée.' }
        fullName: { type: string, minLength: 2, maxLength: 120 }
        email: { $ref: '#/components/schemas/Email' }
        phone: { $ref: '#/components/schemas/PhoneE164' }
        city: { type: string, maxLength: 80 }
        message: { type: string, maxLength: 3000 }
        cv: { type: string, contentMediaType: application/octet-stream, description: 'CV : PDF, DOC ou DOCX, 5 Mo maximum.' }
        consent: { type: string, const: 'true' }
        turnstileToken: { type: string }
        honeypot: { type: string, maxLength: 0 }
        startedAt: { type: string, format: date-time }

    NewsletterSubscriptionInput:
      type: object
      required: [email, consent, antiSpam]
      properties:
        name: { type: [string, 'null'], maxLength: 120 }
        email: { $ref: '#/components/schemas/Email' }
        phone: { oneOf: [{ $ref: '#/components/schemas/PhoneE164' }, { type: 'null' }] }
        source: { type: string, enum: [footer, suivi-mambo, inscription, autre], default: footer }
        tags: { type: array, items: { type: string, maxLength: 40 }, maxItems: 5 }
        consent: { $ref: '#/components/schemas/Consent' }
        antiSpam: { $ref: '#/components/schemas/AntiSpam' }

    # ─────────────────────────── Authentification ───────────────────
    Role:
      type: string
      enum: [ADMIN, EDITOR]

    CurrentUser:
      type: object
      required: [id, email, name, role]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        email: { $ref: '#/components/schemas/Email' }
        name: { type: string, examples: [Mireille Bell] }
        firstName: { type: string, examples: [Mireille] }
        initials: { type: string, examples: [MB] }
        role: { $ref: '#/components/schemas/Role' }
        lastLoginAt: { oneOf: [{ $ref: '#/components/schemas/DateTime' }, { type: 'null' }] }

    LoginInput:
      type: object
      required: [email, password]
      properties:
        email: { $ref: '#/components/schemas/Email' }
        password: { type: string, minLength: 1, maxLength: 256 }
        rememberMe: { type: boolean, default: false }

    LoginResult:
      oneOf:
        - type: object
          title: Connecté
          required: [status, user]
          properties:
            status: { type: string, const: AUTHENTICATED }
            user: { $ref: '#/components/schemas/CurrentUser' }
        - type: object
          title: Code requis
          required: [status, challengeId, emailHint, resendAvailableAt]
          properties:
            status: { type: string, const: OTP_REQUIRED }
            challengeId: { $ref: '#/components/schemas/Id' }
            emailHint: { type: string, examples: ['m•••••@mamboproxi.com'] }
            resendAvailableAt: { $ref: '#/components/schemas/DateTime' }

    # ─────────────────────────── Admin — commun ─────────────────────
    SetPasswordInput:
      type: object
      required: [token, password]
      properties:
        token: { type: string, maxLength: 512 }
        password:
          type: string
          minLength: 12
          maxLength: 256
          description: 12 caractères minimum ; refusé s'il figure dans une liste de mots de passe compromis.

    ReorderInput:
      type: object
      required: [ids]
      properties:
        scope: { type: [string, 'null'], description: Rubrique concernée (services) ou catégorie (partenaires). }
        ids:
          type: array
          minItems: 1
          maxItems: 500
          items: { $ref: '#/components/schemas/Id' }

    PreviewToken:
      type: object
      required: [token, url, expiresAt]
      properties:
        token: { type: string }
        url: { type: string, format: uri, examples: ['https://mamboproxi.com/services/experience/visites-guidees-douala?preview=eyJhbGciOi'] }
        expiresAt: { $ref: '#/components/schemas/DateTime' }

    SignedUrl:
      type: object
      required: [url, expiresAt, fileName]
      properties:
        url: { type: string, format: uri }
        fileName: { type: string }
        expiresAt: { $ref: '#/components/schemas/DateTime' }

    UserRef:
      type: object
      required: [id, name, initials]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        name: { type: string }
        initials: { type: string }

    Notification:
      type: object
      required: [id, kind, title, createdAt]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        kind: { type: string, enum: [REQUEST, APPOINTMENT, REVIEW, APPLICATION, PARTNERSHIP, REGISTRATION, SYSTEM] }
        title: { type: string, examples: ['Nouvelle demande de devis — Chef privé (MP-2026-0142)'] }
        link: { type: [string, 'null'] }
        readAt: { oneOf: [{ $ref: '#/components/schemas/DateTime' }, { type: 'null' }] }
        createdAt: { $ref: '#/components/schemas/DateTime' }

    # ─────────────────────────── Admin — Dashboard ──────────────────
    Kpi:
      type: object
      required: [value]
      properties:
        value: { type: [number, 'null'] }
        previous: { type: [number, 'null'] }
        deltaPercent: { type: [number, 'null'], description: Évolution par rapport à la période précédente. }
        unit: { type: [string, 'null'], examples: ['/5'] }

    Dashboard:
      type: object
      required: [range, kpis, requestsSeries, byCategory, latestRequests, todo, surveys, newsletter, visits]
      properties:
        range: { type: string, enum: [7d, 30d, 12m] }
        kpis:
          type: object
          required: [newRequests, quotesInProgress, servicesCompleted, satisfaction]
          properties:
            newRequests: { $ref: '#/components/schemas/Kpi' }
            quotesInProgress: { $ref: '#/components/schemas/Kpi' }
            servicesCompleted: { $ref: '#/components/schemas/Kpi' }
            satisfaction: { $ref: '#/components/schemas/Kpi' }
        requestsSeries:
          type: array
          description: Demandes reçues par semaine (par mois pour 12m) ; le dernier point est la période en cours.
          items:
            type: object
            required: [label, start, count]
            properties:
              label: { type: string, examples: [S42] }
              start: { type: string, format: date }
              count: { type: integer }
        byCategory:
          type: array
          items:
            type: object
            required: [slug, name, count, percent]
            properties:
              slug: { $ref: '#/components/schemas/Slug' }
              name: { type: string }
              count: { type: integer }
              percent: { type: number }
        latestRequests: { type: array, maxItems: 5, items: { $ref: '#/components/schemas/RequestListItem' } }
        todo:
          type: object
          required: [reviewsToValidate, unreadApplications, appointmentsToConfirm, partnershipRequests, newRegistrations]
          properties:
            reviewsToValidate: { type: integer }
            unreadApplications: { type: integer }
            appointmentsToConfirm: { type: integer }
            partnershipRequests: { type: integer }
            newRegistrations: { type: integer }
        surveys:
          type: object
          required: [sent, answered, responseRate]
          properties:
            sent: { type: integer }
            answered: { type: integer }
            responseRate: { type: number, description: Pourcentage 0–100. }
        newsletter:
          type: object
          required: [subscribers, newThisPeriod]
          properties:
            subscribers: { type: integer }
            newThisPeriod: { type: integer }
        visits:
          description: Visites (GA4 Data API) ; `null` si non configuré.
          oneOf:
            - type: object
              required: [total, deltaPercent]
              properties:
                total: { type: integer }
                deltaPercent: { type: [number, 'null'] }
            - type: 'null'
        sidebarCounts: { $ref: '#/components/schemas/SidebarCounts' }

    SidebarCounts:
      type: object
      description: Compteurs de la barre latérale.
      required: [requests, appointments, reviews, applications]
      properties:
        requests: { type: integer, description: Demandes « Nouvelle ». }
        appointments: { type: integer, description: RDV « À confirmer ». }
        reviews: { type: integer, description: Avis « À valider ». }
        applications: { type: integer, description: Candidatures « Nouveau ». }

    # ─────────────────────────── Admin — Demandes ───────────────────
    RequestType:
      type: string
      enum: [DEVIS, CONTACT, INFORMATION, INSCRIPTION, FORMATION, CANDIDATURE, PARTENARIAT, EVENEMENT, RENDEZ_VOUS]
      description: Libellés — Devis, Contact, Information, Inscription, Formation, Candidature, Partenariat, Événement, Rendez-vous.

    RequestStatus:
      type: string
      enum: [NOUVELLE, EN_COURS, PRESTATION_REALISEE, CLOTUREE]
      description: Libellés — Nouvelle, En cours, Prestation réalisée, Clôturée.

    RequestStatusCounts:
      type: object
      required: [ALL, NOUVELLE, EN_COURS, PRESTATION_REALISEE, CLOTUREE]
      properties:
        ALL: { type: integer }
        NOUVELLE: { type: integer }
        EN_COURS: { type: integer }
        PRESTATION_REALISEE: { type: integer }
        CLOTUREE: { type: integer }

    ContactProfile:
      type: string
      enum: [PARTICULIER, PROFESSIONNEL]

    ContactSummary:
      type: object
      required: [id, fullName, email]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        fullName: { type: string }
        initials: { type: string }
        email: { $ref: '#/components/schemas/Email' }
        phone: { type: [string, 'null'] }
        country: { type: [string, 'null'] }
        city: { type: [string, 'null'] }
        profile: { $ref: '#/components/schemas/ContactProfile' }

    RequestListItem:
      type: object
      required: [id, reference, type, status, contact, createdAt]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        reference: { $ref: '#/components/schemas/Reference' }
        type: { $ref: '#/components/schemas/RequestType' }
        status: { $ref: '#/components/schemas/RequestStatus' }
        contact: { $ref: '#/components/schemas/ContactSummary' }
        service:
          oneOf:
            - type: object
              required: [id, name, slug]
              properties:
                id: { $ref: '#/components/schemas/Id' }
                name: { type: string }
                slug: { $ref: '#/components/schemas/Slug' }
            - type: 'null'
        category: { oneOf: [{ $ref: '#/components/schemas/CategoryRef' }, { type: 'null' }] }
        subject: { type: [string, 'null'], description: 'Libellé court (service, formation, poste, événement…).' }
        assignedTo: { oneOf: [{ $ref: '#/components/schemas/UserRef' }, { type: 'null' }] }
        createdAt: { $ref: '#/components/schemas/DateTime' }

    RequestNote:
      type: object
      required: [id, body, author, createdAt]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        body: { type: string }
        author: { $ref: '#/components/schemas/UserRef' }
        createdAt: { $ref: '#/components/schemas/DateTime' }

    RequestEvent:
      type: object
      required: [id, kind, label, createdAt]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        kind:
          type: string
          enum: [RECEIVED, ACK_SENT, TEAM_ALERT_SENT, STATUS_CHANGED, ASSIGNED, NOTE_ADDED, SURVEY_SCHEDULED, SURVEY_SENT, SURVEY_REMINDED, SURVEY_ANSWERED, EMAIL_SENT, ANONYMIZED, DUPLICATED]
        label: { type: string, description: Libellé prêt à afficher, examples: ['Statut : Nouvelle → En cours'] }
        actor: { oneOf: [{ $ref: '#/components/schemas/UserRef' }, { type: 'null' }] }
        data: { type: [object, 'null'], additionalProperties: true }
        createdAt: { $ref: '#/components/schemas/DateTime' }

    Attachment:
      type: object
      required: [id, fileName, mimeType, size]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        fileName: { type: string }
        mimeType: { type: string }
        size: { type: integer }

    RequestField:
      type: object
      description: Information affichée dans le panneau de détail (libellé + valeur formatée).
      required: [label, value]
      properties:
        key: { type: string }
        label: { type: string, examples: [Nombre de personnes] }
        value: { type: string, examples: ['12'] }

    RequestDetail:
      allOf:
        - $ref: '#/components/schemas/RequestListItem'
        - type: object
          required: [fields, notes, history, attachments, consentAt]
          properties:
            contactPreference: { oneOf: [{ $ref: '#/components/schemas/ContactPreference' }, { type: 'null' }] }
            message: { type: [string, 'null'], description: Besoin exprimé / message libre. }
            fields: { type: array, items: { $ref: '#/components/schemas/RequestField' } }
            payload: { type: object, additionalProperties: true }
            notes: { type: array, items: { $ref: '#/components/schemas/RequestNote' } }
            history: { type: array, items: { $ref: '#/components/schemas/RequestEvent' } }
            attachments: { type: array, items: { $ref: '#/components/schemas/Attachment' } }
            consentAt: { $ref: '#/components/schemas/DateTime' }
            survey:
              oneOf:
                - type: object
                  required: [status]
                  properties:
                    status: { type: string, enum: [SCHEDULED, SENT, REMINDED, ANSWERED, EXPIRED] }
                    scheduledFor: { oneOf: [{ $ref: '#/components/schemas/DateTime' }, { type: 'null' }] }
                    sentAt: { oneOf: [{ $ref: '#/components/schemas/DateTime' }, { type: 'null' }] }
                    completedAt: { oneOf: [{ $ref: '#/components/schemas/DateTime' }, { type: 'null' }] }
                    rating: { type: [integer, 'null'] }
                - type: 'null'
            whatsappUrl: { type: [string, 'null'], format: uri, description: Lien wa.me avec message pré-rempli incluant la référence. }
            completedAt: { oneOf: [{ $ref: '#/components/schemas/DateTime' }, { type: 'null' }] }
            closedAt: { oneOf: [{ $ref: '#/components/schemas/DateTime' }, { type: 'null' }] }
            updatedAt: { $ref: '#/components/schemas/DateTime' }

    # ─────────────────────────── Admin — Services ───────────────────
    AdminServiceListItem:
      type: object
      required: [id, slug, name, category, status, showInMenu, sortOrder, visual, path, requests30d, updatedAt]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        slug: { $ref: '#/components/schemas/Slug' }
        name: { type: string }
        category: { $ref: '#/components/schemas/CategoryRef' }
        status: { $ref: '#/components/schemas/PublishStatus' }
        showInMenu: { type: boolean }
        featuredOnHome: { type: boolean }
        sortOrder: { type: integer }
        visual: { $ref: '#/components/schemas/Visual' }
        path: { type: string, examples: [/services/experience/chef-prive] }
        requests30d: { type: integer }
        completeness: { type: integer, minimum: 0, maximum: 100 }
        toComplete: { type: boolean }
        isDemo: { type: boolean }
        updatedAt: { $ref: '#/components/schemas/DateTime' }

    ServiceFields:
      type: object
      properties:
        name: { type: string, minLength: 2, maxLength: 120 }

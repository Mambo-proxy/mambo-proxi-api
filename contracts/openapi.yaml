      properties:
        id: { $ref: '#/components/schemas/Id' }
        kind: { type: string, enum: [REQUEST, APPOINTMENT, REVIEW, APPLICATION, PARTNERSHIP, REGISTRATION, ASSIGNMENT, SYSTEM], description: '`ASSIGNMENT` : une demande ou un rendez-vous vient de vous être assigné.' }
        title: { type: string, examples: ['Nouvelle demande de devis — Chef privé (MP-2026-0142)'] }
        link: { type: [string, 'null'] }
        readAt: { oneOf: [{ $ref: '#/components/schemas/DateTime' }, { type: 'null' }] }
        createdAt: { $ref: '#/components/schemas/DateTime' }

    # ─────────────────────────── Admin — Dashboard ──────────────────
    Kpi:
      type: object
      required: [value]
      properties:
        value: { type: [number, 'null'] }
        previous: { type: [number, 'null'] }
        deltaPercent: { type: [number, 'null'], description: Évolution par rapport à la période précédente. }
        unit: { type: [string, 'null'], examples: ['/5'] }

    Dashboard:
      type: object
      required: [range, kpis, requestsSeries, byCategory, latestRequests, todo, surveys, newsletter, visits]
      properties:
        range: { type: string, enum: [7d, 30d, 12m] }
        kpis:
          type: object
          required: [newRequests, quotesInProgress, servicesCompleted, satisfaction]
          properties:
            newRequests: { $ref: '#/components/schemas/Kpi' }
            quotesInProgress: { $ref: '#/components/schemas/Kpi' }
            servicesCompleted: { $ref: '#/components/schemas/Kpi' }
            satisfaction: { $ref: '#/components/schemas/Kpi' }
        requestsSeries:
          type: array
          description: Demandes reçues par semaine (par mois pour 12m) ; le dernier point est la période en cours.
          items:
            type: object
            required: [label, start, count]
            properties:
              label: { type: string, examples: [S42] }
              start: { type: string, format: date }
              count: { type: integer }
        byCategory:
          type: array
          items:
            type: object
            required: [slug, name, count, percent]
            properties:
              slug: { $ref: '#/components/schemas/Slug' }
              name: { type: string }
              count: { type: integer }
              percent: { type: number }
        latestRequests: { type: array, maxItems: 5, items: { $ref: '#/components/schemas/RequestListItem' } }
        todo:
          type: object
          required: [reviewsToValidate, unreadApplications, appointmentsToConfirm, partnershipRequests, newRegistrations]
          properties:
            reviewsToValidate: { type: integer }
            unreadApplications: { type: integer }
            appointmentsToConfirm: { type: integer }
            partnershipRequests: { type: integer }
            newRegistrations: { type: integer }
        surveys:
          type: object
          required: [sent, answered, responseRate]
          properties:
            sent: { type: integer }
            answered: { type: integer }
            responseRate: { type: number, description: Pourcentage 0–100. }
        newsletter:
          type: object
          required: [subscribers, newThisPeriod]
          properties:
            subscribers: { type: integer }
            newThisPeriod: { type: integer }
        visits:
          description: Visites (GA4 Data API) ; `null` si non configuré.
          oneOf:
            - type: object
              required: [total, deltaPercent]
              properties:
                total: { type: integer }
                deltaPercent: { type: [number, 'null'] }
            - type: 'null'
        sidebarCounts: { $ref: '#/components/schemas/SidebarCounts' }

    SidebarCounts:
      type: object
      description: Compteurs de la barre latérale.
      required: [requests, appointments, reviews, applications]
      properties:
        requests: { type: integer, description: Demandes « Nouvelle ». }
        appointments: { type: integer, description: RDV « À confirmer ». }
        reviews: { type: integer, description: Avis « À valider ». }
        applications: { type: integer, description: Candidatures « Nouveau ». }

    MyTasks:
      type: object
      required: [generatedAt, requests, appointments, unassigned]
      properties:
        generatedAt: { $ref: '#/components/schemas/DateTime' }
        requests:
          type: object
          required: [open, byStatus, overdue, dueToday, items]
          properties:
            open: { type: integer, minimum: 0, description: Demandes ouvertes assignées. }
            byStatus:
              type: object
              required: [NOUVELLE, EN_COURS]
              properties:
                NOUVELLE: { type: integer, minimum: 0 }
                EN_COURS: { type: integer, minimum: 0 }
            overdue: { type: integer, minimum: 0 }
            dueToday: { type: integer, minimum: 0 }
            items: { type: array, maxItems: 10, items: { $ref: '#/components/schemas/RequestListItem' } }
        appointments:
          type: object
          required: [today, toConfirm, upcoming]
          properties:
            today: { type: integer, minimum: 0, description: Rendez-vous confirmés du jour. }
            toConfirm: { type: integer, minimum: 0 }
            upcoming: { type: array, maxItems: 5, items: { $ref: '#/components/schemas/AdminAppointment' } }
        unassigned: { type: [integer, 'null'], minimum: 0, description: Demandes ouvertes non assignées (permission `requests:assign`). }

    # ─────────────────────── Admin — Statistiques ───────────────────
    AnalyticsActionCount:
      type: object
      required: [action, count]
      properties:
        action: { $ref: '#/components/schemas/AnalyticsAction' }
        label: { type: string, examples: [WhatsApp] }
        count: { type: integer, minimum: 0 }
        previous: { type: [integer, 'null'] }
        deltaPercent: { type: [number, 'null'] }

    AnalyticsSummary:
      type: object
      required: [period, from, to, generatedAt, totals, actions, series, topPages, actionsByPage, languages]
      properties:
        period: { type: string, enum: [7d, 30d, 90d] }
        from: { type: string, format: date }
        to: { type: string, format: date, description: Dernier jour inclus. }
        generatedAt: { $ref: '#/components/schemas/DateTime' }
        totals:
          type: object
          required: [visitors, pageViews, actions, consentRate]
          properties:
            visitors: { $ref: '#/components/schemas/Kpi', description: Visiteurs uniques (avec consentement). }
            pageViews: { $ref: '#/components/schemas/Kpi' }
            actions: { $ref: '#/components/schemas/Kpi', description: 'Clics et envois mesurés, toutes actions.' }
            consentRate: { type: [number, 'null'], description: 'Part des pages vues avec consentement (0–100) ; `null` sans données.' }
        actions:
          type: array
          description: Toutes les actions, de la plus fréquente à la moins fréquente (y compris à 0).
          items: { $ref: '#/components/schemas/AnalyticsActionCount' }
        series:
          type: array
          description: Un point par jour de la période.
          items:
            type: object
            required: [date, visitors, pageViews, actions]
            properties:
              date: { type: string, format: date }
              visitors: { type: integer, minimum: 0 }
              pageViews: { type: integer, minimum: 0 }
              actions: { type: integer, minimum: 0 }
        topPages:
          type: array
          maxItems: 10
          items:
            type: object
            required: [path, title, pageViews, visitors, actions]
            properties:
              path: { type: string, description: Adresse interne française de la page. }
              title: { type: string }
              pageViews: { type: integer, minimum: 0 }
              visitors: { type: integer, minimum: 0 }
              actions: { type: integer, minimum: 0 }
        actionsByPage:
          type: array
          maxItems: 10
          description: Pages générant le plus d'actions, avec le détail par action (actions à 0 omises).
          items:
            type: object
            required: [path, title, total, byAction]
            properties:
              path: { type: string }
              title: { type: string }
              total: { type: integer, minimum: 0 }
              byAction: { type: array, items: { $ref: '#/components/schemas/AnalyticsActionCount' } }
        languages:

          required: [id, name, slug, status, sortOrder, serviceCount, updatedAt]
          properties:
            id: { $ref: '#/components/schemas/Id' }
            sortOrder: { type: integer }
            serviceCount: { type: integer }
            updatedAt: { $ref: '#/components/schemas/DateTime' }

    # ─────────────────────────── Admin — Pages ──────────────────────
    AdminPageSummary:
      type: object

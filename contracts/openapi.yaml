          description: Fichier CSV (UTF-8 avec BOM, séparateur `;`, lignes CRLF), non mis en cache (`no-store`).
          headers:
            Content-Disposition:
              description: '`attachment; filename="demandes-AAAA-MM-JJ.csv"` (date de Douala).'
              schema: { type: string }
          content:
            text/csv:
              schema: { type: string }
        '400': { $ref: '#/components/responses/InvalidQuery' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /v1/admin/requests/{id}:
    get:
      tags: [Admin — Demandes]
      operationId: adminGetRequest
      x-permissions: [requests:read, requests:read-assigned]
      summary: Détail d'une demande
      description: |
        `404` pour une demande inconnue, anonymisée ou, avec la seule permission `requests:read-assigned`, qui n'est
        pas assignée à l'utilisateur connecté. `payload` : valeurs propres au formulaire (sans `fields`, renvoyés à
        part) ; libellés de l'historique calculés à la lecture.
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/IdPath' }]
      responses:
        '200':
          description: Demande.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RequestDetail' }
              examples:
                default: { $ref: '#/components/examples/AdminRequestDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Admin — Demandes]
      operationId: adminUpdateRequest
      x-permissions: [requests:write, requests:write-assigned, requests:assign]
      summary: Changer le statut ou l'assignation
      description: |
        Chaque changement de statut ou d'assignation crée un événement d'historique et une ligne du journal
        d'activité ; tous les contrôles précèdent la moindre écriture. Le passage à `PRESTATION_REALISEE` d'un devis
        planifie l'invitation au questionnaire (`surveyDelayHours` du paramètre `emails`, 24 h par défaut ;
        `survey.status = SCHEDULED`, événement `SURVEY_SCHEDULED`) et renseigne `completedAt` ; `CLOTUREE` renseigne
        `closedAt`. Le retour arrière du statut demande la permission `requests:revert-status` (administrateurs) ; il
        efface `completedAt` / `closedAt` et annule l'invitation pas encore envoyée.

        Assignation (`assignedToId`, permission `requests:assign`) : la personne doit être un membre actif pouvant traiter
        des demandes (`assignable` dans `GET /v1/admin/users/presence`), sinon `422` ; `null` retire l'assignation.
        Avec `requests:write-assigned` seulement, on peut changer le statut et l'échéance de ses propres demandes, mais
        pas les réassigner (`403`). Toute assignation crée l'événement `ASSIGNED` et prévient la personne assignée par
        une notification `ASSIGNMENT` du back-office (`GET /v1/admin/notifications`) et par l'e-mail `team-assignment`
        (désactivable dans les modèles d'e-mails) ; s'assigner soi-même ne notifie pas.

        Échéance (`dueAt`) : fixée à la réception (24 h après la demande), modifiable ; `null` = sans échéance.

        `403` : rôle insuffisant (détail en français selon le cas) ou jeton CSRF absent (`csrf-token-invalid`) ;
        `404` : demande inconnue, anonymisée ou hors du périmètre de l'utilisateur.
      security: [{ cookieAuth: [], csrfToken: [] }]
      parameters: [{ $ref: '#/components/parameters/IdPath' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                status: { $ref: '#/components/schemas/RequestStatus' }
                assignedToId: { oneOf: [{ $ref: '#/components/schemas/Id' }, { type: 'null' }] }
                dueAt: { oneOf: [{ $ref: '#/components/schemas/DateTime' }, { type: 'null' }] }
      responses:
        '200':
          description: Demande mise à jour.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RequestDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Admin — Demandes]
      operationId: adminAnonymizeRequest
      x-permissions: [requests:anonymize]
      summary: Anonymiser une demande (RGPD)
      description: |
        Efface le message, les valeurs du formulaire, la structure, l'adresse IP et l'agent utilisateur du
        consentement, le sujet libre des messages de contact, les notes internes, les noms des pièces jointes, les
        réponses libres du questionnaire et le message du rendez-vous lié ; la demande est détachée de la fiche du
        contact (fiche commune anonyme) et un événement `ANONYMIZED` est ajouté. Type, service, statut et dates
        restent pour les statistiques ; la demande n'apparaît plus dans le back-office (`404` ensuite).
      security: [{ cookieAuth: [], csrfToken: [] }]
      parameters: [{ $ref: '#/components/parameters/IdPath' }]
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/admin/requests/{id}/notes:
    post:
      tags: [Admin — Demandes]
      operationId: adminAddRequestNote
      x-permissions: [requests:write, requests:write-assigned]
      summary: Ajouter une note interne
      description: |
        Texte sans les espaces de début et de fin ; événement `NOTE_ADDED`. Avec `requests:write-assigned` seulement,
        sur ses propres demandes (les autres : `404`).

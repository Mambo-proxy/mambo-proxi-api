        workingTime: { type: [string, 'null'], maxLength: 60 }
        locationLabel: { type: [string, 'null'], maxLength: 120 }
        sectors: { type: array, maxItems: 20, items: { type: string, maxLength: 80 } }
        salary:
          oneOf: [{ $ref: '#/components/schemas/JobSalary' }, { type: 'null' }]
        schedule: { type: [string, 'null'], maxLength: 120 }
        summary: { type: string, maxLength: 1000 }
        description: { type: [string, 'null'], maxLength: 3000 }
        missions: { type: array, maxItems: 20, items: { type: string, maxLength: 300 } }
        profile: { type: array, maxItems: 20, items: { type: string, maxLength: 300 } }
        benefits: { type: array, maxItems: 20, items: { type: string, maxLength: 300 } }
        status: { $ref: '#/components/schemas/PublishStatus' }
        expiresAt: { oneOf: [{ $ref: '#/components/schemas/DateTime' }, { type: 'null' }] }

    JobOfferInput:
      allOf:
        - $ref: '#/components/schemas/JobOfferFields'
        - type: object
          required: [title, city, country, contractType, summary]


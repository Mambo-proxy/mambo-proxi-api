      summary: Détail d'un rendez-vous
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/IdPath' }]
      responses:
        '200':
          description: Rendez-vous.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminAppointment' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Admin — Rendez-vous]
      operationId: adminActOnAppointment
      x-permissions: [appointments:write, appointments:write-assigned, appointments:assign]
      summary: Confirmer, proposer un autre créneau, annuler, terminer
      description: |
        `confirm` → e-mail de confirmation avec fichier `.ics` (+ lien visio si format Visio).
        `propose` → e-mail avec bouton d'acceptation du nouveau créneau.
        `cancel` → e-mail d'annulation. `complete` → statut « Terminé ».
        `assign` (permission `appointments:assign`) → assigne le rendez-vous (`null` = retirer) ; la personne assignée
        reçoit une notification `ASSIGNMENT` et l'e-mail `team-assignment`, comme pour les demandes.
      security: [{ cookieAuth: [], csrfToken: [] }]
      parameters: [{ $ref: '#/components/parameters/IdPath' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AppointmentAction' }
      responses:
        '200':
          description: Rendez-vous mis à jour.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminAppointment' }

            type: object
            required: [title, serviceSlugs]
            properties:
              title: { type: string }
              serviceSlugs: { type: array, items: { $ref: '#/components/schemas/Slug' } }
        highlight: { oneOf: [{ $ref: '#/components/schemas/CategoryHighlight' }, { type: 'null' }] }

          type: array
          description: Langues complètes (titre et texte renseignés) ; `en` absent = « EN à traduire ».
          items: { $ref: '#/components/schemas/MagazineLanguage' }
        edition:
          type: [object, 'null']
          required: [id, label]
          properties:
            id: { $ref: '#/components/schemas/Id' }
            label: { type: string, examples: [N° 1] }
        updatedAt: { $ref: '#/components/schemas/DateTime' }

    MagazineEditionFields:
      type: object
      properties:
        number: { type: [integer, 'null'], minimum: 1, description: '`null` pour un hors-série.' }

  # ─────────────────────── Admin — Tableau de bord ────────────────
  /v1/admin/dashboard:
    get:
      tags: [Admin — Tableau de bord]
      operationId: adminGetDashboard
      x-permissions: [dashboard:read]
      summary: Indicateurs du tableau de bord
      description: |
        Indicateurs calculés selon les permissions de l'utilisateur : avec `requests:read-assigned` seulement, demandes
        et rendez-vous se limitent à ceux qui lui sont assignés ; sans permission sur les demandes (`WRITER`), les blocs
        correspondants sont vides. Le bloc « Mes tâches » est servi par `GET /v1/admin/me/tasks`, les statistiques
        d'audience par `GET /v1/admin/analytics/summary`.
      security: [{ cookieAuth: [] }]
      parameters:
        - name: range
          in: query
          schema: { type: string, enum: [7d, 30d, 12m], default: 30d }
      responses:
        '200':
          description: Tableau de bord.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Dashboard' }
              examples:
                default: { $ref: '#/components/examples/Dashboard' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /v1/admin/search:
    get:
      tags: [Admin — Tableau de bord]
      operationId: adminSearch
      x-permissions: [dashboard:read]
      summary: Recherche globale (palette ⌘K)
      description: Seuls les groupes et éléments accessibles avec les permissions de l'utilisateur sont renvoyés.
      security: [{ cookieAuth: [] }]
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 2, maxLength: 120 }
      responses:
        '200':
          description: Résultats groupés.
          content:
            application/json:
              schema:
                type: object
                required: [groups]
                properties:
                  groups:
                    type: array
                    items:
                      type: object
                      required: [kind, label, items]
                      properties:
                        kind: { type: string, enum: [requests, contacts, services, jobs, pages] }
                        label: { type: string, examples: [Demandes] }
                        items:
                          type: array
                          items:
                            type: object
                            required: [id, title, href]
                            properties:
                              id: { type: string }
                              title: { type: string }
                              subtitle: { type: [string, 'null'] }
                              href: { type: string }
              example:
                groups:
                  - kind: requests
                    label: Demandes
                    items: [{ id: clx8n0a1b0009mp9a1c2d3e4f, title: MP-2026-0142 · Aminata Diallo, subtitle: Chef privé · Nouvelle, href: '/admin/demandes?id=clx8n0a1b0009mp9a1c2d3e4f' }]
        '401': { $ref: '#/components/responses/Unauthorized' }


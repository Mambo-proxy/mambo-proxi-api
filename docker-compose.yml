# Environnement de développement local : base, file d'attente, stockage objet S3, e-mails.
# Démarrage : docker compose up -d
name: mambo-proxi

services:
  postgres:
    image: postgres:18.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: mambo
      POSTGRES_PASSWORD: mambo
      POSTGRES_DB: mambo_proxi
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U mambo -d mambo_proxi']
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8.10.2-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  # Stockage objet compatible S3 (les images communautaires MinIO ne sont plus publiées).
  s3:
    image: chrislusf/seaweedfs:4.48
    restart: unless-stopped
    command: ['server', '-dir=/data', '-s3', '-s3.port=8333', '-s3.config=/etc/seaweedfs/s3.json']
    ports:
      - '8333:8333'
    volumes:
      - s3-data:/data
      - ./docker/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro

  mailpit:
    image: axllent/mailpit:v1.31.4
    restart: unless-stopped
    ports:
      - '1025:1025' # SMTP
      - '8025:8025' # interface web : http://localhost:8025
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 'true'
      MP_SMTP_AUTH_ALLOW_INSECURE: 'true'

volumes:
  postgres-data:
  redis-data:
  s3-data:

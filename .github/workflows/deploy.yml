name: Déploiement

# Lancé à la demande seulement (onglet Actions ou `gh workflow run deploy.yml`) : construit les images, les pousse dans
# le registre GitHub (ghcr.io), puis déploie sur le VPS par SSH (docs/DEPLOIEMENT.md).
# Secrets de dépôt : VPS_HOST, VPS_USER, VPS_SSH_KEY (clé privée de l'utilisateur deploy), VPS_KNOWN_HOSTS.
on:
  workflow_dispatch:
    inputs:
      deployer:
        description: 'Déployer sur le serveur après la construction (sinon : images seulement)'
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/mambo-proxy/mambo-proxi-api

jobs:
  image:
    name: Images (construction et envoi dans ghcr.io)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Image d'exécution (API et workers)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: true
          provenance: false
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha,scope=runtime
          cache-to: type=gha,mode=max,scope=runtime
      - name: Image des outils (migrations, seed)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: tools
          push: true
          provenance: false
          tags: |
            ${{ env.IMAGE }}:tools-${{ github.sha }}
            ${{ env.IMAGE }}:tools-latest
          cache-from: |
            type=gha,scope=runtime
            type=gha,scope=tools
          cache-to: type=gha,mode=max,scope=tools

  deploy:
    name: Déploiement sur le serveur (SSH)
    needs: image
    if: inputs.deployer
    runs-on: ubuntu-latest
    steps:
      - name: Clé SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Copie des fichiers de déploiement et deploy.sh
        env:
          HOST: ${{ secrets.VPS_HOST }}
          USER: ${{ secrets.VPS_USER }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
          TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          image="$IMAGE:$TAG"
          # Script exécuté sur le serveur par l'utilisateur deploy : connexion au registre (jeton éphémère du workflow,
          # lu sur l'entrée standard), copie des fichiers de déploiement contenus dans l'image (/app/deploy →
          # /opt/mambo, sans toucher au .env), puis deploy.sh.
          script=$(cat <<EOF
          set -euo pipefail
          docker login ghcr.io -u '$ACTOR' --password-stdin
          docker pull --quiet $image
          cid=\$(docker create $image)
          trap 'docker rm -f \$cid >/dev/null' EXIT
          docker cp \$cid:/app/deploy/. /opt/mambo/
          chmod 0755 /opt/mambo/*.sh
          bash /opt/mambo/deploy.sh $TAG
          EOF
          )
          printf '%s' "$TOKEN" | ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes "$USER@$HOST" "$script"

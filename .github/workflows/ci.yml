name: CI

# Lancée à la demande seulement (onglet Actions ou `gh workflow run ci.yml -f …`), job par job : la suite complète
# est longue. Un job en échec se relance seul avec `gh run rerun <id> --failed`.
on:
  workflow_dispatch:
    inputs:
      contrat:
        description: 'Contrat OpenAPI (lint)'
        type: boolean
        default: true
      api:
        description: 'API (lint, types, build, tests)'
        type: boolean
        default: true
      tests_seuls:
        description: 'API : sauter lint, format, types, build et tests unitaires (garder migrations, seed et e2e sur base réelle)'
        type: boolean
        default: false
      e2e_filtre:
        description: 'Fichiers ou motifs Vitest des tests e2e (ex. « test/admin-catalog ») ; vide = tous'
        type: string
        default: ''

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Contrat OpenAPI
    if: inputs.contrat
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm contract:lint

  api:
    name: API (lint, types, build, tests)
    if: inputs.api
    runs-on: ubuntu-latest
    services:
      # Mêmes images et identifiants que docker-compose.yml.
      postgres:
        image: postgres:18.4-alpine
        env:
          POSTGRES_USER: mambo
          POSTGRES_PASSWORD: mambo
          POSTGRES_DB: mambo_proxi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mambo -d mambo_proxi"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:8.10.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://mambo:mambo@localhost:5432/mambo_proxi?schema=public
      REDIS_URL: redis://localhost:6379
      # Comptes du seed (base jetable de la CI) : administratrice et comptes de démonstration avec mot de passe.
      SEED_ADMIN_EMAIL: mireille@mamboproxi.com
      SEED_ADMIN_NAME: Mireille Bell
      SEED_ADMIN_PASSWORD: ci-mot-de-passe-administratrice
      SEED_DEMO_PASSWORD: ci-mot-de-passe-demonstration
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Client Prisma
        run: pnpm prisma:generate
      - run: pnpm lint
        if: ${{ !inputs.tests_seuls }}
      - run: pnpm format:check
        if: ${{ !inputs.tests_seuls }}
      - run: pnpm typecheck
        if: ${{ !inputs.tests_seuls }}
      - run: pnpm build
        if: ${{ !inputs.tests_seuls }}
      - name: Migrations
        if: hashFiles('prisma/migrations/**/migration.sql') != ''
        run: pnpm db:deploy
      - name: Données initiales (seed)
        if: hashFiles('prisma/migrations/**/migration.sql') != ''
        run: pnpm db:seed
      - name: Tests unitaires
        if: ${{ !inputs.tests_seuls }}
        run: pnpm test
      # Filtre passé par l'environnement (pas d'interpolation dans le script) ; découpé en arguments à dessein.
      - name: Tests e2e (PostgreSQL et Redis réels)
        run: pnpm test:e2e $E2E_FILTRE
        env:
          E2E_REAL_SERVICES: 'true'
          E2E_FILTRE: ${{ inputs.e2e_filtre }}

# Production sur un serveur unique (VPS Contabo, Ubuntu 24.04) : site, API, base et file d'attente. docs/DEPLOIEMENT.md.
# Copié dans /opt/mambo par le déploiement ; variables lues dans /opt/mambo/.env (modèle : .env.production.example).
# IMAGE_TAG (API) et WEB_IMAGE_TAG (site) sont fournis par deploy.sh et deploy-web.sh (SHA des commits déployés).
name: mambo

x-logging: &logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '5'

x-api-env: &api-env
  NODE_ENV: production
  # Services internes du réseau compose (jamais exposés sur Internet).
  DATABASE_URL: postgresql://mambo:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant dans .env}@postgres:5432/mambo_proxi?schema=public
  REDIS_URL: redis://redis:6379
  API_URL: https://${API_DOMAIN:?API_DOMAIN manquant dans .env}
  MEDIA_PUBLIC_URL: ${MEDIA_PUBLIC_URL:-https://${API_DOMAIN}/v1/media}

services:
  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp' # HTTP/3
    environment:
      API_DOMAIN: ${API_DOMAIN}
      WEB_DOMAIN: ${WEB_DOMAIN:?WEB_DOMAIN manquant dans .env}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL manquant dans .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    mem_limit: 256m
    logging: *logging

  # Site public et back-office (image de mambo-proxi-web, déployée par son propre workflow : deploy-web.sh).
  web:
    image: ${WEB_IMAGE_REPO:-ghcr.io/mambo-proxy/mambo-proxi-web}:${WEB_IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      # Appels serveur (pages, back-office) par le réseau interne, sans repasser par Internet.
      API_INTERNAL_URL: http://api:4000
      REVALIDATE_SECRET: ${REVALIDATE_SECRET:?REVALIDATE_SECRET manquant dans .env}
      SITE_ENV: ${SITE_ENV:-production}
      MAINTENANCE_MODE: ${MAINTENANCE_MODE:-}
      NODE_OPTIONS: --max-old-space-size=512
    volumes:
      - web-cache:/app/.next/cache
    mem_limit: 768m
    logging: *logging

  # API et workers dans le même processus (MAIL_WORKER=on : e-mails, médias, rappels, campagnes, tâches planifiées
  # dont la sauvegarde pg_dump quotidienne).
  api:
    image: ${API_IMAGE_REPO:-ghcr.io/mambo-proxy/mambo-proxi-api}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      <<: *api-env
      MAIL_WORKER: 'on'
      NODE_OPTIONS: --max-old-space-size=768
    volumes:
      - storage:/app/var/storage
      - media:/app/var/media
      - backups:/app/var/backups
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    mem_limit: 1g
    logging: *logging

  # Commandes ponctuelles (image « tools ») : migrations à chaque déploiement, seed à la première mise en place.
  #   docker compose --profile tools run --rm migrate                      # prisma migrate deploy
  #   docker compose --profile tools run --rm -e SEED_DEMO=false migrate prisma db seed
  migrate:
    profiles: ['tools']
    image: ${API_IMAGE_REPO:-ghcr.io/mambo-proxy/mambo-proxi-api}:tools-${IMAGE_TAG:-latest}
    env_file: .env
    environment:
      <<: *api-env
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 768m
    logging: *logging

  postgres:
    image: postgres:18.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: mambo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: mambo_proxi
    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - effective_cache_size=1GB
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=128MB
      - -c
      - max_connections=50
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U mambo -d mambo_proxi']
      interval: 10s
      timeout: 5s
      retries: 10
    shm_size: 256m
    mem_limit: 1g
    logging: *logging

  # File BullMQ : persistance AOF, aucune éviction (BullMQ l'exige).
  redis:
    image: redis:8.10.2-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - 'yes'
      - --maxmemory
      - 128mb
      - --maxmemory-policy
      - noeviction
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 192m
    logging: *logging

volumes:
  caddy-data:
  caddy-config:
  web-cache:
  storage:
  media:
  backups:
  postgres-data:
  redis-data:

minimumReleaseAgeExclude:
  - '@redocly/cli@2.58.1'

allowBuilds:
  # Moteur des migrations Prisma (téléchargé à l'installation).
  '@prisma/engines': true
  prisma: true
  # Binaires natifs fournis par des dépendances facultatives (@swc/core-*, @esbuild/*) : le script n'est qu'un repli.
  '@swc/core': false
  esbuild: false
  # Accélérateur facultatif de BullMQ (sérialisation) : binaire fourni par @msgpackr-extract/*.
  msgpackr-extract: false
  # argon2 : binaires précompilés fournis par le paquet (prebuilds glibc et musl, Windows, macOS) ; le script
  # `node-gyp-build` ne compile qu'en l'absence de binaire pour la plateforme.
  argon2: false
  # sharp (médiathèque) : binaires libvips précompilés fournis par les dépendances facultatives @img/sharp-* ;
  # le script d'installation ne compile qu'en l'absence de binaire pour la plateforme.
  sharp: false
  # Mesure d'installation d'un paquet tiers : refusée.
  '@scarf/scarf': false

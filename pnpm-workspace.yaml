minimumReleaseAgeExclude:
  - '@redocly/cli@2.58.1'

allowBuilds:
  # Moteur des migrations Prisma (téléchargé à l'installation).
  '@prisma/engines': true
  prisma: true
  # Binaires natifs fournis par des dépendances facultatives (@swc/core-*, @esbuild/*) : le script n'est qu'un repli.
  '@swc/core': false
  esbuild: false
  # Mesure d'installation d'un paquet tiers : refusée.
  '@scarf/scarf': false
